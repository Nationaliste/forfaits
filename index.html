  // Compte ce que la mise à jour va changer, pour l'annoncer avant de le faire.
  function bilanFusion(entrant) {
    const locaux = new Map(donnees.forfaits.map((f) => [f.id, f]));
    const bilan = { nouveaux: 0, modifies: 0, supprimes: 0 };
    for (const f of entrant.forfaits) {
      const l = locaux.get(f.id);
      if (!l) { if (!f.supprime) bilan.nouveaux++; continue; }
      if (f.maj <= l.maj) continue;
      if (f.supprime && !l.supprime) bilan.supprimes++;
      else if (!f.supprime && l.supprime) bilan.nouveaux++;
      else if (!f.supprime) bilan.modifies++;
    }
    return bilan;
  }

  /* ---------- Tableau Excel (.csv) : remplir ou mettre à jour les forfaits depuis Excel ---------- */

  // Titres de colonnes reconnus (comparés « à plat », voir norm) ; null = colonne ignorée.
  // Tout autre titre est une famille (Taximètre, Boîtier…) : celles qui existent sont reconnues,
  // les autres sont créées à l'import (et annoncées avant, pour repérer une faute de frappe).
  const COLONNES_TABLEAU = new Map([
    ['reference', 'ref'], ['designation', 'designation'], ['prixht', 'ht'], ['ht', 'ht'], ['prixttc', 'ttc'], ['ttc', 'ttc'],
    ['exemple', 'exemple'], ['modifiele', null],
  ]);
  const LIGNES_TABLEAU_MAX = 5000;
  const FAMILLES_TABLEAU_MAX = 10; // nouvelles familles par import : au-delà, c'est sans doute un mauvais fichier

  // Texte d'un fichier : UTF-8 (« CSV UTF-8 » d'Excel), sinon Windows-1252 (ancien « CSV » d'Excel).
  async function lireTexte(fichier) {
    const octets = await fichier.arrayBuffer();
    try {
      return new TextDecoder('utf-8', { fatal: true }).decode(octets);
    } catch {
      return new TextDecoder('windows-1252').decode(octets);
    }
  }

  // Découpe un CSV en lignes de cellules : séparateur « ; », virgule ou tabulation, guillemets,
  // retours à la ligne dans une cellule. Le numéro de ligne dans Excel = position + 1.
  function decouperCsv(texte) {
    const t = texte.replace(/^﻿/, '');
    const premiere = t.split(/\r?\n/, 1)[0];
    const sep = [';', '\t', ','].map((s) => [s, premiere.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
    const lignes = [];
    let ligne = [];
    let cellule = '';
    let entreGuillemets = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (entreGuillemets) {
        if (c !== '"') cellule += c;
        else if (t[i + 1] === '"') { cellule += '"'; i++; }
        else entreGuillemets = false;
      } else if (c === '"' && cellule === '') {
        entreGuillemets = true;
      } else if (c === sep) {
        ligne.push(cellule);
        cellule = '';
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && t[i + 1] === '\n') i++;
        ligne.push(cellule);
        lignes.push(ligne);
        ligne = [];
        cellule = '';
      } else {
        cellule += c;
      }
    }
    if (cellule !== '' || ligne.length) { ligne.push(cellule); lignes.push(ligne); }
    return lignes;
  }

  // Transforme le tableau en données prêtes à fusionner, ou renvoie la liste des problèmes (rien n'est modifié).
  // Un forfait garde son identifiant si sa référence existe déjà : on le met à jour au lieu de le dupliquer.
  function analyserTableau(texte) {
    const lignes = decouperCsv(texte);
    // Excel ajoute des lignes vides à la fin de chaque colonne mise en forme : on les écarte avant de compter.
    while (lignes.length && lignes[lignes.length - 1].every((c) => !String(c).trim())) lignes.pop();
    if (lignes.length > LIGNES_TABLEAU_MAX + 1) return { erreurs: [`Trop de lignes : ${LIGNES_TABLEAU_MAX} forfaits au maximum.`] };
    const colonnes = new Map(); // 'ref', 'ht'… ou 'fam:<id>' → numéro de colonne
    const famParNom = new Map(index.fams.map((f) => [norm(f.nom), f]));
    const nouvelles = new Map(); // titres inconnus : clé « à plat » → [titre, numéro de colonne]
    (lignes[0] || []).forEach((titre, i) => {
      const cle = norm(titre);
      if (!cle) return;
      const champ = COLONNES_TABLEAU.has(cle) ? COLONNES_TABLEAU.get(cle) : famParNom.has(cle) ? 'fam:' + famParNom.get(cle).id : undefined;
      if (champ === undefined) { if (!nouvelles.has(cle)) nouvelles.set(cle, [String(titre).trim(), i]); }
      else if (champ && !colonnes.has(champ)) colonnes.set(champ, i);
    });
    // Les titres obligatoires d'abord : s'il en manque un, les autres titres sont sans doute le même fichier mal lu, pas des familles.
    const manquantes = [['ref', 'Référence'], ['ht', 'Prix HT'], ['ttc', 'Prix TTC']].filter(([champ]) => !colonnes.has(champ)).map(([, nom]) => nom);
    if (manquantes.length) {
      return { erreurs: manquantes.map((nom) => `Colonne « ${nom} » introuvable : la première ligne doit contenir les titres du modèle.`) };
    }
    const problemesFamilles = [
      ...(nouvelles.size > FAMILLES_TABLEAU_MAX ? [`${nouvelles.size} colonnes inconnues : ${FAMILLES_TABLEAU_MAX} nouvelles familles au maximum par tableau. Vérifie les titres de la première ligne.`] : []),
      ...[...nouvelles.values()].filter(([titre]) => titre.length > 60).map(([titre]) => `Colonne « ${titre.slice(0, 30)}… » : nom de famille trop long (60 caractères au maximum).`),
    ];
    if (problemesFamilles.length) return { erreurs: problemesFamilles };

    // Une colonne inconnue est une nouvelle famille : créée à l'import, après confirmation.
    const maintenant = Date.now();
    let ordre = Math.max(0, ...donnees.familles.map((f) => f.ordre));
    const famillesCreees = [...nouvelles.values()].map(([titre, i]) => {
      const fam = { id: nouvelId('fam'), nom: titre, ordre: ++ordre, maj: maintenant };
      colonnes.set('fam:' + fam.id, i);
      return fam;
    });
    const toutesFamilles = [...index.fams, ...famillesCreees];
    const erreurs = [];
    const avertissements = [];
    const nouveauxElements = [];
    const elementsCrees = [];
    const elementsConnus = new Map(index.elsActifs.map((e) => [`${e.familleId}|${norm(e.nom)}`, e]));
    const lignesParRef = new Map();
    const forfaits = [];
    let avecExemples = false;
    for (let n = 1; n < lignes.length; n++) {
      const ligne = lignes[n];
      if (ligne.every((c) => !String(c).trim())) continue;
      // L'export de l'outil protège avec une apostrophe les cellules qui commencent par = + - @.
      // Dans les tableaux remplis à la main, « / » veut dire « pas de données » : même chose qu'une case vide.
      const lire = (cle) => {
        const texte = colonnes.has(cle) ? String(ligne[colonnes.get(cle)] ?? '').trim().replace(/^'(?=[=+\-@])/, '') : '';
        return texte === '/' ? '' : texte;
      };
      const ref = lire('ref');
      if (!ref) { erreurs.push(`Ligne ${n + 1} : la référence est vide.`); continue; }
      const lieu = `Ligne ${n + 1} (${ref.slice(0, 40)})`;
      if (ref.length > 80) { erreurs.push(`${lieu} : référence trop longue (80 caractères au maximum).`); continue; }
      const cleRef = ref.toLocaleUpperCase('fr');
      if (lignesParRef.has(cleRef)) { erreurs.push(`${lieu} : cette référence est déjà à la ligne ${lignesParRef.get(cleRef)}.`); continue; }
      lignesParRef.set(cleRef, n + 1);
      const ht = lirePrix(lire('ht'));
      const ttc = lirePrix(lire('ttc'));
      if (ht === null) erreurs.push(`${lieu} : prix HT ${lire('ht') ? `illisible « ${lire('ht').slice(0, 30)} »` : 'manquant'}.`);
      if (ttc === null) erreurs.push(`${lieu} : prix TTC ${lire('ttc') ? `illisible « ${lire('ttc').slice(0, 30)} »` : 'manquant'}.`);
      if (ht === null || ttc === null) continue;
      if (Math.abs(ttc - ttcDepuisHt(ht)) > TOLERANCE_TVA) avertissements.push(`${ref} : ${formatPrix(ttc)} au lieu de ${formatPrix(ttcDepuisHt(ht))}`);

      const existant = donnees.forfaits.find((f) => !f.supprime && memeRef(f.ref, ref)) || donnees.forfaits.find((f) => memeRef(f.ref, ref));
      // Une famille absente du tableau n'est pas touchée ; une cellule vide retire l'élément.
      const elements = { ...(existant?.elements ?? {}) };
      for (const fam of toutesFamilles) {
        const cle = 'fam:' + fam.id;
        if (!colonnes.has(cle)) continue;
        const nom = lire(cle);
        if (!nom) { delete elements[fam.id]; continue; }
        if (!norm(nom)) { erreurs.push(`${lieu} : ${fam.nom} « ${nom.slice(0, 30)} » illisible.`); continue; }
        const cleElement = `${fam.id}|${norm(nom)}`;
        let element = elementsConnus.get(cleElement);
        if (!element) {
          element = { id: nouvelId('elt'), familleId: fam.id, nom: nom.slice(0, 60), maj: maintenant };
          elementsConnus.set(cleElement, element);
          elementsCrees.push(element);
          nouveauxElements.push(`${fam.nom} : ${element.nom}`);
        }
        elements[fam.id] = element.id;
      }

      // Comme pour les familles : une colonne absente du tableau ne touche pas à ce que l'outil contient déjà.
      const designation = colonnes.has('designation') || !existant ? lire('designation') : existant.designation;
      const exemple = colonnes.has('exemple') || !existant ? norm(lire('exemple')) === 'oui' : !!existant.exemple;
      if (exemple) avecExemples = true;
      const inchange = existant && !existant.supprime && existant.ref === ref && existant.designation === designation
        && existant.ht === ht && existant.ttc === ttc && !existant.exemple === !exemple
        && JSON.stringify(Object.entries(existant.elements).sort()) === JSON.stringify(Object.entries(elements).sort());
      forfaits.push(inchange ? existant : {
        id: existant?.id ?? nouvelId('fft'), ref, designation, ht, ttc, elements, maj: maintenant, ...(exemple ? { exemple: true } : {}),
      });
    }
    if (!erreurs.length && !forfaits.length) erreurs.push('Le tableau ne contient aucun forfait.');
    if (erreurs.length) return { erreurs };
    try {
      // Même contrôle que pour un fichier de sauvegarde : longueurs, identifiants, prix.
      const entrant = valider({ format: FORMAT, version: VERSION_FORMAT, familles: [...donnees.familles, ...famillesCreees], elements: [...donnees.elements, ...elementsCrees], forfaits });
      return { entrant, nbForfaits: forfaits.length, nouvellesFamilles: famillesCreees.map((f) => f.nom), nouveauxElements, avertissements, avecExemples };
    } catch (err) {
      return { erreurs: [err.message] };
    }
  }

  async function importerTableau(fichier) {
    const analyse = analyserTableau(await lireTexte(fichier));
    if (analyse.erreurs) {
      const max = 12;
      await informer('Import impossible', "Le tableau n'a pas été importé : rien n'a changé. Corrige-le, enregistre-le de nouveau, puis réessaie.",
        [...analyse.erreurs.slice(0, max), ...(analyse.erreurs.length > max ? [`… et ${analyse.erreurs.length - max} autre(s) problème(s).`] : [])]);
      return;
    }
    const { entrant, nbForfaits, nouvellesFamilles, nouveauxElements, avertissements, avecExemples } = analyse;
    const bilan = bilanFusion(entrant);
    const inchanges = nbForfaits - bilan.nouveaux - bilan.modifies;
    const resume = (titre, liste) => (liste.length ? `${titre} : ${liste.slice(0, 10).join(' ; ')}${liste.length > 10 ? ` … (+${liste.length - 10})` : ''}` : null);
    // Premier remplissage : le tableau ne contient pas d'exemples, et il en reste dans l'outil.
    const exemplesRestants = !avecExemples && donnees.forfaits.some((f) => f.exemple && !f.supprime);
    const choix = await demander({
      titre: 'Importer ce tableau ?',
      message: `${fichier.name} — ${pluriel(nbForfaits, 'forfait')}.`,
      liste: [
        `${bilan.nouveaux} nouveau${bilan.nouveaux > 1 ? 'x' : ''}, ${pluriel(bilan.modifies, 'modifié')}, ${inchanges} inchangé${inchanges > 1 ? 's' : ''}. Les autres forfaits de cet appareil ne bougent pas.`,
        resume("Familles (colonnes) qui n'existent pas encore et seront créées (vérifie l'orthographe)", nouvellesFamilles),
        resume("Éléments qui n'existent pas encore et seront créés (vérifie l'orthographe)", nouveauxElements),
        resume(`TTC à vérifier (différent de HT + ${TAUX_TVA})`, avertissements),
      ].filter(Boolean),
      boutons: [
        { texte: 'Importer', valeur: 'fusion', classe: exemplesRestants ? 'btn-bord' : 'btn-rouge' },
        exemplesRestants ? { texte: 'Importer et supprimer les exemples', valeur: 'sans-exemples', classe: 'btn-rouge' } : null,
        { texte: 'Annuler', valeur: null },
      ].filter(Boolean),
    });
    if (!choix) return;
    donnees = fusionner(donnees, entrant);
    if (choix === 'sans-exemples') marquerExemplesSupprimes();
    sauver();
    if (bilan.nouveaux || bilan.modifies || nouvellesFamilles.length || nouveauxElements.length || choix === 'sans-exemples') noterModif();
    rafraichir();
    toast('Tableau importé');
  }

  async function importerFichier(fichier) {
    if (!fichier) return;
    if (fichier.size > 5 * 1024 * 1024) { await informer('Import impossible', 'Fichier trop gros pour être un fichier de forfaits.'); return; }
    if (/\.csv$/i.test(fichier.name)) { await importerTableau(fichier); return; }
    let entrant, exporteLe;
    try {
      const obj = JSON.parse(await fichier.text());
      entrant = valider(obj);
      exporteLe = Date.parse(obj.exporteLe);
    } catch (err) {
      await informer('Import impossible', err instanceof SyntaxError
        ? "Ce fichier n'est pas un fichier de forfaits. Choisis le fichier .json exporté par l'outil, ou le tableau .csv du modèle Excel."
        : err.message);
      return;
    }
    const bilan = bilanFusion(entrant);
    const nbEntrants = entrant.forfaits.filter((f) => !f.supprime).length;
    const plusAncien = derniereModif(entrant) < derniereModif(donnees);
    const choix = await demander({
      titre: 'Importer ce fichier ?',
      message: `${fichier.name} — ${Number.isFinite(exporteLe) ? 'exporté le ' + fmtDateHeure.format(new Date(exporteLe)) + ', ' : ''}${pluriel(nbEntrants, 'forfait')}.`,
      liste: [
        `Mettre à jour (conseillé) : ${bilan.nouveaux} nouveau${bilan.nouveaux > 1 ? 'x' : ''}, ${pluriel(bilan.modifies, 'modifié')}, ${pluriel(bilan.supprimes, 'supprimé')}. Garde la version la plus récente de chaque forfait.`,
        'Remplacer tout : cet appareil devient une copie exacte du fichier.',
        plusAncien ? 'Attention : ce fichier est plus ancien que tes données. « Mettre à jour » gardera tes versions plus récentes.' : null,
      ].filter(Boolean),
      boutons: [
        { texte: 'Mettre à jour', valeur: 'fusion', classe: 'btn-rouge' },
        { texte: 'Remplacer tout', valeur: 'remplacer' },
        { texte: 'Annuler', valeur: null },
      ],
    });
    if (!choix) return;
    if (choix === 'remplacer' && appareil.modifsEnAttente > 0) {
      const ok = await demander({
        titre: 'Remplacer tout ?',
        message: `Tu as ${pluriel(appareil.modifsEnAttente, 'modification')} pas encore exportée(s) sur cet appareil : elles seront perdues.`,
        boutons: [{ texte: 'Remplacer quand même', valeur: true, classe: 'btn-rouge' }, { texte: 'Annuler', valeur: false }],
      });
      if (!ok) return;
    }
    if (choix === 'fusion') {
      donnees = fusionner(donnees, entrant);
    } else {
      donnees = entrant;
      appareil.modifsEnAttente = 0;
    }
    donneesIllisibles = false;
    appareil.dernierImport = Date.now();
    demanderStockageDurable();
    sauver();
    sauverAppareil();
    rafraichir();
    toast(choix === 'fusion' ? 'Mise à jour terminée' : 'Données remplacées');
    // Deux responsables ont pu créer la même référence, ou le même élément, chacun de leur côté.
    const vues = new Map();
    const compter = (cle, libelle) => vues.set(cle, { libelle, n: (vues.get(cle)?.n || 0) + 1 });
    for (const f of index.forfaits) compter('ref|' + f.ref.trim().toLocaleUpperCase('fr'), `Référence ${f.ref}`);
    for (const e of index.elsActifs) compter(`elt|${e.familleId}|${norm(e.nom)}`, `${index.famParId.get(e.familleId).nom} : ${e.nom}`);
    const doublons = [...vues.values()].filter((v) => v.n > 1).map((v) => `${v.libelle} (${v.n} fois)`);
    if (doublons.length) await informer('Doublons à corriger', 'Après la mise à jour, ces références ou éléments existent plusieurs fois. Un responsable doit corriger :', doublons);
  }

  /* =====================================================================
     MENU, MODE MODIFICATION, AIDE
     ===================================================================== */
  function ouvrirMenu() {
    const fermerPuis = (action) => () => { dlg.close(); action(); };
    const exemples = index.forfaits.some((f) => f.exemple);
    const dlg = ouvrirDialogue({
      titre: 'Menu',
      corps: h('div', { class: 'menu-liste' },
        h('div', { class: 'menu-mode' },
          h('div', {}, h('strong', {}, 'Mode modification'), h('p', {}, 'Pour les responsables : ajouter, modifier, supprimer.')),
          h('button', {
            type: 'button', id: 'btn-mode-modif', class: 'btn ' + (appareil.modeModif ? 'btn-rouge' : 'btn-bord'),
            'aria-pressed': String(appareil.modeModif), onclick: fermerPuis(basculerModeModif),
          }, appareil.modeModif ? 'Activé' : 'Désactivé')),
        h('div', { class: 'menu-mode' },
          h('div', {}, h('strong', {}, 'Apparence'), h('p', {}, "« Auto » suit le réglage de l'appareil.")),
          choixTheme()),
        appareil.modeModif ? h('button', { type: 'button', class: 'btn btn-bord', onclick: fermerPuis(() => ouvrirFormulaire(null)) }, '+ Ajouter un forfait') : null,
        appareil.modeModif ? h('button', { type: 'button', class: 'btn btn-bord', id: 'btn-listes', onclick: fermerPuis(ouvrirListes) }, 'Listes des éléments (taximètres, boîtiers…)') : null,
        h('button', { type: 'button', class: 'btn btn-bord', onclick: fermerPuis(lancerImport) }, 'Importer (sauvegarde ou tableau Excel)'),
        h('button', { type: 'button', class: 'btn btn-bord', id: 'btn-menu-exporter', onclick: fermerPuis(ouvrirExport) }, 'Exporter (sauvegarde ou Excel)'),
        appareil.modeModif && exemples ? h('button', { type: 'button', class: 'btn btn-danger', onclick: fermerPuis(supprimerExemples) }, 'Supprimer les exemples') : null,
        h('button', { type: 'button', class: 'btn btn-bord', onclick: fermerPuis(ouvrirAide) }, "Mode d'emploi"),
        h('p', { class: 'menu-info' },
          `${pluriel(index.forfaits.length, 'forfait')} · dernier export : ${appareil.dernierExport ? dateCourte(appareil.dernierExport) : 'jamais'}`
          + ` · dernier import : ${appareil.dernierImport ? dateCourte(appareil.dernierImport) : 'jamais'} · version ${VERSION_OUTIL}`)),
    });
  }

  // Trois boutons ; le choix s'applique tout de suite et la fenêtre reste ouverte pour voir le résultat.
  function choixTheme() {
    const boutons = THEMES.map(({ valeur, libelle }) => h('button', {
      type: 'button', 'data-theme-choix': valeur,
      onclick: () => { appareil.theme = valeur; sauverAppareil(); appliquerTheme(); marquer(); },
    }, libelle));
    const marquer = () => boutons.forEach((b) => {
      const actif = b.dataset.themeChoix === appareil.theme;
      b.className = 'btn ' + (actif ? 'btn-rouge' : 'btn-bord');
      b.setAttribute('aria-pressed', String(actif));
    });
    marquer();
    return h('div', { class: 'groupe-theme', role: 'group', 'aria-label': 'Apparence' }, ...boutons);
  }

  async function basculerModeModif() {
    if (!appareil.modeModif) {
      const ok = await demander({
        titre: 'Activer le mode modification ?',
        message: 'Réservé aux 1 ou 2 responsables des forfaits.',
        liste: [
          'Avant de modifier : importe le dernier fichier du dossier OneDrive.',
          'Après avoir modifié : Exporter, puis range le fichier dans OneDrive.',
        ],
        boutons: [{ texte: 'Activer', valeur: true, classe: 'btn-rouge' }, { texte: 'Annuler', valeur: false }],
      });
      if (!ok) return;
    }
    appareil.modeModif = !appareil.modeModif;
    sauverAppareil();
    rafraichir();
    toast(appareil.modeModif ? 'Mode modification activé' : 'Mode modification désactivé');
  }

  function ouvrirAide() {
    ouvrirDialogue({
      titre: "Mode d'emploi",
      corps: h('ol', { class: 'etapes' },
        h('li', {}, h('strong', {}, 'Ouvrir : '), "sur PC, mets cette page en favori. Sur Android, ouvre-la dans Chrome, puis menu ⋮ → « Ajouter à l'écran d'accueil ». Elle marche ensuite sans internet."),
        h('li', {}, h('strong', {}, 'Chercher : '), 'tape une référence, « 3S », « M1 STD »… Chaque mot réduit la liste. Touche une suggestion pour en faire une étiquette, ou utilise les boutons sous la barre.'),
        h('li', {}, h('strong', {}, 'Être à jour : '), 'bouton Importer → choisis le fichier le plus récent du dossier OneDrive des forfaits → Mettre à jour.'),
        h('li', {}, h('strong', {}, 'Remplir avec Excel : '), 'remplis le modèle de tableau, enregistre-le en « CSV UTF-8 », puis Importer → choisis ce fichier .csv. Une colonne ou un élément nouveau est créé tout seul (annoncé avant de valider) ; un forfait dont la référence existe déjà est mis à jour.'),
        h('li', {}, h('strong', {}, 'Responsables : '), 'Menu → Mode modification. Importe avant de modifier ; après, Menu → Exporter → range le fichier dans OneDrive.'),
        h('li', {}, h('strong', {}, 'Sauvegarde : '), "le fichier dans OneDrive est la vraie sauvegarde. Le navigateur peut être vidé : ne compte pas sur lui.")),
    });
  }

  /* =====================================================================
     DÉMARRAGE
     ===================================================================== */
  const champ = $('recherche');
  champ.addEventListener('input', () => { rendreResultats(); majSuggestions(); });
  champ.addEventListener('focus', majSuggestions);
  // Petit délai : au doigt, le champ perd le focus juste avant le clic sur une suggestion.
  champ.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== champ) majSuggestions(); }, 250));
  champ.addEventListener('keydown', (ev) => {
    const n = etatUi.suggestions.length;
    if (ev.key === 'ArrowDown' && n) { ev.preventDefault(); activerSuggestion((etatUi.suggestionActive + 1) % n); }
    else if (ev.key === 'ArrowUp' && n) { ev.preventDefault(); activerSuggestion((etatUi.suggestionActive - 1 + n) % n); }
    else if (ev.key === 'Enter') {
      ev.preventDefault();
      if (etatUi.suggestionActive >= 0) choisirSuggestion(etatUi.suggestionActive, true);
      else champ.blur(); // les résultats sont déjà là : on range le clavier
    } else if (ev.key === 'Escape' && n) {
      ev.preventDefault();
      etatUi.suggestions = [];
      $('suggestions').hidden = true;
      champ.setAttribute('aria-expanded', 'false');
      champ.removeAttribute('aria-activedescendant');
    }
  });
  $('btn-vider').addEventListener('click', () => { champ.value = ''; champ.focus(); rendreResultats(); majSuggestions(); });
  $('btn-tout-effacer').addEventListener('click', toutEffacer);
  $('btn-ajouter').addEventListener('click', () => ouvrirFormulaire(null));
  $('btn-importer').addEventListener('click', lancerImport);
  $('btn-menu').addEventListener('click', ouvrirMenu);
  $('btn-rappel-exporter').addEventListener('click', ouvrirExport);
  $('fichier-import').addEventListener('change', (ev) => importerFichier(ev.target.files[0]));

  // Si la page est ouverte dans deux onglets, ils restent d'accord.
  window.addEventListener('storage', (ev) => {
    if (ev.key === CLE_DONNEES) donnees = charger();
    else if (ev.key === CLE_APPAREIL) { appareil = chargerAppareil(); appliquerTheme(); }
    else return;
    rafraichir();
  });

  // Appli reprise depuis l'arrière-plan, ou onglet laissé ouvert des jours : le rappel d'import se recalcule.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) rendreBandeaux(); });
  setInterval(rendreBandeaux, 3600000); // toutes les heures

  rafraichir();
  if (window.matchMedia('(pointer: fine)').matches) champ.focus(); // PC : on peut taper tout de suite

  // Mode hors ligne (seulement quand la page vient d'une adresse web).
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

  // Fonction exposée pour les tests automatiques.
  window.Forfaits = Object.freeze({ lirePrix });
})();
</script>
</body>
</html>
