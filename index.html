<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ============ Couleurs et réglages (noir dominant, rouge en accent) ============ */
/* Palette sombre = défaut. L'en-tête et les titres de fenêtre restent noirs dans les deux thèmes :
   ils reprennent donc cette palette même quand la page est en clair. */
:root, .entete, .dlg-tete {
  --fond: #000000;          /* fond de page, barre de recherche, champs */
  --noir: #000000;          /* en-tête et damier : ce noir ne change jamais, dans aucun thème */
  --surface: #151515;       /* cartes, fenêtres */
  --surface-2: #232323;     /* puces, encadrés, survols */
  --trait: #333333;         /* bordures discrètes */
  --trait-fort: #747474;    /* bordures des boutons et des champs : doit se voir aussi sur une carte */
  --texte: #f3f3f3;
  --texte-fort: #ffffff;    /* titres, survols */
  --texte-doux: #a3a3a3;
  --texte-pale: #7c7c7c;    /* textes d'exemple dans les champs */
  --blanc: #ffffff;         /* blanc fixe : texte sur rouge, vert et noir */
  --inverse: #ffffff;       /* bouton et pastille « inversés » (blancs en sombre, noirs en clair) */
  --inverse-texte: #121212;
  --inverse-survol: #dedede;
  --encre: #121212;         /* texte sur la barre de recherche, toujours blanche */
  --encre-douce: #5f5f5f;
  --gris-clair: #ececec;
  --rouge: #e30613;         /* rouge d'accent : fonds rouges, texte blanc dessus */
  --rouge-fonce: #b3040f;
  --rouge-vif: #ff4d5e;     /* texte rouge sur fond noir (assez contrasté pour être lu) */
  --rouge-voile: rgb(227 6 19 / 0.22);
  --vert: #1f7a3a;
  --ambre: #f2b544;         /* avertissements */
  --voile: rgb(0 0 0 / 0.75);
  --ombre-forte: 0 14px 40px rgb(0 0 0 / 0.6);
  /* Polices déjà présentes sur les appareils : l'outil marche sans internet. */
  --police: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --police-titre: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --tactile: 46px; /* boutons carrés des fenêtres */
  --zoom: 1;       /* grossissement du texte, posé par data-texte sur <html> */
}
/* Palette claire : choisie dans le Menu (ou suivant l'appareil), posée par le script sur <html>.
   La liste des suggestions est dans l'en-tête noir mais se pose sur la page : elle suit le thème. */
:root[data-theme="clair"], :root[data-theme="clair"] .suggestions {
  color-scheme: light;
  --fond: #f1f1f1;
  --surface: #ffffff;
  --surface-2: #ebebeb;
  --trait: #d6d6d6;
  --trait-fort: #858585;
  --texte: #121212;
  --texte-fort: #000000;
  --texte-doux: #525252;
  --texte-pale: #666666;
  --inverse: #121212;
  --inverse-texte: #ffffff;
  --inverse-survol: #3a3a3a;
  --rouge-vif: #cc0511;     /* le rouge d'accent, un peu plus foncé pour rester lisible sur le gris clair */
  --rouge-voile: rgb(227 6 19 / 0.1);
  --ambre: #8a5a00;
  --voile: rgb(0 0 0 / 0.55);
  --ombre-forte: 0 14px 40px rgb(0 0 0 / 0.25);
}

/* ============ Mesures (aucune couleur ici) ============ */
:root {
  --h: 36px;            /* hauteur d'une commande à la souris */
  --entete: 64px;
  --barre: 56px;
  --r: 12px;
  --r-petit: 8px;
  --r-grand: 20px;
  --rond: 999px;
  --sortie: cubic-bezier(0.16, 1, 0.3, 1);
}
/* Écran tactile (décidé une fois, au démarrage) : des commandes de 44 px. Surtout pas d'après
   data-geste : elles grossiraient au contact du doigt, le contenu bougerait et l'appui serait perdu. */
html[data-tactile] { --h: 44px; --h-ligne: 44px; --barre: 60px; } /* la barre suit ses pastilles : sinon la page défile de 4 px pour rien */
/* Familles en boutons de filtre ; les suivantes vont dans « Autres ». Le script lit ce nombre. */
.barre { --filtres: 5; }
@container page (max-width: 599px) { .entete, .barre, .plan { --h: 44px; --entete: 60px; --filtres: 3; } }

*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: dark; background: var(--fond); scrollbar-color: var(--trait-fort) transparent; accent-color: var(--rouge); }
body { margin: 0; font: 15px/1.4 var(--police); color: var(--texte); background: var(--fond); min-height: calc(100dvh / var(--zoom)); caret-color: var(--rouge); }
::selection { background: var(--rouge); color: var(--blanc); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--rouge-vif); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.pousse { flex: 1 1 0; }

/* ============ Commandes : tout est en pilule ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--h); padding: 0 16px; border-radius: var(--rond); border: 1px solid transparent;
  font-weight: 600; white-space: nowrap;
  transition: background-color .15s ease, border-color .15s ease, color .15s ease, transform .15s var(--sortie);
}
.btn:active { transform: scale(.97); }
.btn-rouge { background: var(--rouge); color: var(--blanc); }
:where(html[data-geste=souris]) .btn-rouge:hover { background: var(--rouge-fonce); }
.btn-bord { background: var(--surface-2); color: var(--texte); }
:where(html[data-geste=souris]) .btn-bord:hover { background: var(--trait); color: var(--texte-fort); }
.btn-nu { background: transparent; color: var(--texte-doux); }
:where(html[data-geste=souris]) .btn-nu:hover { background: var(--surface-2); color: var(--texte-fort); }
.btn-icone {
  display: grid; place-items: center; width: var(--h); height: var(--h); flex-shrink: 0;
  border: 0; border-radius: 50%; background: none; color: var(--texte-doux);
  transition: background-color .15s ease, color .15s ease, transform .15s var(--sortie);
}
:where(html[data-geste=souris]) .btn-icone:hover { background: var(--surface-2); color: var(--texte-fort); }
.btn-icone:active { transform: scale(.92); }
:where(html[data-geste=doigt]) :is(.btn-icone, .btn-doux, .btn-lien, .filtre, .btn-copier, .btn-plus, .menu-item, .carte-ouvrir, .suggestion):active { opacity: .6; }
.btn-doux {
  display: inline-flex; align-items: center; gap: 6px; min-height: var(--h); padding: 0 12px; border: 0; border-radius: var(--rond);
  background: none; color: var(--texte-doux); font-size: 14px; font-weight: 600; white-space: nowrap;
  transition: background-color .15s ease, color .15s ease;
}
.btn-doux svg.i { width: 16px; height: 16px; }
:where(html[data-geste=souris]) .btn-doux:hover { background: var(--surface-2); color: var(--texte-fort); }
.btn-doux[aria-expanded="true"] { background: var(--surface-2); color: var(--texte-fort); }

/* ============ En-tête : noir dans les deux thèmes, recherche au centre ============ */
.entete {
  position: sticky; top: 0; z-index: 30;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 640px) minmax(0, 1fr); align-items: center; column-gap: 16px;
  height: var(--entete); padding: 0 16px; background: var(--noir); color: var(--blanc);
}
.marque { display: flex; align-items: center; gap: 10px; min-width: 0; }
.marque-bloc { display: grid; place-items: center; width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: var(--rouge); color: var(--blanc); font: 700 18px/1 var(--police-titre); }
.marque h1 { margin: 0; font: 700 19px/1 var(--police-titre); letter-spacing: -.015em; }
.pastille-modif { padding: 3px 10px; border-radius: var(--rond); background: var(--rouge); color: var(--blanc); font-size: 12px; font-weight: 600; }
.champ-recherche { position: relative; display: flex; align-items: center; height: 44px; border-radius: var(--rond); background: var(--blanc); color: var(--encre); }
.champ-recherche:focus-within { outline: 3px solid var(--rouge-vif); outline-offset: 2px; }
.champ-recherche > svg.i { margin-left: 16px; color: var(--encre-douce); }
#recherche { flex: 1; min-width: 0; height: 100%; padding: 0 10px; border: 0; outline: 0; background: transparent; color: var(--encre); font-size: 16px; caret-color: var(--rouge); }
#recherche::placeholder { color: var(--encre-douce); opacity: 1; }
#recherche::-webkit-search-cancel-button { appearance: none; }
#btn-vider { color: var(--encre-douce); width: 36px; height: 36px; margin-right: 4px; }
:where(html[data-geste=souris]) #btn-vider:hover { background: var(--gris-clair); color: var(--encre); }
.entete-actions { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.entete .btn-icone, .entete .btn-nu { color: var(--texte); }
.suggestions {
  position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 40; margin: 0; padding: 6px; list-style: none;
  background: var(--surface); color: var(--texte); border: 1px solid var(--trait); border-radius: var(--r-grand); box-shadow: var(--ombre-forte);
}
.suggestion { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-height: var(--h); padding: 8px 12px; border-radius: 14px; cursor: pointer; }
.suggestion[aria-selected="true"] { background: var(--surface-2); }

/* ============ Barre : pastilles de filtres, nombre de forfaits, tri ============ */
.barre {
  position: sticky; top: var(--entete); z-index: 20;
  display: flex; align-items: center; gap: 4px 16px; min-height: var(--barre); padding: 8px 16px; background: var(--fond);
}
.filtres { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.filtre {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; max-width: 100%; /* un nom très long se coupe, il ne pousse pas la page */
  min-height: var(--h); padding: 0 10px 0 14px; border: 1px solid var(--trait); border-radius: var(--rond);
  background: var(--surface); color: var(--texte); font-size: 14px; font-weight: 600; white-space: nowrap;
  transition: background-color .15s ease, border-color .15s ease, color .15s ease, transform .15s var(--sortie);
}
.filtre svg.i { width: 14px; height: 14px; color: var(--texte-doux); transition: transform .2s var(--sortie); }
.filtre[aria-expanded="true"] svg.i { transform: rotate(180deg); }
.filtre:active { transform: scale(.97); }
:where(html[data-geste=souris]) .filtre:hover { background: var(--surface-2); }
/* La pastille pleine dit « choisi », partout. */
.filtre.actif { background: var(--inverse); border-color: var(--inverse); color: var(--inverse-texte); }
.filtre.actif svg.i { color: inherit; }
:where(html[data-geste=souris]) .filtre.actif:hover { background: var(--inverse-survol); border-color: var(--inverse-survol); }
.barre-suite { flex: 1 1 auto; display: flex; align-items: center; gap: 4px; min-width: 0; }
#compte { margin: 0 8px 0 0; color: var(--texte-doux); white-space: nowrap; }
#compte strong { color: var(--texte-fort); font-variant-numeric: tabular-nums; }
.barre-suite > * { flex-shrink: 0; }
.tri { display: flex; flex: 0 1 auto; min-width: 0; margin-left: auto; }
.select-pilule {
  min-height: var(--h); padding: 0 12px; border: 1px solid var(--trait); border-radius: var(--rond);
  background: var(--surface); color: var(--texte); font-size: 14px; font-weight: 600; min-width: 0; max-width: 100%; text-overflow: ellipsis;
  transition: border-color .15s ease, background-color .15s ease;
}
:where(html[data-geste=souris]) .select-pilule:hover { background: var(--surface-2); }
#btn-ajouter { margin-left: 8px; }
.court { display: none; }

.menu {
  position: absolute; z-index: 40; min-width: 232px; max-width: min(340px, calc(100% - 24px)); max-height: min(420px, calc(100dvh / var(--zoom) - 160px)); overflow: auto; padding: 6px;
  border: 1px solid var(--trait); border-radius: var(--r-grand); background: var(--surface); box-shadow: var(--ombre-forte);
  transform-origin: top left; animation: menu .18s var(--sortie);
}
@keyframes menu { from { opacity: 0; transform: translateY(-6px) scale(.97); } }
.menu-titre { margin: 8px 12px 2px; font-size: 12px; font-weight: 600; color: var(--texte-doux); }
.menu-item {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%;
  min-height: 40px; padding: 6px 12px; border: 0; border-radius: 14px; background: none; color: var(--texte);
  font-weight: 500; text-align: left; overflow-wrap: anywhere;
  transition: background-color .15s ease;
}
.menu-item .nb { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--texte-doux); white-space: nowrap; }
:where(html[data-geste=souris]) .menu-item:hover { background: var(--surface-2); }
.menu-item[aria-pressed="true"] { background: var(--inverse); color: var(--inverse-texte); font-weight: 600; }
.menu-item[aria-pressed="true"] .nb { color: inherit; }

/* ============ Plan : la liste, puis la fiche et le total ============ */
.plan { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; gap: 16px; padding: 0 12px 12px; }
.zone {
  container: zone / inline-size; min-width: 0; min-height: calc(100dvh / var(--zoom) - var(--entete) - var(--barre) - 12px);
  /* Sous la liste : la place des barres du bas (total, rappel d'export), pour atteindre le dernier forfait. */
  padding: 6px 0 calc(32px + var(--bas-total, 0px) + var(--bas-rappel, 0px)); border-radius: var(--r-grand); background: var(--surface);
}
.bandeau { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 42px; margin: 0 6px 4px; padding: 4px 4px 4px 14px; border-radius: 14px; background: var(--surface-2); font-size: 14px; color: var(--texte); }
.bandeau svg.i { color: var(--ambre); }
.bandeau p { margin: 0; flex: 1 1 120px; min-width: 0; }
.bandeau .btn { min-height: 34px; padding: 0 14px; background: var(--surface); font-size: 14px; }
:where(html[data-geste=souris]) .bandeau .btn:hover { background: var(--trait); }

.resultats { list-style: none; margin: 0; padding: 0; }
.carte {
  position: relative; isolation: isolate;
  display: grid; grid-template-columns: minmax(0, 1fr) 112px 156px 36px; column-gap: 14px; align-items: center;
  min-height: 50px; padding: 5px 16px; /* serré le 16/11/2026 (choix de l'utilisateur) : un forfait de plus sur un portable */
  scroll-margin-top: calc(var(--entete) + var(--barre) + 8px); /* un forfait rappelé par « Récents » ne se cache pas sous la barre */
}
.carte::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 0; height: 1px; background: var(--trait); pointer-events: none; }
.carte:last-child::after { display: none; }
.carte::before { content: ""; position: absolute; inset: 2px 6px 3px; z-index: -1; border-radius: 14px; transition: background-color .15s ease; }
:where(html[data-geste=souris]) .carte:hover::before { background: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); }
.resultats.entree .carte { animation: entre .36s var(--sortie) backwards; animation-delay: calc(min(var(--n), 12) * 22ms); }
@keyframes entre { from { opacity: 0; transform: translateY(8px); } }
.carte-corps { min-width: 0; }
.carte-titre-h { margin: 0; font: 600 15px/1.3 var(--police-titre); letter-spacing: -.005em; }
.carte-ouvrir { display: block; width: 100%; margin: 0; padding: 0; border: 0; background: none; font: inherit; letter-spacing: inherit; text-align: left; color: var(--texte-fort); }
.carte-ouvrir::after { content: ""; position: absolute; inset: 0; border-radius: 14px; }
.carte-ouvrir:focus-visible { outline: none; }
.carte-ouvrir:focus-visible::after { outline: 3px solid var(--rouge-vif); outline-offset: -3px; }
.carte-ouvrir > span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
svg.marque-favori { width: 14px; height: 14px; margin-right: 5px; vertical-align: -1px; color: var(--ambre); fill: currentColor; }

/* La ligne du forfait : chaque élément est un arrêt. */
.carte-arrets { display: flex; align-items: center; min-width: 0; margin: 2px 0 0; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--texte); white-space: nowrap; overflow: hidden; }
.arret { display: inline-flex; align-items: center; flex-shrink: 0; }
.arret + .arret::before { content: ""; width: 14px; height: 2px; margin-left: 7px; background: var(--trait-fort); }
.pt { display: block; flex-shrink: 0; width: 9px; height: 9px; margin-right: 6px; border: 2px solid var(--trait-fort); border-radius: 50%; }
.carte-surnoms { margin-left: 10px; color: var(--texte-doux); font-weight: 400; font-style: italic; overflow: hidden; text-overflow: ellipsis; }

.carte-prix { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; white-space: nowrap; font-family: var(--police-titre); font-variant-numeric: tabular-nums; }
.prix-ttc { font-size: 19px; font-weight: 700; letter-spacing: -.015em; color: var(--rouge-vif); }
.prix-ht { margin-top: 2px; font-size: 12.5px; color: var(--texte-doux); }

/* La référence est toujours une pilule : un clic la copie. */
.btn-copier {
  position: relative; z-index: 1; justify-self: start;
  display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-height: 32px; padding: 0 10px 0 12px;
  border: 1px solid transparent; border-radius: var(--rond); background: var(--surface-2); color: var(--texte);
  font: 600 13px/1.2 var(--police); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: left;
  transition: background-color .15s ease, border-color .15s ease, color .15s ease, transform .15s var(--sortie);
}
/* Sa zone d'appui dépasse la pilule en hauteur (44 px), sans la grossir. */
.btn-copier::after { content: ""; position: absolute; inset: -7px -1px; }
.btn-copier.grand::after { display: none; }
.btn-copier svg.i { width: 15px; height: 15px; color: var(--texte-doux); }
.btn-copier .coche { display: none; }
.btn-copier:active { transform: scale(.97); }
:where(html[data-geste=souris]) .btn-copier:hover { border-color: var(--trait-fort); }
.btn-copier.copie { background: var(--vert); border-color: var(--vert); color: var(--blanc); }
/* La pilule garde sa largeur : la référence reste en place, cachée sous « Copié ». */
.btn-copier.copie :is(.carte-ref, .fiche-ref) { visibility: hidden; }
.btn-copier.copie::before { content: "Copié"; position: absolute; left: 12px; }
.btn-copier.copie svg.i { color: var(--blanc); }
.btn-copier.copie .copier { display: none; }
.btn-copier.copie .coche { display: block; stroke-dasharray: 22; animation: trace .3s var(--sortie); }
@keyframes trace { from { stroke-dashoffset: 22; } }
.btn-copier.grand { flex: 1 1 0; justify-content: space-between; min-height: 46px; padding: 0 12px 0 14px; font-size: 15px; }
.btn-copier.grand.copie::before { left: 14px; }

.btn-plus {
  position: relative; z-index: 1; justify-self: end;
  display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%;
  background: var(--surface-2); color: var(--texte); font: 700 14px/1 var(--police-titre); font-variant-numeric: tabular-nums;
  transition: background-color .15s ease, color .15s ease, transform .15s var(--sortie);
}
.btn-plus::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; }
.btn-plus svg.i { width: 17px; height: 17px; }
.btn-plus:active { transform: scale(.9); }
:where(html[data-geste=souris]) .btn-plus:hover { background: var(--trait); color: var(--texte-fort); }
.btn-plus[data-qte] { background: var(--inverse); color: var(--inverse-texte); }
:where(html[data-geste=souris]) .btn-plus[data-qte]:hover { background: var(--inverse-survol); color: var(--inverse-texte); }
.btn-plus.vient { animation: vient .3s var(--sortie); }
@keyframes vient { from { transform: scale(.6); } }

.vide { padding: 56px 16px; text-align: center; color: var(--texte-doux); }
.vide p { margin: 0 0 16px; font: 600 18px/1.3 var(--police-titre); color: var(--texte-fort); }

/* Fenêtre sur une moitié d'écran : mêmes colonnes, plus serrées. */
@container zone (max-width: 759px) {
  .carte { grid-template-columns: minmax(0, 1fr) 104px 152px 36px; column-gap: 12px; }
  .carte-arrets { flex-wrap: wrap; row-gap: 2px; overflow: visible; }
}
/* Téléphone : le nom, sa ligne, le prix et le « + » ; le reste est dans la fiche. */
@container zone (max-width: 599px) {
  .carte { grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 4px; align-items: start; min-height: 83px; padding: 11px 14px 11px 16px; }
  .carte-corps { display: contents; }
  .carte-titre-h { grid-column: 1; grid-row: 1; }
  .carte-arrets { grid-column: 1; grid-row: 2; flex-wrap: wrap; row-gap: 2px; margin: 0; overflow: visible; }
  .carte-surnoms { margin-left: 8px; }
  .carte-prix { grid-column: 2; grid-row: 1; }
  .carte-prix .prix-ht, .carte > .btn-copier { display: none; }
  .btn-plus { grid-column: 2; grid-row: 1 / 3; align-self: end; width: 34px; height: 34px; }
  .btn-plus::after { inset: -5px; }
  .bandeau { margin: 0 8px 2px; }
}

/* ============ Fiche du forfait : sa ligne, arrêt par arrêt, jusqu'au prix ============ */
.panneau { display: none; }
.bloc { border-radius: var(--r-grand); background: var(--surface); }
.fiche-int { padding: 10px 18px 16px; }
.fiche-int.change { animation: change .24s var(--sortie); }
@keyframes change { from { opacity: 0; transform: translateY(6px); } }
.fiche-tete { display: flex; align-items: center; gap: 2px; min-height: 40px; margin-right: -8px; }
.badge-exemple { padding: 2px 10px; border-radius: var(--rond); background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--texte-doux); }
.btn-favori[aria-pressed="true"] { color: var(--ambre); }
.btn-favori[aria-pressed="true"] svg.i { fill: currentColor; }
.fiche-nom { margin: 6px 0 0; font: 600 20px/1.25 var(--police-titre); letter-spacing: -.015em; color: var(--texte-fort); overflow-wrap: anywhere; }
.fiche-surnom { margin: 4px 0 0; font-size: 14px; font-style: italic; color: var(--texte-doux); }
.trajet { list-style: none; margin: 18px 0 0; padding: 0; }
.trajet li { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr); padding-bottom: 10px; }
.trajet li::before { content: ""; position: absolute; left: 7px; top: 12px; bottom: -6px; width: 2px; background: var(--trait-fort); }
.trajet li:last-child { padding-bottom: 0; }
.trajet li:last-child::before { display: none; }
.trajet .pt { position: relative; z-index: 1; width: 16px; height: 16px; margin: 3px 0 0; border: 3px solid var(--texte); background: var(--surface); }
.trajet .fam { display: block; font-size: 12px; line-height: 1.3; color: var(--texte-doux); }
.trajet .el { display: block; font: 600 16px/1.25 var(--police-titre); color: var(--texte-fort); overflow-wrap: anywhere; }
.fiche-int.change .trajet li { animation: arret .34s var(--sortie) backwards; animation-delay: calc(var(--n) * 45ms + 40ms); }
@keyframes arret { from { opacity: 0; transform: translateX(-8px); } }
/* Le terminus : le prix. */
.trajet .terminus { padding-top: 4px; }
.trajet .terminus .pt { margin-top: 12px; border-color: var(--rouge); background: var(--rouge); box-shadow: 0 0 0 4px var(--rouge-voile); }
.ttc-grand { display: block; font: 700 42px/1 var(--police-titre); letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--rouge-vif); white-space: nowrap; }
.ttc-grand small { margin-left: 8px; font: 700 13px/1 var(--police); letter-spacing: 0; }
.ht-fiche { display: block; margin-top: 6px; font: 500 15px/1.2 var(--police-titre); font-variant-numeric: tabular-nums; color: var(--texte-doux); }
.fiche-gestes { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
/* Marges serrées : une référence de 13 caractères tient à côté du bouton dans le panneau (324 px). */
.fiche-gestes .btn { position: relative; flex: 0 0 auto; min-height: 46px; padding: 0 14px 0 10px; }
/* Quantité déjà au total : une pastille posée sur le coin du bouton, qui ne change pas sa largeur
   (sinon le bouton sauterait à la ligne entre deux appuis). */
.btn .deja {
  position: absolute; top: -7px; right: -3px; min-width: 26px; padding: 2px 7px; border: 2px solid var(--surface); border-radius: var(--rond);
  background: var(--inverse); color: var(--inverse-texte); font-size: 12px; line-height: 1.3; text-align: center; font-variant-numeric: tabular-nums;
}

/* ============ Total : sous la fiche sur grand écran, barre en bas sinon ============ */
.total-tete { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 14px 18px 4px; }
.total-tete h2 { margin: 0; font: 600 17px var(--police-titre); letter-spacing: -.01em; color: var(--texte-fort); }
.total-tete span { font-size: 13px; color: var(--texte-doux); }
.total-lignes { margin: 0; padding: 0 18px; list-style: none; }
.total-ligne { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--trait); animation: arrive .28s var(--sortie); }
@keyframes arrive { from { opacity: 0; clip-path: inset(0 0 100% 0); transform: translateY(-6px); } to { clip-path: inset(0); } }
.total-ligne-nom { font: 600 14px/1.3 var(--police-titre); color: var(--texte-fort); overflow-wrap: anywhere; }
.total-ligne-prix { font: 600 14px var(--police-titre); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.total-ligne-prix small { display: block; font: 400 12px var(--police); color: var(--texte-doux); } /* le HT de la ligne, sous son TTC */
.total-ligne-commandes { grid-column: 1 / -1; display: flex; align-items: center; gap: 2px; }
.total-ligne-commandes .btn-icone { width: var(--h-ligne, 30px); height: var(--h-ligne, 30px); background: var(--surface-2); color: var(--texte); }
.total-ligne-commandes .btn-icone svg.i { width: 14px; height: 14px; }
.total-qte { min-width: 30px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.total-ligne-commandes .total-retirer { margin-left: auto; background: none; color: var(--texte-doux); }
.total-pied { padding: 10px 18px 16px; }
.total-somme { display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 2px 12px; margin: 0 0 14px; font-family: var(--police-titre); font-variant-numeric: tabular-nums; }
.total-somme dt { font: 700 12px var(--police); color: var(--texte-doux); }
.total-somme dd { margin: 0; text-align: right; overflow: hidden; }
.total-somme .s-ht { font-size: 15px; color: var(--texte-doux); }
.total-somme .s-ttc { font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -.025em; color: var(--rouge-vif); }
.total-somme dt.s-ttc-t { color: var(--rouge-vif); }
.total-somme .roule { display: inline-block; animation: roule .28s var(--sortie); }
@keyframes roule { from { opacity: 0; transform: translateY(45%); } }
.total-boutons { display: flex; gap: 8px; }
.total-boutons .btn { flex: 1; padding: 0 8px; font-size: 14px; }
.barre-total {
  position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 45; max-width: 560px; margin: 0 auto;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 14px; min-height: 54px; padding: 8px 20px;
  border: 0; border-radius: 27px; background: var(--inverse); color: var(--inverse-texte); font-weight: 600; text-align: left; box-shadow: var(--ombre-forte);
  animation: monte .3s var(--sortie);
  transition: transform .15s var(--sortie);
}
.barre-total:active { transform: scale(.98); }
/* En grands caractères sur un petit écran, les montants passent sous « Total · N articles » au lieu de sortir de la barre. */
#barre-total-nb { white-space: nowrap; }
.barre-total-montants { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: flex-end; gap: 0 12px; margin-left: auto; font-family: var(--police-titre); font-variant-numeric: tabular-nums; white-space: nowrap; }
.barre-total-montants .b-ht { font-size: 13px; opacity: .72; }
.barre-total-montants .b-ttc { font-size: 20px; font-weight: 700; letter-spacing: -.015em; }
.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 60; max-width: calc(100vw / var(--zoom) - 32px); padding: 10px 18px; border-radius: var(--rond);
  background: var(--vert); color: var(--blanc); font-weight: 600; text-align: center; box-shadow: var(--ombre-forte);
  opacity: 0; pointer-events: none; transform: translate(-50%, 12px); transition: opacity .2s ease, transform .25s var(--sortie);
}
.toast.visible { opacity: 1; transform: translate(-50%, 0); }
/* Dans une fenêtre ouverte, le message passe en haut : le bas porte ses boutons. */
dialog > .toast { top: 16px; bottom: auto; transform: translate(-50%, -12px); }
dialog > .toast.visible { transform: translate(-50%, 0); }
/* Titres qui reçoivent le focus à l'ouverture d'une feuille, pour l'annonce : pas de cadre autour. */
.fiche-nom:focus, .total-tete h2:focus { outline: none; }

@container page (min-width: 1040px) {
  .plan { grid-template-columns: minmax(0, 1fr) 360px; padding: 0 16px 16px; }
  .zone { min-height: calc(100dvh / var(--zoom) - var(--entete) - var(--barre) - 16px); padding-bottom: calc(6px + var(--bas-rappel, 0px)); }
  .panneau {
    display: flex; flex-direction: column; gap: 12px;
    position: sticky; top: calc(var(--entete) + var(--barre)); max-height: calc(100dvh / var(--zoom) - var(--entete) - var(--barre) - 16px - var(--bas-colonne, 0px)); overflow: auto;
  }
  .panneau { scrollbar-width: thin; }
  .panneau .fiche { flex: 0 0 auto; }
  /* Le total se serre avant de sortir de l'écran : ses lignes défilent, les sommes restent visibles. */
  .panneau .total { display: flex; flex-direction: column; flex: 0 1 auto; min-height: 240px; overflow: hidden; }
  .panneau .total-lignes { flex: 1 1 auto; min-height: 0; overflow: auto; scrollbar-width: thin; }
  .carte.choisie::before { background: var(--surface-2); }
  .carte.choisie .btn-copier:not(.copie), .carte.choisie .btn-plus:not([data-qte]) { background: var(--surface); }
}
@container page (max-width: 1039px) {
  .barre { flex-wrap: wrap; align-items: center; padding: 8px 12px 6px; }
  .filtres { flex: 1 1 100%; }
  .entete { grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 12px; padding: 0 12px; }
}
@container page (max-width: 599px) {
  .long { display: none; }
  .court { display: inline; }
  .marque-texte, .pastille-modif, #btn-importer { display: none; } /* l'état des données se lit dans le Menu */
  .entete { column-gap: 8px; padding: 0 6px 0 12px; }
  .barre { position: relative; top: auto; padding: 6px 10px 2px; }
  .filtre { flex: 1 1 auto; padding: 0 10px; }
  .filtre svg.i { display: none; }
  .barre-suite { min-height: 44px; padding: 0 2px 0 6px; }
  .barre-suite .btn-doux { min-height: 44px; padding: 0 10px; }
  .select-pilule { min-height: 44px; border-color: transparent; background-color: transparent; color: var(--texte-doux); padding: 0 4px; }
  #btn-ajouter { min-height: 36px; padding: 0 12px; }
  .plan { padding: 0; }
  .zone { border-radius: var(--r-grand) var(--r-grand) 0 0; min-height: calc(100dvh / var(--zoom) - var(--entete) - 100px); }
}
/* Téléphone étroit (360 px, courant sur Android) : pastilles resserrées, sinon « Autres » passe seul sur une 2e ligne et prend la place d'un forfait. */
@container page (max-width: 374px) {
  .filtres { gap: 4px; }
  .filtre { padding: 0 6px; }
}

/* ============ Feuilles qui montent du bas (fiche et total, hors grand écran) ============ */
.feuille-bas {
  position: fixed; inset: auto 0 0 0; width: 100%; max-width: 560px; max-height: calc(100dvh / var(--zoom) - 40px); margin: 0 auto; padding: 0; overflow: auto;
  border: 0; border-radius: 26px 26px 0 0; background: var(--surface); color: var(--texte); box-shadow: var(--ombre-forte);
}
.feuille-bas[open] { animation: glisse .32s var(--sortie); }
.feuille-bas::backdrop { background: var(--voile); animation: voile .2s ease; }
@keyframes glisse { from { transform: translateY(100%); } }
@keyframes monte { from { opacity: 0; transform: translateY(10px); } }
@keyframes voile { from { opacity: 0; } }
.poignee { width: 40px; height: 4px; margin: 8px auto 0; border-radius: 2px; background: var(--trait-fort); }
.feuille-bas .fiche-int { padding: 4px 20px 20px; }
.feuille-bas .fiche-gestes .btn, .feuille-bas .btn-copier.grand { min-height: 50px; }.feuille-bas .total-tete { padding-top: 8px; align-items: center; }
@media (min-width: 600px) { .feuille-bas { bottom: 16px; border-radius: 26px; } }

/* ============ Fenêtres ============ */
.dlg { padding: 0; width: min(720px, calc(100vw / var(--zoom) - 24px)); max-width: none; max-height: calc(100dvh / var(--zoom) - 24px); overflow: hidden; border: 1px solid var(--trait); border-radius: var(--r-grand); background: var(--surface); color: var(--texte); box-shadow: var(--ombre-forte); }
.dlg[open] { display: flex; flex-direction: column; animation: monte .22s var(--sortie); }
.dlg::backdrop { background: var(--voile); animation: voile .2s ease; }
.dlg-form { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
.dlg-tete { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 22px; background: var(--noir); color: var(--blanc); border-bottom: 1px solid var(--trait); }
.dlg-tete h2 { margin: 0; font: 600 18px/1.2 var(--police-titre); letter-spacing: -.01em; overflow-wrap: anywhere; }
.dlg-tete .btn-icone { width: 44px; height: 44px; color: var(--texte); }
.dlg-corps { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 18px 22px 4px; }
.dlg-pied { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 22px 18px; }
.dlg-pied .btn { min-height: 46px; min-width: 140px; }
.note-exemple { display: flex; gap: 10px; margin: 0 0 18px; padding: 10px 14px; border-radius: 14px; background: var(--surface-2); font-size: 14px; }
.note-exemple svg.i { margin-top: 1px; color: var(--ambre); }
.champ-groupe { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.champ-groupe label { font-size: 14px; font-weight: 600; }
.champ {
  width: 100%; min-height: 46px; padding: 8px 14px; border: 1px solid var(--trait-fort); border-radius: var(--r);
  background: var(--fond); color: var(--texte); font-size: 16px;
  transition: border-color .15s ease, box-shadow .15s ease;
}
:where(html[data-geste=souris]) .champ:hover { border-color: var(--texte-doux); }
.champ:focus { border-color: var(--rouge-vif); box-shadow: 0 0 0 3px var(--rouge-voile); outline: none; }
.champ::placeholder { color: var(--texte-pale); opacity: 1; }
textarea.champ { min-height: 76px; resize: vertical; }
.ligne-prix { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.grille-familles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0 12px; }
.btn-lien { align-self: flex-start; min-height: 32px; padding: 0 12px; border: 0; border-radius: var(--rond); background: var(--surface-2); color: var(--texte); font-size: 13px; font-weight: 600; transition: background-color .15s ease; }
:where(html[data-geste=souris]) .btn-lien:hover { background: var(--trait); }
@media (max-width: 599px) {
  .dlg { width: calc(100vw / var(--zoom)); height: calc(100dvh / var(--zoom)); max-height: none; margin: 0; border: 0; border-radius: 0; }
  .dlg-pied { flex-direction: column-reverse; }
  .dlg-pied .btn { width: 100%; }
  .btn-lien { min-height: 44px; }
}
@media (max-width: 440px) { .ligne-prix { grid-template-columns: 1fr; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ============ Ce que la page ajoute au dessin de base ============ */
/* Taille des caractères, réglée par appareil (Menu → Taille du texte) : tout grossit d'un bloc,
   boutons et espaces compris, et la page se remet en page (pas de défilement horizontal).
   Piège : les tailles données en vw, vh ou dvh restent celles de l'écran réel, elles ne sont pas
   grossies ; il faut donc les diviser par --zoom (sinon fenêtres et barres du bas débordent). */
:root[data-texte="grand"] { --zoom: 1.15; zoom: 1.15; }
:root[data-texte="tres-grand"] { --zoom: 1.3; zoom: 1.3; }
html { -webkit-text-size-adjust: 100%; }
.sprite { position: absolute; width: 0; height: 0; }
/* La mise en page se règle sur la largeur de « page », pas sur celle de l'écran : en grands
   caractères, un écran de 1280 px n'a plus la place d'un écran de 1280 px. Le script lit ce que
   la feuille a décidé (panneau affiché ou non, nombre de filtres) au lieu de mesurer l'écran. */
.page { container: page / inline-size; }

.btn:disabled, .btn-icone:disabled { opacity: .35; cursor: default; transform: none; }
/* « blanc » en sombre, noir en clair : le nom est resté, il est partagé avec la branche du serveur. */
.btn-blanc { background: var(--inverse); color: var(--inverse-texte); }
:where(html[data-geste=souris]) .btn-blanc:hover { background: var(--inverse-survol); }
.btn-danger { background: transparent; color: var(--rouge-vif); border-color: var(--rouge); }
:where(html[data-geste=souris]) .btn-danger:hover { background: var(--rouge-voile); }
.btn-carre { width: var(--tactile); min-width: var(--tactile); padding: 0; }

.marque-texte { min-width: 0; }
.etat { margin: 3px 0 0; font-size: 12px; line-height: 1; color: var(--texte-doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.suggestions { max-height: calc(60vh / var(--zoom)); overflow: auto; }
:where(html[data-geste=souris]) .suggestion:hover { background: var(--surface-2); }
.suggestion-nom { font: 600 15px var(--police-titre); color: var(--texte-fort); }
.suggestion-surnom { margin-right: auto; font-size: 13px; font-style: italic; color: var(--texte-doux); }
.suggestion-info { font-size: 13px; color: var(--texte-doux); white-space: nowrap; }

/* Un nom d'élément d'une seule traite (le champ en accepte 60 caractères) ne doit pas élargir la
   page : la pastille se coupe par des points de suspension. */
.filtre { min-width: 0; max-width: 100%; }
.filtre-nom { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
/* Téléphone (écran tactile) : dès qu'une recherche est tapée, les familles cèdent leur place aux
   forfaits — clavier ouvert, on n'en voyait plus qu'un. Les filtres posés restent visibles.
   Le déclencheur est le texte du champ et NON son focus : sur le focus, la rangée revenait entre
   le doigt qui touche et le doigt qui part, le contenu redescendait et l'appui sur le forfait
   était perdu (mesuré sur les 3 moteurs). Un navigateur sans « :has() » garde simplement la rangée.
   `data-recherche` et non `data-geste` : voir `rendreResultats`. */
:where(html[data-recherche=doigt]) .page:has(#recherche:not(:placeholder-shown)) .filtre:not(.actif) { display: none; }
/* Sous 16 px, l'iPhone zoome la page quand on touche une liste. */
:where(html[data-tactile]) .select-pilule { font-size: 16px; }

.bandeaux:empty { display: none; }
.bandeau-erreur { background: var(--rouge-voile); }
.bandeau-erreur svg.i { color: var(--rouge-vif); }
/* Le rappel des exemples laisse sa place aux forfaits pendant une recherche. */
.bandeaux.en-recherche .bandeau-discret { display: none; }

.carte-elements { display: contents; list-style: none; margin: 0; padding: 0; }
.prix { display: flex; align-items: baseline; gap: 4px; }
.carte-prix .prix-ttc .prix-type { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
/* La famille (Taximètre, Boîtier…) n'est pas affichée dans la liste : l'équipe reconnaît ses
   éléments au nom. Gardée pour les lecteurs d'écran ; la fiche et les filtres, eux, la nomment. */
.el-famille { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.note-groupes { margin: 0; padding: 12px 16px 4px; color: var(--texte-doux); }
.titre-groupe { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 14px 16px 4px; }
.titre-groupe h3 { margin: 0; font: 600 15px/1.3 var(--police-titre); color: var(--texte-fort); }
.titre-groupe-compte { font-size: 13px; color: var(--texte-doux); }
.vide-boutons { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.carte-maj { margin: 14px 0 0; font-size: 13px; color: var(--texte-doux); }
/* Une référence trop longue pour tenir à côté du bouton passe au-dessus, entière. */
.fiche-gestes { flex-wrap: wrap; }
.fiche-gestes .btn-copier.grand { flex: 1 1 120px; }
.fiche-gestes .btn { flex: 1 0 auto; }

/* Total : pièce ou service ajouté à la main, et messages. */
.total-ligne-unite { flex: 1 1 auto; min-width: 0; padding: 0 8px; font-size: 13px; color: var(--texte-doux); font-variant-numeric: tabular-nums; }
.total-libre { display: grid; gap: 8px; margin: 0 0 14px; }
.total-libre .champ { min-height: 42px; }
.total-libre-prix { display: flex; gap: 8px; }
.total-libre .msg-erreur { margin: 0; }
.total-libre .msg-erreur:empty { display: none; }

/* Rappel d'export (responsables) : au-dessus de la barre du total, sans la couvrir. */
.rappel {
  position: fixed; left: 10px; right: 10px; bottom: calc(10px + var(--bas-total, 0px)); z-index: 40;
  width: calc(100vw / var(--zoom) - 20px); max-width: 560px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: 54px; padding: 6px 6px 6px 18px; border: 1px solid var(--trait-fort); border-radius: 27px;
  background: var(--surface-2); color: var(--texte); font-size: 14px; box-shadow: var(--ombre-forte);
}
.rappel p { margin: 0; flex: 1 1 0; min-width: 0; font-weight: 600; line-height: 1.25; }
.rappel .btn { min-height: 40px; }
body.avec-rappel { --bas-rappel: 64px; }
.barre-total { width: calc(100vw / var(--zoom) - 20px); }
.toast { bottom: calc(24px + var(--bas-total, 0px) + var(--bas-rappel, 0px)); }
.toast.erreur { background: var(--rouge); }

/* ============ Fenêtres : ce qui ne sert qu'à certaines ============ */
.dlg-large { width: min(720px, calc(100vw / var(--zoom) - 24px)); }
.dlg .btn { min-height: 46px; }
.dlg-message { margin: 0 0 10px; }
.dlg-liste { margin: 0 0 10px; padding-left: 20px; }
.dlg-liste li { margin-bottom: 6px; }
.champ[aria-invalid="true"] { border-color: var(--rouge-vif); } /* saisie refusée, laissée là pour être corrigée */
.qr { display: block; margin: 10px auto 0; width: min(240px, 100%); height: auto; border-radius: 8px; }
.msg-champ { margin: 0; font-size: 14px; font-weight: 600; }
.msg-champ.erreur, .msg-erreur { color: var(--rouge-vif); }
.msg-champ.attention { color: var(--ambre); }
.msg-erreur { margin: 0 0 10px; font-weight: 600; }
/* Le message reste visible en haut de la fenêtre même quand le formulaire a défilé. */
.dlg-corps > .msg-reserve:not(:empty) { position: sticky; top: 0; z-index: 1; background: var(--surface); }
/* Place gardée : si le message disparaît pendant un clic, la liste ne remonte pas (Safari perdrait le clic). */
.msg-reserve { min-height: 1.5em; }

/* Menu */
.menu-liste { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; }
.menu-liste > .btn { justify-content: flex-start; text-align: left; white-space: normal; border-radius: 14px; }
.menu-mode { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 12px 12px 16px; border-radius: 14px; background: var(--surface-2); }
.menu-mode p { margin: 2px 0 0; font-size: 13px; color: var(--texte-doux); }
.groupe-theme { display: flex; flex: 1 1 260px; gap: 6px; }
.groupe-theme .btn { flex: 1; padding: 0 10px; }
.menu-mode .btn-bord { background: var(--surface); }
.menu-info { margin: 6px 0 0; font-size: 13px; color: var(--texte-doux); }

/* Ordre des filtres (Menu) : une ligne par famille, sa place puis ses flèches. */
.ordre-ligne { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--trait); }
.ordre-place { min-width: 60px; font-size: 13px; color: var(--texte-doux); }
.ordre-nom { flex: 1; font-weight: 600; color: var(--texte-fort); }
/* Listes des éléments */
.famille-bloc { border-radius: 14px; background: var(--surface-2); padding: 12px; margin-bottom: 12px; }
.famille-tete { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.famille-tete .champ { flex: 1 1 160px; width: auto; font-weight: 600; }
.famille-bloc .btn-bord { background: var(--surface); }
.liste-elements { list-style: none; margin: 10px 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.liste-elements li { display: flex; gap: 8px; align-items: center; }
.element-ligne { flex-wrap: wrap; }
.element-ligne > .champ:first-child { flex: 1; width: auto; min-width: 0; }
.element-ligne .champ-surnoms { order: 3; flex-basis: 100%; }
.ajout-ligne { display: flex; gap: 8px; }
.ajout-ligne .champ { flex: 1; width: auto; min-width: 0; }
.aide-texte { margin: 0 0 14px; color: var(--texte-doux); }
.etapes { margin: 0; padding: 0 0 14px 22px; }
.etapes li { margin-bottom: 10px; }
.surnom-mien { flex: 1; overflow-wrap: anywhere; }
.surnom-conflit { font-size: 13px; color: var(--ambre); }
.titre-recap { margin: 18px 0 6px; font: 600 15px var(--police-titre); }
.recap-surnoms { margin: 0; padding: 0 0 14px 18px; color: var(--texte-doux); }

@media (max-width: 599px) {
  /* Le bouton principal en premier, sous le pouce ; les autres dessous. */
  .dlg-pied .btn-rouge, .dlg-pied .btn-blanc { order: -1; }
  /* Le rappel d'export tient sur une ligne : sur deux, avec le total, plus aucun forfait n'était
     visible sur le téléphone d'un responsable. La consigne cachée ici est redite par la fenêtre d'export. */
  .rappel-suite { display: none; }
  /* Les feuilles du bas sont hors de « page » : même taille de commandes que le reste du téléphone. */
  .feuille-bas { --h: 44px; --h-ligne: 44px; }
}
/* Téléphone tourné : l'écran ne fait plus que ~375 px de haut. L'en-tête s'aplatit et la barre des
   filtres ne reste plus collée, pour garder des forfaits visibles ; tout revient en se retournant. */
@media (orientation: landscape) and (max-height: 540px) {
  .entete, .barre, .plan { --entete: 52px; }
  .champ-recherche { height: 40px; }
  /* Trois pastilles et « Autres » : les filtres, le nombre de forfaits et le tri tiennent sur une ligne. */
  .barre { --filtres: 3; position: relative; top: auto; min-height: 0; padding-top: 6px; padding-bottom: 4px; }
  .filtres { flex: 0 1 auto; }
  .filtre { padding: 0 12px; }
  .filtre svg.i, #btn-ajouter .long, .rappel-suite { display: none; } /* même chez un responsable, la barre tient sur une ligne */
  .etat { display: none; }
  /* Rappel d'export et total à la fois : côte à côte, pas empilés (l'un sur l'autre ils prenaient
     128 px des 375 de l'écran, et il restait 41 px du premier forfait). */
  body.avec-rappel:has(#barre-total:not([hidden])) { --bas-rappel: 0px; }
  body.avec-rappel:has(#barre-total:not([hidden])) .rappel { left: 10px; right: auto; bottom: 10px; width: calc(50vw / var(--zoom) - 15px); max-width: none; margin: 0; }
  body.avec-rappel .barre-total { left: auto; right: 10px; width: calc(50vw / var(--zoom) - 15px); max-width: none; margin: 0; }
  /* La fiche sur deux colonnes : la ligne et son prix à gauche, copier et ajouter à droite, qui
     restent à l'écran sans passer devant le prix quand la fiche est plus haute que le téléphone. */
  .feuille-bas { max-height: calc(100dvh / var(--zoom) - 12px); }
  .feuille-bas .fiche-int { display: grid; grid-template-columns: minmax(0, 1fr) minmax(200px, 42%); column-gap: 20px; }
  .feuille-bas .fiche-int > * { grid-column: 1 / -1; }
  .feuille-bas .fiche-int > .trajet { grid-column: 1; }
  .feuille-bas .fiche-int > .fiche-gestes { grid-column: 2; align-self: end; position: sticky; bottom: 16px; margin: 0; }
  .suggestions { max-height: calc(45vh / var(--zoom)); }
}

/* Page d'ordi peu haute : la fiche et le total ne tiennent pas l'un sous l'autre (le total sortait de
   l'écran). Le total devient la barre, rangée sous le panneau, qui ouvre sa feuille. Le script lit
   --total et pose data-total et .colonne. Seuil : 900 px de haut, multiplié par la taille du texte. */
@media (max-height: 899px) { .panneau { --total: barre; } }
@media (max-height: 1034px) { :root[data-texte="grand"] .panneau { --total: barre; } }
@media (max-height: 1169px) { :root[data-texte="tres-grand"] .panneau { --total: barre; } }
body .barre-total.colonne { left: auto; right: 16px; bottom: 16px; width: 360px; max-width: none; margin: 0; }
body:has(.barre-total.colonne:not([hidden])) .rappel { right: 392px; } /* le rappel reste sous la liste */
.panneau[data-total="barre"] .fiche-int { padding: 6px 18px 12px; }
.panneau[data-total="barre"] .fiche-nom { font-size: 18px; }
.panneau[data-total="barre"] .trajet { margin-top: 12px; }
.panneau[data-total="barre"] .trajet li { padding-bottom: 6px; }
.panneau[data-total="barre"] .trajet li:last-child { padding-bottom: 0; }
.panneau[data-total="barre"] .fiche-gestes { margin-top: 12px; }
</style>
</head>
<body>

<!-- Pictogrammes : dessinés ici une fois, repris partout par icone() (aucune image à télécharger). -->

<!-- « page » mesure la largeur réelle de la mise en page (taille du texte comprise) : la feuille de
     style s'y règle par des requêtes de conteneur, pas par la largeur de l'écran. -->
<div class="page">
<header class="entete">
  <div class="marque">
    <span class="marque-bloc" aria-hidden="true">F</span>
    <div class="marque-texte">
      <h1>Forfaits</h1>
      <p class="etat" id="etat-donnees"></p>
    </div>
    <span class="pastille-modif" id="barre-modif" hidden>Modification</span>
  </div>
  <div class="champ-recherche" role="search">
    <svg class="i" aria-hidden="true"><use href="#i-loupe"/></svg>
    <label for="recherche" class="sr">Rechercher un forfait</label>
    <input id="recherche" type="search" placeholder="Référence, taximètre, imprimante, surnom…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions">

  <div class="filtres" id="filtres" role="group" aria-label="Filtrer par élément"></div>
  <div class="barre-suite">
    <p id="compte" aria-live="polite"></p>
    <button type="button" class="btn-doux" id="btn-tout-effacer" title="Effacer la recherche et les filtres" hidden>Tout effacer</button>
    <button type="button" class="btn-doux" id="btn-recents" aria-expanded="false" aria-haspopup="true" hidden><svg class="i" aria-hidden="true"><use href="#i-horloge"/></svg>Récents</button>
    <label class="tri" id="zone-tri" hidden><span class="sr">Trier</span>
      <select id="tri" class="select-pilule">
        <option value="ref">Par référence</option>
        <option value="prix-croissant">Prix croissant</option>
        <option value="prix-decroissant">Prix décroissant</option>
      </select>

    <button type="button" class="btn btn-rouge" id="btn-ajouter" aria-label="Ajouter un forfait" hidden><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg><span class="long">Ajouter un forfait</span></button>

    <section class="bloc fiche" id="fiche" aria-label="Forfait choisi" hidden></section>

  <span id="barre-total-nb"></span>
  <span class="barre-total-montants"><span class="b-ht" id="barre-total-ht"></span><span class="b-ttc" id="barre-total-ttc"></span></span>
</button>

<!-- Hors grand écran, la fiche d'un forfait et le total montent du bas. -->
<dialog class="feuille-bas" id="dlg-fiche" aria-label="Forfait"><div id="feuille-fiche"></div></dialog>

<script>
'use strict';
(() => {
  /* =====================================================================
     RÉGLAGES
     ===================================================================== */
  const CLE_DONNEES = 'forfaits.donnees.v1';   // forfaits + listes, sur cet appareil
  const CLE_APPAREIL = 'forfaits.appareil.v1'; // réglages propres à cet appareil
  const THEMES = [{ valeur: 'sombre', libelle: 'Sombre' }, { valeur: 'clair', libelle: 'Clair' }, { valeur: 'auto', libelle: 'Auto' }];
  const TAILLES = [{ valeur: 'normal', libelle: 'Normal' }, { valeur: 'grand', libelle: 'Grand' }, { valeur: 'tres-grand', libelle: 'Très grand' }];
  const RECENTS_MAX = 4;           // derniers forfaits consultés (par appareil, jamais exporté)
  const TOTAL_MAX = 50;            // lignes du total (par appareil, jamais exporté)
  const QTE_MAX = 99;
  const USAGE_MAX = 300;          // favoris et compteurs d'usage gardés par appareil
  const FORMAT = 'forfaits-comptoir';          // signature des fichiers exportés
  const VERSION_FORMAT = 2;        // 2 : surnoms des éléments et des forfaits
  const VERSION_OUTIL = '1.0';
  const TVA = 0.2;                 // TVA 20 % : sert à contrôler le TTC saisi
  const TAUX_TVA = `${Math.round(TVA * 100)} %`;
  const TOLERANCE_TVA = 2;         // écart toléré (en centimes) entre TTC saisi et HT + TVA
  const JOURS_RAPPEL_IMPORT = 7;   // mise à jour chaque semaine : une semaine après le dernier import, on conseille de réimporter
  const SANS = '__sans__';         // valeur de filtre « sans élément de cette famille »

  const tri = new Intl.Collator('fr', { numeric: true, sensitivity: 'base' });
  const fmtEuro = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });
  const fmtDate = new Intl.DateTimeFormat('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const fmtDateHeure = new Intl.DateTimeFormat('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const $ = (id) => document.getElementById(id);

  /* =====================================================================
     PETITS OUTILS
     ===================================================================== */

  // Crée un élément HTML. Le texte est toujours inséré comme texte (jamais comme HTML) :
  // une référence contenant « <script> » s'affiche telle quelle, sans danger.
  function h(balise, attributs, ...enfants) {
    const el = document.createElement(balise);
    for (const [nom, valeur] of Object.entries(attributs || {})) {
      if (valeur === undefined || valeur === null || valeur === false) continue;
      if (typeof valeur === 'function') el.addEventListener(nom.replace(/^on/, ''), valeur);
      else if (nom === 'class') el.className = valeur;
      else el.setAttribute(nom, valeur === true ? '' : String(valeur));
    }
    for (const enfant of enfants.flat(Infinity)) {
      if (enfant === undefined || enfant === null || enfant === false || enfant === '') continue;
      el.append(enfant instanceof Node ? enfant : String(enfant));
    }
    return el;
  }

  // Identifiant unique, ex. « fft-3f9a0c1b2d4e5f60 ».
  function nouvelId(prefixe) {
    const octets = new Uint8Array(8);
    crypto.getRandomValues(octets);
    return prefixe + '-' + Array.from(octets, (o) => o.toString(16).padStart(2, '0')).join('');
  }

  // Texte « à plat » pour comparer : minuscules, sans accents, sans espaces ni tirets.
  // « T1-DEMO », « t1 demo » et « T1DEMO » donnent tous « t1demo ».
  function norm(texte) {
    return String(texte ?? '')
      .toLowerCase()
      .replace(/œ/g, 'oe').replace(/æ/g, 'ae')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]/g, '');
  }

  // Surnoms donnés par les techniciens : « le gros, pack nuit » → ['le gros', 'pack nuit'].
  // Au moins 2 lettres ou chiffres, 40 caractères, sans doublon. La saisie en refuse plus de SURNOMS_MAX
  // (avec un message) ; la lecture en garde jusqu'à 10 : ceux déjà enregistrés avant la limite ne se perdent pas.
  const SURNOMS_MAX = 3;
  function lireSurnoms(v, max = 10) { // saisie : max = Infinity, rien ne se perd avant le contrôle
    const vus = new Set();
    return (Array.isArray(v) ? v : typeof v === 'string' ? v.split(',') : [])
      .filter((s) => typeof s === 'string').map((s) => s.trim().replace(/\s+/g, ' ').slice(0, 40))
      .filter((s) => { const cle = norm(s); if (cle.length < 2 || vus.has(cle)) return false; vus.add(cle); return true; })
      .slice(0, max);
  }
  const tropDeSurnoms = (liste) => (liste.length > SURNOMS_MAX ? `${SURNOMS_MAX} surnoms au maximum.` : null);
  const avecSurnoms = (liste) => (liste.length ? { surnoms: liste } : {});
  const nouveaux = (liste, anciens = []) => liste.filter((s) => !anciens.some((a) => norm(a) === norm(s)));

  // Deux références identiques (majuscules et espaces autour ignorés).
  function memeRef(a, b) {
    return a.trim().toLocaleUpperCase('fr') === b.trim().toLocaleUpperCase('fr');
  }

  // « 1 234,50 € » ou « 1234.5 » → 123450 (centimes). null si la saisie n'est pas un prix.
  function lirePrix(saisie) {
    let t = String(saisie ?? '').replace(/[\s  €]/g, '');
    if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
    if (!/^\d{1,7}(\.\d{1,2})?$/.test(t)) return null;
    const [entier, decimales = ''] = t.split('.');
    return Number(entier) * 100 + Number(decimales.padEnd(2, '0'));
  }
  // « 1 234,50 € » : espace insécable classique, car certaines polices n'affichent pas l'espace fine.
  const formatPrix = (centimes) => fmtEuro.format(centimes / 100).replace(/ /g, ' ');
  const prixSaisie = (centimes) => (centimes / 100).toFixed(2).replace('.', ','); // « 1234,50 »
  const ttcDepuisHt = (ht) => Math.round(ht * (1 + TVA));
  const htDepuisTtc = (ttc) => Math.round(ttc / (1 + TVA));
  const dateCourte = (ms) => fmtDate.format(new Date(ms));
  const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? 's' : ''}`;

  // Horodatage pour les noms de fichiers : 2026-10-15-14h32
  function horodatage(d = new Date()) {
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}h${p(d.getMinutes())}`;
  }

  // Remplace un enregistrement (même id) ou l'ajoute. Une modification reste toujours plus récente que l'ancienne
  // version, même datée dans le futur par un appareil à l'horloge en avance : sinon la fusion la ferait perdre.
  function remplacer(liste, nouveau) {
    const i = liste.findIndex((x) => x.id === nouveau.id);
    if (i >= 0) liste[i] = { ...nouveau, maj: Math.max(nouveau.maj, liste[i].maj + 1) }; else liste.push(nouveau);
  }

  /* =====================================================================
     DONNÉES
     Trois listes : familles (Taximètre…), éléments (T1 DEMO…) et forfaits.
     Chaque enregistrement porte « maj » (date de dernière modification).
     Une suppression ne retire pas l'enregistrement : elle le marque « supprime »,
     pour que la suppression se propage aux autres appareils à l'import.
     ===================================================================== */

  function donneesInitiales() {
    const familles = [
      // Ordre voulu au comptoir : les trois familles qu'on filtre tous les jours d'abord (ce sont
      // les boutons de filtre), le reste derrière, dans « Autres ». Chaque appareil peut le changer.
      { id: 'fam-taximetre', nom: 'Taximètre', ordre: 1, maj: 0 },
      { id: 'fam-lumineux', nom: 'Lumineux', ordre: 2, maj: 0 },
      { id: 'fam-imprimante', nom: 'Imprimante', ordre: 3, maj: 0 },
      { id: 'fam-boitier', nom: 'Boîtier', ordre: 4, maj: 0 },
      { id: 'fam-installation', nom: 'Installation', ordre: 5, maj: 0 },
    ];
    // Tous les éléments de départ sont des exemples : « Supprimer les exemples » les retire (sauf ceux qu'un vrai forfait utilise).
    // Un élément sans le 4e argument serait un vrai élément de départ : le modèle Excel (outils/modele_excel.py) devrait le reprendre.
    const el = (id, familleId, nom, exemple) => ({ id, familleId, nom, maj: 0, ...(exemple ? { exemple: true } : {}) });
    const elements = [
      el('elt-t1demo', 'fam-taximetre', 'T1 DEMO', true),
      el('elt-t2', 'fam-taximetre', 'T2', true),
      el('elt-zorba5', 'fam-boitier', 'Zorba 5', true),
      el('elt-kalpox', 'fam-boitier', 'Kalpo X', true),
      el('elt-zorbatechx', 'fam-boitier', 'Zorbatech X', true),
      el('elt-kalpou', 'fam-boitier', 'Kalpo universelle', true),
      el('elt-3q', 'fam-imprimante', '3Q', true),
      el('elt-4q', 'fam-imprimante', '4Q', true),
      el('elt-ex-lumineux', 'fam-lumineux', 'Lumineux EXEMPLE', true),
      el('elt-ex-pose', 'fam-installation', 'Pose EXEMPLE', true),
    ];
    // Forfaits d'exemple : références et prix INVENTÉS, à supprimer avant de saisir les vrais.
    const f = (ref, ht, ttc, ids, texte) => {
      const elementsDuForfait = {};
      for (const id of ids) elementsDuForfait[elements.find((e) => e.id === id).familleId] = id;
      return { id: 'fft-' + norm(ref), ref, designation: 'EXEMPLE — ' + texte, ht, ttc, elements: elementsDuForfait, exemple: true, maj: 0 };
    };
    const forfaits = [
      f('EX-T1-Z5-3Q', 123450, 148140, ['elt-t1demo', 'elt-zorba5', 'elt-3q'], 'Taximètre T1 DEMO + boîtier Zorba 5 + imprimante 3Q'),
      f('EX-T1-Z5-4Q', 110000, 132000, ['elt-t1demo', 'elt-zorba5', 'elt-4q'], 'Taximètre T1 DEMO + boîtier Zorba 5 + imprimante 4Q'),
      f('EX-T1-KPX-3Q', 95000, 114000, ['elt-t1demo', 'elt-kalpox', 'elt-3q'], 'Taximètre T1 DEMO + boîtier Kalpo X + imprimante 3Q'),
      f('EX-T1-ZTX-4Q', 120000, 144000, ['elt-t1demo', 'elt-zorbatechx', 'elt-4q'], 'Taximètre T1 DEMO + boîtier Zorbatech X + imprimante 4Q'),
      f('EX-T2-Z5-3Q', 98000, 117600, ['elt-t2', 'elt-zorba5', 'elt-3q'], 'Taximètre T2 + boîtier Zorba 5 + imprimante 3Q'),
      f('EX-T2-KPX-4Q', 105000, 126000, ['elt-t2', 'elt-kalpox', 'elt-4q'], 'Taximètre T2 + boîtier Kalpo X + imprimante 4Q'),
      f('EX-T2-ZTX-3Q', 99000, 118800, ['elt-t2', 'elt-zorbatechx', 'elt-3q'], 'Taximètre T2 + boîtier Zorbatech X + imprimante 3Q'),
      f('EX-T2-KPU-4Q', 90000, 108000, ['elt-t2', 'elt-kalpou', 'elt-4q'], 'Taximètre T2 + boîtier Kalpo universelle + imprimante 4Q'),
      f('EX-T2-3Q', 70000, 84000, ['elt-t2', 'elt-3q'], 'Taximètre T2 + imprimante 3Q, sans boîtier'),
      f('EX-LUM-POSE', 45000, 54000, ['elt-ex-lumineux', 'elt-ex-pose'], 'Lumineux + pose, sans taximètre'),
      f('EX-T1-Z5-3Q-P', 115000, 138000, ['elt-t1demo', 'elt-zorba5', 'elt-3q', 'elt-ex-pose'], 'Taximètre T1 DEMO + boîtier Zorba 5 + imprimante 3Q, avec pose'),
    ];
    return { familles, elements, forfaits };
  }

  // Vérifie et nettoie des données (fichier importé ou stockage de l'appareil).
  // Lève une erreur au message compréhensible si le fichier n'est pas valable.
  function valider(obj) {
    const echec = (message) => { throw new Error(message); };
    if (!obj || typeof obj !== 'object' || Array.isArray(obj) || obj.format !== FORMAT) {
      echec("Ce n'est pas un fichier de forfaits exporté par l'outil.");
    }
    if (!Number.isInteger(obj.version) || obj.version < 1) echec('Version du fichier inconnue.');
    if (obj.version > VERSION_FORMAT) echec("Ce fichier vient d'une version plus récente de l'outil : recharge la page pour mettre l'outil à jour, puis réessaie.");
    for (const cle of ['familles', 'elements', 'forfaits']) {
      if (!Array.isArray(obj[cle])) echec(`Fichier incomplet (« ${cle} » manquant).`);
    }
    // Chaque enregistrement est borné, mais pas leur NOMBRE : un fichier à 45 000 forfaits passait
    // tous les contrôles, s'enregistrait, puis figeait l'appli à chaque ouverture (une carte par
    // forfait), menu compris — donc plus aucune réparation depuis l'outil. L'import de tableau,
    // lui, est déjà plafonné (LIGNES_TABLEAU_MAX).
    if (obj.forfaits.length > 20000 || obj.elements.length > 20000 || obj.familles.length > 500) {
      echec("Ce fichier contient beaucoup trop d'enregistrements pour être un fichier de forfaits.");
    }
    const motifId = /^[a-z]{2,6}-[a-z0-9-]{1,64}$/;
    const vus = new Set();
    const id = (v) => {
      if (typeof v !== 'string' || !motifId.test(v)) echec('Fichier abîmé : identifiant invalide.');
      if (vus.has(v)) echec('Fichier abîmé : identifiant en double.');
      vus.add(v);
      return v;
    };
    const texte = (v, max) => (typeof v === 'string' ? v.trim().slice(0, max) : '');
    // Date bornée : une date absurde (an 3000…) bloquerait l'affichage et gagnerait toutes les fusions.
    const limite = Date.now() + 86400000;
    const date = (v) => (Number.isFinite(v) && v >= 0 ? Math.min(Math.floor(v), limite) : 0);
    const marques = (x) => ({ ...(x.supprime === true ? { supprime: true } : {}), ...(x.exemple === true ? { exemple: true } : {}) });
    const objet = (x) => (x && typeof x === 'object' && !Array.isArray(x) ? x : echec('Fichier abîmé : enregistrement invalide.'));

    const familles = obj.familles.map((x) => {
      objet(x);
      const f = { id: id(x.id), nom: texte(x.nom, 60), ordre: Number.isFinite(x.ordre) ? x.ordre : 0, maj: date(x.maj), ...marques(x) };
      if (!f.supprime && !f.nom) echec('Fichier abîmé : famille sans nom.');
      return f;
    });
    const elements = obj.elements.map((x) => {
      objet(x);
      const e = { id: id(x.id), familleId: texte(x.familleId, 80), nom: texte(x.nom, 60), maj: date(x.maj), ...marques(x), ...avecSurnoms(lireSurnoms(x.surnoms)) };
      if (!e.supprime && (!e.nom || !motifId.test(e.familleId))) echec('Fichier abîmé : élément invalide.');
      return e;
    });
    const forfaits = obj.forfaits.map((x) => {
      objet(x);
      const choisis = {};
      if (x.elements && typeof x.elements === 'object' && !Array.isArray(x.elements)) {
        for (const [fam, elt] of Object.entries(x.elements).slice(0, 50)) {
          if (motifId.test(fam) && typeof elt === 'string' && motifId.test(elt)) choisis[fam] = elt;
        }
      }
      const prix = (v) => (Number.isInteger(v) && v >= 0 && v <= 999999999 ? v : null);
      const f = {
        id: id(x.id), ref: texte(x.ref, 80), designation: texte(x.designation, 2000),
        ht: prix(x.ht) ?? 0, ttc: prix(x.ttc) ?? 0, elements: choisis, maj: date(x.maj), ...marques(x), ...avecSurnoms(lireSurnoms(x.surnoms)),
      };
      if (!f.supprime && (!f.ref || prix(x.ht) === null || prix(x.ttc) === null)) echec(`Fichier abîmé : forfait « ${f.ref || '?'} » invalide.`);
      return f;
    });
    return { familles, elements, forfaits };
  }

  let stockageOk = true;      // faux si l'appareil refuse d'enregistrer (navigation privée…)
  let donneesIllisibles = false;
  // L'appareil porte des données écrites par une version plus récente de l'outil (autre onglet déjà à jour, site revenu
  // à une ancienne page) : elles sont bonnes, c'est cette page qui est en retard. Elle n'en affiche rien et n'écrit plus rien.
  let donneesFutures = false;
  let nouvelleVersion = false; // le service worker a téléchargé une version plus récente de la page

  // Vrai si ce texte du stockage a été écrit par une version de l'outil plus récente que cette page.
  function estFutur(brut) {
    try {
      const obj = JSON.parse(brut);
      return !!obj && obj.format === FORMAT && Number.isInteger(obj.version) && obj.version > VERSION_FORMAT;
    } catch {
      return false;
    }
  }

  function charger() {
    let brut = null;
    try { brut = localStorage.getItem(CLE_DONNEES); } catch { stockageOk = false; }
    // Avant tout le reste : prises pour des données abîmées, elles étaient remplacées par les exemples, et le premier
    // enregistrement écrasait les vraies. Ni copie de côté, ni exemples : des listes vides, que sauver() refuse d'écrire.
    donneesFutures = estFutur(brut);
    if (donneesFutures) return { familles: [], elements: [], forfaits: [] };
    if (brut === null) return donneesInitiales();
    try {
      return valider(JSON.parse(brut));
    } catch {
      // Données abîmées : on les met de côté plutôt que de les écraser.
      try { localStorage.setItem(CLE_DONNEES + '.illisible.' + Date.now(), brut); } catch { /* tant pis */ }
      donneesIllisibles = true;
      return donneesInitiales();
    }
  }

  // Renvoie false quand rien n'a été écrit parce que l'appareil porte des données d'une version plus récente :
  // celui qui appelle s'arrête là (« if (!sauver()) return; »), l'écran et le message sont déjà à jour.
  function sauver() {
    // Relu juste avant d'écrire : un onglet endormi a pu manquer l'annonce (événement « storage ») d'un onglet à jour.
    let brut = null;
    try { brut = localStorage.getItem(CLE_DONNEES); } catch { /* stockage refusé : rien à protéger */ }
    if (donneesFutures || estFutur(brut)) {
      refuserFutur();
      return false;
    }
    try {
      localStorage.setItem(CLE_DONNEES, JSON.stringify({ format: FORMAT, version: VERSION_FORMAT, ...donnees }));
      stockageOk = true;
    } catch {
      stockageOk = false;
    }
    return true;
  }

  const MSG_FUTUR = "Cette page est une ancienne version de l'outil : elle ne sait pas lire les forfaits de cet appareil. Recharge-la, avec Internet. Tes forfaits sont intacts.";
  const REFUS_FUTUR = "Impossible sur cette ancienne version de l'outil : recharge la page.";

  function fermerFenetres() {
    for (const dlg of document.querySelectorAll('dialog[open]')) dlg.close();
  }

  // La modification en cours n'a pas pu être enregistrée : on repart de ce que porte l'appareil, sans elle.
  function refuserFutur() {
    donnees = charger();
    appareil = chargerAppareil();
    fermerFenetres();
    rafraichir();
    toast(REFUS_FUTUR, true);
  }

  // Vrai, avec un mot à l'écran, quand cette page n'a pas le droit de toucher aux données (voir donneesFutures).
  function lectureSeule() {
    if (!donneesFutures) return false;
    toast(REFUS_FUTUR, true);
    return true;
  }

  // Comme lectureSeule(), mais sans mot à l'écran et en relisant le stockage : pour ce qui tourne tout seul (la mise à
  // jour automatique). L'onglet endormi qui a manqué l'annonce d'un onglet à jour passe ici en lecture seule.
  function pageEnRetard() {
    if (donneesFutures) return true;
    let brut = null;
    try { brut = localStorage.getItem(CLE_DONNEES); } catch { /* stockage refusé : rien à protéger */ }
    if (!estFutur(brut)) return false;
    donnees = charger();
    fermerFenetres();
    rafraichir();
    return true;
  }

  function chargerAppareil() {
    const defaut = { modeModif: false, modifsEnAttente: 0, dernierExport: 0, dernierImport: 0, theme: 'sombre', texte: 'normal', tri: 'ref', favoris: [], recents: [], ordreFams: [], usageElements: {}, usageForfaits: {}, surnoms: {}, total: [] };
    const estId = (v) => typeof v === 'string' && /^[a-z]{2,6}-[a-z0-9-]{1,64}$/.test(v);
    const compteurs = (v) => Object.fromEntries(v && typeof v === 'object' && !Array.isArray(v)
      ? Object.entries(v).filter(([id, n]) => estId(id) && Number.isInteger(n) && n > 0).slice(0, USAGE_MAX) : []);
    try {
      const lu = JSON.parse(localStorage.getItem(CLE_APPAREIL) || '{}');
      return {
        favoris: Array.isArray(lu.favoris) ? [...new Set(lu.favoris.filter(estId))].slice(0, USAGE_MAX) : [],
        // Derniers forfaits consultés, le plus récent d'abord.
        recents: Array.isArray(lu.recents) ? [...new Set(lu.recents.filter(estId))].slice(0, RECENTS_MAX) : [],
        // Ordre des familles voulu sur cet appareil (Menu → Ordre des filtres) : identifiants de familles.
        ordreFams: Array.isArray(lu.ordreFams) ? [...new Set(lu.ordreFams.filter(estId))].slice(0, USAGE_MAX) : [],
        usageElements: compteurs(lu.usageElements),
        usageForfaits: compteurs(lu.usageForfaits),
        // Surnoms perso : identifiant d'élément ou de forfait → surnoms (jamais exportés).
        surnoms: Object.fromEntries(lu.surnoms && typeof lu.surnoms === 'object' && !Array.isArray(lu.surnoms)
          ? Object.entries(lu.surnoms).filter(([id]) => estId(id)).map(([id, v]) => [id, lireSurnoms(v)]).filter(([, v]) => v.length).slice(0, USAGE_MAX) : []),
        total: Array.isArray(lu.total) ? lu.total.map(lireLigneTotal).filter(Boolean).slice(0, TOTAL_MAX) : [],
        modeModif: lu.modeModif === true,
        modifsEnAttente: Number.isInteger(lu.modifsEnAttente) && lu.modifsEnAttente > 0 ? lu.modifsEnAttente : 0,
        dernierExport: Number.isFinite(lu.dernierExport) ? lu.dernierExport : 0,
        dernierImport: Number.isFinite(lu.dernierImport) ? lu.dernierImport : 0,
        theme: THEMES.some((t) => t.valeur === lu.theme) ? lu.theme : 'sombre',
        texte: TAILLES.some((t) => t.valeur === lu.texte) ? lu.texte : 'normal',
        // Tri choisi sur cet appareil : une des valeurs de la liste « Trier », sinon l'ordre des références.
        tri: [...$('tri').options].some((o) => o.value === lu.tri) ? lu.tri : 'ref',
      };
    } catch {
      return defaut;
    }
  }
  // Une ligne du total : forfait (id) ou ligne libre (id null), prix en centimes mémorisés à l'ajout.
  function lireLigneTotal(l) {
    if (!l || typeof l !== 'object') return null;
    const centimes = (v) => Number.isInteger(v) && v >= 0 && v <= 99999999;
    const nom = typeof l.nom === 'string' ? l.nom.trim().slice(0, 80) : '';
    if (!nom || !centimes(l.ht) || !centimes(l.ttc) || !Number.isInteger(l.qte) || l.qte < 1 || l.qte > QTE_MAX) return null;
    const id = typeof l.id === 'string' && /^[a-z]{2,6}-[a-z0-9-]{1,64}$/.test(l.id) ? l.id : null;
    return { id, nom, qte: l.qte, ht: l.ht, ttc: l.ttc };
  }
  function sauverAppareil() {
    try { localStorage.setItem(CLE_APPAREIL, JSON.stringify(appareil)); } catch { stockageOk = false; }
  }
  // Ce qu'on choisit ou copie souvent remonte en tête (sur cet appareil seulement, jamais exporté).
  function noterUsage(cle, id) {
    const compteurs = appareil[cle];
    compteurs[id] = (compteurs[id] || 0) + 1;
    const autres = Object.keys(compteurs).filter((x) => x !== id);
    if (autres.length >= USAGE_MAX) delete compteurs[autres.reduce((a, b) => (compteurs[b] < compteurs[a] ? b : a))]; // oublie le moins utilisé
    sauverAppareil();
  }
  // Forfait qu'on vient de regarder (fiche ouverte, référence copiée, ajout au total) : le bouton
  // « Récents » de la barre le retrouve, le temps des quelques suivants.
  function noterConsulte(id) {
    appareil.recents = [id, ...appareil.recents.filter((x) => x !== id)].slice(0, RECENTS_MAX);
    sauverAppareil();
  }

  // À appeler après chaque changement fait sur cet appareil (sert au rappel d'export).
  function noterModif() {
    appareil.modifsEnAttente += 1;
    sauverAppareil();
    demanderStockageDurable();
    planifierEnvoi();
  }

  // Demande au navigateur de ne pas effacer les données de lui-même. Firefox pose alors une
  // question : on ne la pose qu'après une action utile (modification, import), pas à l'ouverture.
  let stockageDurableDemande = false;
  function demanderStockageDurable() {
    if (stockageDurableDemande || !navigator.storage?.persisted) return;
    stockageDurableDemande = true;
    navigator.storage.persisted().then((deja) => (deja ? true : navigator.storage.persist())).catch(() => {});
  }

  // Fusion de deux jeux de données : pour chaque enregistrement, la version la plus récente gagne.
  function fusionner(local, entrant) {
    const resultat = {};
    for (const cle of ['familles', 'elements', 'forfaits']) {
      const parId = new Map(local[cle].map((x) => [x.id, x]));
      for (const x of entrant[cle]) {
        const actuel = parId.get(x.id);
        if (!actuel || x.maj > actuel.maj) parId.set(x.id, x);
      }
      resultat[cle] = [...parId.values()];
    }
    return resultat;
  }

  // Un retour arrière doit GAGNER la fusion sur tous les appareils. Or l'ancienne version porte des
  // « maj » plus anciens que la fausse manœuvre qu'elle doit effacer : sans réhorodatage, un autre
  // appareil responsable ne fusionnerait pas et renverrait la fausse manœuvre, annulant le retour.
  function pourRetourArriere(actuel, cible, maintenant) {
    const resultat = {};
    for (const cle of ['familles', 'elements', 'forfaits']) {
      const dansCible = new Set(cible[cle].map((x) => x.id));
      const actuels = new Map(actuel[cle].map((x) => [x.id, x]));
      // Réhorodater seulement ce que le retour CHANGE (même id et même « maj » = même écriture).
      // Un enregistrement inchangé garde sa date, donc un exemple jamais touché garde sa maj 0 et
      // « Supprimer les exemples » continue de le balayer. Mais un exemple MODIFIÉ depuis la
      // version choisie doit, lui, être réhorodaté : sinon l'autre appareil responsable garderait
      // sa modification (plus récente que maj 0) et la renverrait, annulant le retour arrière
      // précisément là où il servait.
      const liste = cible[cle].map((x) => (actuels.get(x.id)?.maj === x.maj ? x : { ...x, maj: maintenant }));
      // Créé après la version choisie : le retour doit l'effacer, et une suppression est une marque.
      for (const x of actuel[cle]) if (!dansCible.has(x.id)) liste.push({ ...x, supprime: true, maj: maintenant });
      resultat[cle] = liste;
    }
    return resultat;
  }

  // Date de la dernière modification (0 = données d'exemple jamais touchées).
  function derniereModif(d) {
    let max = 0;
    for (const cle of ['familles', 'elements', 'forfaits']) {
      for (const x of d[cle]) if (x.maj > max) max = x.maj;
    }
    return max;
  }

  let donnees = charger();
  let appareil = chargerAppareil();

  // Le CSS n'a que deux palettes : « auto » est résolu ici d'après le réglage de l'appareil.
  // La taille du texte est posée de la même façon, sur <html>.
  const themeSysteme = window.matchMedia('(prefers-color-scheme: light)');
  // Aucune requête média ne distingue le doigt de la souris sur un appareil qui a les deux : sur un
  // PC à dalle tactile, Firefox et Chrome répondent « pointer: coarse » et « hover: none » même
  // avec une souris branchée (mesuré sur Windows). On suit donc le DERNIER geste : `data-geste`
  // vaut 'souris' ou 'doigt' sur <html>, et le CSS s'y accroche par `:where(…)`, qui n'ajoute
  // aucune spécificité — les égalités entre règles restent celles d'avant.
  const racine = document.documentElement;
  const auDoigt = () => racine.dataset.geste === 'doigt';
  function noterGeste(type) {
    const valeur = type === 'touch' ? 'doigt' : 'souris';
    if (racine.dataset.geste !== valeur) racine.dataset.geste = valeur;
  }
  // Au démarrage, faute de geste : un appareil qui n'a aucun pointeur fin est un téléphone.
  noterGeste(matchMedia('(any-pointer: fine)').matches ? 'mouse' : 'touch');
  // La taille des commandes, elle, se décide ici une fois pour toutes (voir --h) : un écran qu'on
  // peut toucher, même avec une souris branchée, garde des commandes de 44 px.
  if (matchMedia('(any-pointer: coarse)').matches) racine.dataset.tactile = '';
  addEventListener('pointerdown', (ev) => noterGeste(ev.pointerType), { capture: true, passive: true });
  // La souris qui bouge suffit : sur un PC hybride, le survol revient sans attendre un clic.
  addEventListener('pointermove', (ev) => { if (ev.pointerType === 'mouse') noterGeste('mouse'); },
    { capture: true, passive: true });

  function appliquerApparence() {
    const clair = appareil.theme === 'clair' || (appareil.theme === 'auto' && themeSysteme.matches);
    document.documentElement.dataset.theme = clair ? 'clair' : 'sombre';
    document.documentElement.dataset.texte = appareil.texte;
  }
  appliquerApparence();
  themeSysteme.addEventListener('change', appliquerApparence);

  /* =====================================================================
     INDEX : vues prêtes à l'emploi, recalculées après chaque changement
     ===================================================================== */
  let index = null;

  function construireIndex() {
    // Ordre des familles : celui rangé sur cet appareil d'abord ; une famille qu'il ne connaît pas
    // encore (nouvelle, ou appareil jamais réglé) passe après, dans l'ordre des données.
    const rangAppareil = new Map(appareil.ordreFams.map((id, i) => [id, i]));
    const rangFamille = (f) => (rangAppareil.has(f.id) ? rangAppareil.get(f.id) : appareil.ordreFams.length + Math.max(0, f.ordre));
    const fams = donnees.familles.filter((f) => !f.supprime)
      .sort((a, b) => rangFamille(a) - rangFamille(b) || tri.compare(a.nom, b.nom));
    const famParId = new Map(fams.map((f) => [f.id, f]));
    const rangFam = new Map(fams.map((f, i) => [f.id, i]));
