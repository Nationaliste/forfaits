  function ouvrirVersions() {
    const liste = h('div', { class: 'menu-liste', id: 'maj-liste-versions' }, h('p', { class: 'dlg-message' }, 'Chargement…'));
    const charge = async () => {
      try {
        const r = await appelCloud(cloud.adresse, '/api/versions', { jeton: cloud.jeton });
        if (!r.ok) throw new Error(`Le cloud a répondu ${r.status}.`);
        const { versions, version } = await r.json();
        liste.replaceChildren(...versions.map((v) => h('div', { class: 'menu-mode' },
          h('div', {},
            h('strong', {}, v.version === version ? 'Version actuelle' : `Version du ${fmtDateHeure.format(new Date(v.date))}`),
            h('p', {}, `Envoyée par ${v.par || 'un responsable'}${v.version === version ? '' : ` le ${fmtDateHeure.format(new Date(v.date))}`}`)),
          v.version === version ? null : h('button', {
            type: 'button', class: 'btn btn-bord', 'data-revenir': v.version,
            onclick: async () => {
              const ok = await demander({
                titre: 'Revenir à cette version ?',
                message: `Les forfaits de tous les appareils reviendront à leur état du ${fmtDateHeure.format(new Date(v.date))}. La version actuelle reste dans l'historique, donc ce retour s'annule aussi.`,
                boutons: [{ texte: 'Revenir', valeur: true, classe: 'btn-rouge' }, { texte: 'Annuler', valeur: false }],
              });
              if (!ok || pageEnRetard()) return;
              const avant = donnees;
              const p = await appelCloud(cloud.adresse, '/api/revenir', { methode: 'POST', jeton: cloud.jeton, corps: { version: v.version } });
              if (!p.ok) { await informer('Impossible', `Le cloud a répondu ${p.status}.`); return; }
              // Cette version remonte comme une nouvelle : on la relit, on la réhorodate, puis on la
              // renvoie. Sans ce renvoi, un autre appareil responsable ne fusionnerait pas (les « maj »
              // de l'ancienne version sont plus anciens) et renverrait la fausse manœuvre.
              cloud.version = null;
              cloud.aEnvoyer = false;
              sauverCloud();
              const recu = await appelCloud(cloud.adresse, '/api/donnees', { jeton: cloud.jeton });
              const etat = recu.ok ? await recu.json() : null;
              if (!etat?.blob) {
                await informer('Impossible', "Le cloud a accepté le retour mais ne rend pas encore la version : réessaie dans un instant.");
                return;
              }
              donnees = pourRetourArriere(avant, valider(await dechiffrer(etat.blob, cloud.cle)), Date.now());
              donneesIllisibles = false;
              if (!sauver()) return;
              cloud.version = etat.version;
              cloud.aEnvoyer = true;
              sauverCloud();
              rafraichir();
              dlg.close();
              toast('Forfaits revenus à la version choisie');
              synchroniser();
            },
          }, 'Revenir'))));
        if (!versions.length) liste.replaceChildren(h('p', { class: 'dlg-message' }, 'Aucune version enregistrée.'));
      } catch (err) {
        liste.replaceChildren(h('p', { class: 'msg-erreur', role: 'alert' }, err?.reseau ? 'Cloud injoignable : vérifie le réseau.' : err.message));
      }
    };
    const dlg = ouvrirDialogue({
      titre: 'Revenir à une version',
      corps: [h('p', { class: 'dlg-message' }, 'Le cloud garde les 10 derniers envois. Utile si une fausse manœuvre a touché tous les appareils.'), liste],
      pied: [h('button', { type: 'button', class: 'btn btn-bord', onclick: () => dlg.close() }, 'Fermer')],
    });
    charge();
  }

  // Bouton d'arrêt : le patron dit non, ou l'outil s'arrête. Demande le code de secours.
  function ouvrirEffacerCloud() {
    const champCode = champCloud('maj-code-effacer', { type: 'password' });
    const msgErreur = h('p', { class: 'msg-erreur', role: 'alert' });
    const bouton = h('button', { type: 'submit', class: 'btn btn-danger', id: 'maj-confirmer-effacer' }, 'Tout effacer');
    const dlg = ouvrirDialogue({
      titre: 'Tout effacer du cloud',
      surEnvoi: async () => {
        msgErreur.textContent = '';
        bouton.disabled = true;
        try {
          const r = await appelCloud(cloud.adresse, '/api/tout', { methode: 'DELETE', jeton: cloud.jeton, codeSecours: champCode.value });
          if (r.status === 401) throw new Error('Code de secours incorrect.');
          if (r.status === 503) throw new Error("Le cloud refuse : son code de secours fait moins de 12 caractères. Repose-le avec « wrangler secret put CODE_SECOURS ».");
          if (!r.ok) throw new Error(`Le cloud a répondu ${r.status}.`);
          cloud = null;
          etatSynchro = erreurSynchro = '';
          sauverCloud();
          dlg.close();
          rafraichir();
          await informer('Cloud effacé', "Il ne reste rien dans le cloud. Les forfaits sont toujours sur chaque appareil, et le partage repasse par Exporter / Importer. Les autres appareils se déconnecteront d'eux-mêmes.");
        } catch (err) {
          msgErreur.textContent = err?.reseau ? 'Cloud injoignable : vérifie le réseau.' : err.message;
          bouton.disabled = false;
        }
      },
      corps: [
        h('p', { class: 'dlg-message' }, "Efface du cloud les forfaits et tous les accès des appareils. Les forfaits déjà sur chaque appareil ne sont pas touchés : ils restent lisibles et exportables."),
        groupeCloud('Code de secours', champCode),
        msgErreur,
      ],
      pied: [bouton, h('button', { type: 'button', class: 'btn btn-bord', onclick: () => dlg.close() }, 'Annuler')],
    });
    champCode.focus();
  }

  // Deux ou trois boutons (thème, taille du texte) ; le choix s'applique tout de suite et la fenêtre
  // reste ouverte pour voir le résultat (l'événement « close » d'un dialogue part en différé).
  // Réglages de l'appareil : jamais exportés.
  function choixReglage(cle, choix, libelleGroupe) {
    const boutons = choix.map(({ valeur, libelle }) => h('button', {
      type: 'button', 'data-choix': valeur,
      onclick: () => { appareil[cle] = valeur; sauverAppareil(); appliquerApparence(); marquer(); },
    }, libelle));
    const marquer = () => boutons.forEach((b) => {
      const actif = b.dataset.choix === appareil[cle];
      b.className = 'btn ' + (actif ? 'btn-blanc' : 'btn-bord'); // plein = choisi, comme les filtres
      b.setAttribute('aria-pressed', String(actif));
    });
    marquer();
    return h('div', { class: 'groupe-theme', role: 'group', 'aria-label': libelleGroupe }, ...boutons);
  }

  async function basculerModeModif() {
    if (cloud?.role === 'consultation') {
      await informer('Appareil en consultation', "Cet appareil reçoit les mises à jour mais ne modifie pas les forfaits. Pour qu'il puisse le faire, demande un lien « Responsable » à un responsable.");
      return;
    }
    if (!appareil.modeModif) {
      const ok = await demander({
        titre: 'Activer le mode modification ?',
        message: 'Réservé aux 1 ou 2 responsables des forfaits.',
        liste: [
          'Avant de modifier : importe le dernier fichier du dossier OneDrive.',
          'Après avoir modifié : Exporter, puis range le fichier dans OneDrive.',
        ],
        boutons: [{ texte: 'Activer', valeur: true, classe: 'btn-rouge' }, { texte: 'Annuler', valeur: false }],
      });
      if (!ok) return;
    }
    appareil.modeModif = !appareil.modeModif;
    sauverAppareil();
    rafraichir();
    toast(appareil.modeModif ? 'Mode modification activé' : 'Mode modification désactivé');
  }

  champ.addEventListener('input', () => { rendreResultats(); majSuggestions(); });
  champ.addEventListener('focus', majSuggestions);
  // Petit délai : au doigt, le champ perd le focus juste avant le clic sur une suggestion.
  champ.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== champ) majSuggestions(); }, 250));
  champ.addEventListener('keydown', (ev) => {
    const n = etatUi.suggestions.length;
    if (ev.key === 'ArrowDown' && n) { ev.preventDefault(); activerSuggestion((etatUi.suggestionActive + 1) % n); }
    else if (ev.key === 'ArrowUp' && n) { ev.preventDefault(); activerSuggestion((etatUi.suggestionActive - 1 + n) % n); }
    else if (ev.key === 'Enter') {
      ev.preventDefault();
      if (etatUi.suggestionActive >= 0) choisirSuggestion(etatUi.suggestionActive, true);
      else champ.blur(); // les résultats sont déjà là : on range le clavier
    } else if (ev.key === 'Escape' && n) {
      ev.preventDefault();
      etatUi.suggestions = [];
      $('suggestions').hidden = true;
      champ.setAttribute('aria-expanded', 'false');
      champ.removeAttribute('aria-activedescendant');
    }
  });
  $('btn-vider').addEventListener('click', () => {
    champ.value = '';
    // À la souris on reste dans le champ pour retaper ; au doigt, redonner le focus ferait
    // remonter le clavier sur les forfaits qu'on vient de rendre visibles.
    if (!auDoigt()) champ.focus();
    rendreResultats();
    majSuggestions();
  });
  $('btn-tout-effacer').addEventListener('click', toutEffacer);
  $('tri').addEventListener('change', () => {
    appareil.tri = $('tri').value;
    sauverAppareil();
    rendreResultats();
  });
  $('btn-ajouter').addEventListener('click', () => ouvrirFormulaire(null));
  $('btn-importer').addEventListener('click', lancerImport);
  $('btn-menu').addEventListener('click', ouvrirMenu);
  $('btn-rappel-exporter').addEventListener('click', ouvrirExport);
  $('barre-total').addEventListener('click', ouvrirTotal);
  $('btn-recents').addEventListener('click', (ev) => ouvrirRecents(ev.currentTarget));

  // Menus de la barre (filtres, récents) : un appui ailleurs ou Échap les referme.
  addEventListener('pointerdown', (ev) => {
    if (menuOuvert && !menuOuvert.el.contains(ev.target) && !menuOuvert.ancre.contains(ev.target)) fermerMenu();
  });
  addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && menuOuvert) { ev.preventDefault(); fermerMenu(true); }
  });

  // Feuilles du bas (fiche et total, hors grand écran) : un appui à côté les referme.
  for (const feuille of [$('dlg-fiche'), $('dlg-total')]) {
    feuille.addEventListener('click', (ev) => {
      const r = feuille.getBoundingClientRect();
      if (ev.target === feuille && (ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom)) feuille.close();
    });
  }
  // La liste a pu être redessinée sous la fiche (favori) : le clavier revient au forfait qu'on regardait.
  // À cet instant le focus est encore sur un bouton de la fiche fermée (il ne retombe sur la page qu'au rendu suivant).
  $('dlg-fiche').addEventListener('close', () => {
    const actif = document.activeElement;
    if ((actif === document.body || $('dlg-fiche').contains(actif)) && etatUi.choisi) {
      $('resultats').querySelector(`.carte[data-id="${CSS.escape(etatUi.choisi)}"] .carte-ouvrir`)?.focus({ preventScroll: true });
    }
  });

  // La mise en page change (fenêtre élargie, téléphone tourné, taille du texte) : la fiche et le
  // total changent de place, et le nombre de filtres en boutons aussi.
  const miseEnPage = () => `${large()}|${filtresVisibles()}|${totalSousFiche()}`;
  let miseEnPageVue = miseEnPage();
  const suivreMiseEnPage = () => {
    if (miseEnPage() === miseEnPageVue) return;
    miseEnPageVue = miseEnPage();
    rendreFiltres();
    rendreResultats();
    rendreTotal();
  };
  new ResizeObserver(suivreMiseEnPage).observe(document.querySelector('.page'));
  // La hauteur de la fenêtre seule ne change pas la taille de .page quand la liste est longue.
  window.addEventListener('resize', suivreMiseEnPage);
  new ResizeObserver(calerBas).observe($('barre-total'));
  $('fichier-import').addEventListener('change', (ev) => importerFichier(ev.target.files[0]));

  // Si la page est ouverte dans deux onglets, ils restent d'accord.
  window.addEventListener('storage', (ev) => {
    if (ev.key === CLE_DONNEES) { donnees = charger(); if (donneesFutures) fermerFenetres(); }
    else if (ev.key === CLE_APPAREIL) { appareil = chargerAppareil(); appliquerApparence(); }
    else if (ev.key === CLE_CLOUD) cloud = chargerCloud();
    else return;
    rafraichir();
  });

  // Appli reprise depuis l'arrière-plan, ou onglet laissé ouvert des jours : le rappel d'import se recalcule.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) rendreBandeaux(); });
  setInterval(rendreBandeaux, 3600000); // toutes les heures

  rafraichir();
  if (!auDoigt()) champ.focus(); // PC : on peut taper tout de suite (un PC à dalle tactile dit « coarse » : il en était privé)

  // Mise à jour automatique : un lien d'appairage dans l'adresse d'abord, puis à l'ouverture, au
  // retour sur la page, au retour du réseau, et toutes les 5 minutes tant que la page est affichée.
  appairerDepuisAdresse().then(synchroniser);
  setInterval(() => { if (document.visibilityState === 'visible') synchroniser(); }, INTERVALLE_SYNCHRO);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && cloud && Date.now() - cloud.derniereSynchro > 60000) synchroniser();
  });
  window.addEventListener('online', () => synchroniser());

  // Mode hors ligne (seulement quand la page vient d'une adresse web). Le service worker prévient
  // quand il a téléchargé une page plus récente : on propose « Recharger » au lieu d'attendre
  // la deuxième ouverture.
  function signalerNouvelleVersion() {
    if (nouvelleVersion) return;
    nouvelleVersion = true;
    rendreBandeaux();
  }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('message', (ev) => {
      if (ev.data?.type === 'nouvelle-version') signalerNouvelleVersion();
    });
  }

  // Fonctions exposées pour les tests automatiques.
  window.Forfaits = Object.freeze({ lirePrix, signalerNouvelleVersion });
})();
</script>
</body>
</html>
