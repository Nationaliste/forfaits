  // Ce qu'on choisit ou copie souvent remonte en tête (sur cet appareil seulement, jamais exporté).
  function noterUsage(cle, id) {
    const compteurs = appareil[cle];
    compteurs[id] = (compteurs[id] || 0) + 1;
    const autres = Object.keys(compteurs).filter((x) => x !== id);
    if (autres.length >= USAGE_MAX) delete compteurs[autres.reduce((a, b) => (compteurs[b] < compteurs[a] ? b : a))]; // oublie le moins utilisé
    sauverAppareil();
  }
  // Forfait qu'on vient de regarder (fiche ouverte, référence copiée, ajout au total) : le bouton
  // « Récents » de la barre le retrouve, le temps des quelques suivants.
  function noterConsulte(id) {
    appareil.recents = [id, ...appareil.recents.filter((x) => x !== id)].slice(0, RECENTS_MAX);
    sauverAppareil();
  }

  // À appeler après chaque changement fait sur cet appareil (sert au rappel d'export).
  function noterModif() {
    appareil.modifsEnAttente += 1;
    sauverAppareil();
    demanderStockageDurable();
  }

  // Demande au navigateur de ne pas effacer les données de lui-même. Firefox pose alors une
  // question : on ne la pose qu'après une action utile (modification, import), pas à l'ouverture.
  let stockageDurableDemande = false;
  function demanderStockageDurable() {
    if (stockageDurableDemande || !navigator.storage?.persisted) return;
    stockageDurableDemande = true;
    navigator.storage.persisted().then((deja) => (deja ? true : navigator.storage.persist())).catch(() => {});
  }

  // Texte d'un enregistrement, clés dans l'ordre alphabétique à tous les niveaux : deux appareils écrivent le même.
  function canonique(v) {
    if (Array.isArray(v)) return '[' + v.map(canonique).join(',') + ']';
    if (v && typeof v === 'object') {
      return '{' + Object.keys(v).filter((k) => v[k] !== undefined).sort().map((k) => JSON.stringify(k) + ':' + canonique(v[k])).join(',') + '}';
    }
    return JSON.stringify(v);
  }
  // Vrai si la version x remplace la version actuelle. À date égale (anciens fichiers sans date, fichier retouché),
  // le local gagnait des deux côtés : deux appareils qui s'échangent leurs fichiers gardaient chacun la sienne.
  // Le départage par le contenu donne le même gagnant partout.
  const gagne = (x, actuel) => x.maj > actuel.maj || (x.maj === actuel.maj && canonique(x) > canonique(actuel));

  // Fusion de deux jeux de données : pour chaque enregistrement, la version la plus récente gagne.
  function fusionner(local, entrant) {
    const resultat = {};
    for (const cle of ['familles', 'elements', 'forfaits']) {
      const parId = new Map(local[cle].map((x) => [x.id, x]));
      for (const x of entrant[cle]) {
        const actuel = parId.get(x.id);
        if (!actuel || gagne(x, actuel)) parId.set(x.id, x);
      }
      resultat[cle] = [...parId.values()];
    }
    return resultat;
  }

  // Date de la dernière modification (0 = données d'exemple jamais touchées).
  function derniereModif(d) {
    let max = 0;
    for (const cle of ['familles', 'elements', 'forfaits']) {
      for (const x of d[cle]) if (x.maj > max) max = x.maj;
    }
    return max;
  }

  let donnees = charger();
  let appareil = chargerAppareil();

  // Le CSS n'a que deux palettes : « auto » est résolu ici d'après le réglage de l'appareil.
  // La taille du texte est posée de la même façon, sur <html>.
  const themeSysteme = window.matchMedia('(prefers-color-scheme: light)');
  // Aucune requête média ne distingue le doigt de la souris sur un appareil qui a les deux : sur un
  // PC à dalle tactile, Firefox et Chrome répondent « pointer: coarse » et « hover: none » même
  // avec une souris branchée (mesuré sur Windows). On suit donc le DERNIER geste : `data-geste`
  // vaut 'souris' ou 'doigt' sur <html>, et le CSS s'y accroche par `:where(…)`, qui n'ajoute
  // aucune spécificité — les égalités entre règles restent celles d'avant.
  const racine = document.documentElement;
  const auDoigt = () => racine.dataset.geste === 'doigt';
  function noterGeste(type) {
    const valeur = type === 'touch' ? 'doigt' : 'souris';
    if (racine.dataset.geste !== valeur) racine.dataset.geste = valeur;
  }
  // Au démarrage, faute de geste : un appareil qui n'a aucun pointeur fin est un téléphone.
  noterGeste(matchMedia('(any-pointer: fine)').matches ? 'mouse' : 'touch');
  // La taille des commandes, elle, se décide ici une fois pour toutes (voir --h) : un écran qu'on
  // peut toucher, même avec une souris branchée, garde des commandes de 44 px.
  if (matchMedia('(any-pointer: coarse)').matches) racine.dataset.tactile = '';
  addEventListener('pointerdown', (ev) => noterGeste(ev.pointerType), { capture: true, passive: true });
  // La souris qui bouge suffit : sur un PC hybride, le survol revient sans attendre un clic.
  addEventListener('pointermove', (ev) => { if (ev.pointerType === 'mouse') noterGeste('mouse'); },
    { capture: true, passive: true });

  function appliquerApparence() {
    const clair = appareil.theme === 'clair' || (appareil.theme === 'auto' && themeSysteme.matches);
    document.documentElement.dataset.theme = clair ? 'clair' : 'sombre';
    document.documentElement.dataset.texte = appareil.texte;
  }
  appliquerApparence();
  themeSysteme.addEventListener('change', appliquerApparence);

  /* =====================================================================
     INDEX : vues prêtes à l'emploi, recalculées après chaque changement
     ===================================================================== */
  let index = null;

  function construireIndex() {
    // Ordre des familles : celui rangé sur cet appareil d'abord ; une famille qu'il ne connaît pas
    // encore (nouvelle, ou appareil jamais réglé) passe après, dans l'ordre des données.
    const rangAppareil = new Map(appareil.ordreFams.map((id, i) => [id, i]));
    const rangFamille = (f) => (rangAppareil.has(f.id) ? rangAppareil.get(f.id) : appareil.ordreFams.length + Math.max(0, f.ordre));
    const fams = donnees.familles.filter((f) => !f.supprime)
      .sort((a, b) => rangFamille(a) - rangFamille(b) || tri.compare(a.nom, b.nom));
    const famParId = new Map(fams.map((f) => [f.id, f]));
    const rangFam = new Map(fams.map((f, i) => [f.id, i]));
    const elsActifs = donnees.elements.filter((e) => !e.supprime && famParId.has(e.familleId))
      .sort((a, b) => rangFam.get(a.familleId) - rangFam.get(b.familleId) || tri.compare(a.nom, b.nom));
    const elParId = new Map(elsActifs.map((e) => [e.id, e]));
    // Nom « à plat » → éléments (pour reconnaître « 3Q » ou « T1 DEMO » tapés en entier).
    const parNom = new Map();
    for (const e of elsActifs) {
      const cle = norm(e.nom);
      if (!cle) continue;
      if (!parNom.has(cle)) parNom.set(cle, []);
      parNom.get(cle).push(e);
    }
    const forfaits = donnees.forfaits.filter((f) => !f.supprime);
    const forfaitParId = new Map(forfaits.map((f) => [f.id, f]));
    // Surnoms : ceux de l'équipe d'abord, puis ceux de cet appareil. Un surnom ne désigne qu'une seule chose :
    // le premier arrivé le garde, un doublon (vrai nom d'un élément, ou déjà pris) est ignoré par la recherche.
    // Entre deux éléments ou deux forfaits de l'équipe, le plus petit identifiant passe d'abord : l'ordre des listes
    // dépend des fusions de chaque appareil, l'identifiant est le même partout (et ne bouge pas quand on change un prix).
    const parId = (a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    const nomsFamilles = new Set(fams.map((f) => norm(f.nom))); // « imprimante » doit rester une recherche de famille
    const surnomPris = new Map(); // surnom « à plat » → { id, equipe }
    const surnomsDe = new Map();  // identifiant → surnoms retenus, équipe puis perso
    const retenir = (id, s, equipe) => {
      const cle = norm(s);
      if (parNom.has(cle) || nomsFamilles.has(cle) || surnomPris.has(cle)) return;
      surnomPris.set(cle, { id, equipe });
      surnomsDe.set(id, [...(surnomsDe.get(id) || []), s]);
    };
    for (const x of [...[...elsActifs].sort(parId), ...[...forfaits].sort(parId)]) for (const s of x.surnoms || []) retenir(x.id, s, true);
    for (const [id, liste] of Object.entries(appareil.surnoms)) {
      if (elParId.has(id) || forfaitParId.has(id)) for (const s of liste) retenir(id, s, false);
    }
    for (const e of elsActifs) for (const s of surnomsDe.get(e.id) || []) parNom.set(norm(s), [e]);
    const elementsForfait = new Map();
    const champs = new Map();
    const motsRefDes = new Map(); // un nom d'élément tapé trouve aussi la référence ou la désignation qui l'écrit
    for (const f of forfaits) {
      const els = fams.map((fam) => elParId.get(f.elements[fam.id])).filter((e, i) => e && e.familleId === fams[i].id);
      elementsForfait.set(f.id, els);
      motsRefDes.set(f.id, [motsPlats(f.ref), motsPlats(f.designation)]);
      champs.set(f.id, [
        norm(f.ref), norm(f.designation),
        ...(surnomsDe.get(f.id) || []).map(norm),
        ...els.map((e) => norm(e.nom)),
        ...els.flatMap((e) => (surnomsDe.get(e.id) || []).map(norm)), // « la pe » trouve comme « zor »
        ...els.map((e) => norm(famParId.get(e.familleId).nom)),
      ]);
    }
    // Mots connus (mot « à plat » → mot tel qu'on l'écrit), pour rattraper une faute de frappe.
    // Moins de 4 lettres : laissés de côté, « 3Q » deviendrait « 4Q ».
    const motsConnus = new Map();
    const retenirMot = (texte) => {
      const cle = norm(texte);
      if (cle.length >= 4 && !motsConnus.has(cle)) motsConnus.set(cle, texte);
    };
    for (const e of elsActifs) {
      retenirMot(e.nom);
      for (const s of surnomsDe.get(e.id) || []) retenirMot(s);
    }
    for (const fam of fams) retenirMot(fam.nom);
    for (const f of forfaits) {
      retenirMot(f.ref);
      for (const s of surnomsDe.get(f.id) || []) retenirMot(s);
      for (const mot of decouper(f.designation)) retenirMot(mot);
    }
    return { fams, famParId, elsActifs, elParId, parNom, forfaits, forfaitParId, elementsForfait, champs, motsRefDes, surnomPris, surnomsDe, motsConnus };
  }

  const elementsDe = (familleId) => index.elsActifs.filter((e) => e.familleId === familleId);

  // Clé d'une combinaison d'éléments (sert à repérer deux forfaits identiques).
  function cleCombinaison(elements) {
    return Object.entries(elements)
      .filter(([fam, elt]) => index.elParId.get(elt)?.familleId === fam)
      .map(([fam, elt]) => fam + ':' + elt)
      .sort()
      .join('|');
  }

  /* =====================================================================
     RECHERCHE
     ===================================================================== */
  const etatUi = { filtres: new Map(), suggestions: [], nbMotsSuggestion: 0, suggestionActive: -1, actif: false, choisi: null, premier: true };

  // La virgule sépare deux mots, sauf dans un prix tapé (« 1140,50 », « 1.140,50 ») : il reste un seul mot.
  const decouper = (texte) => texte.split(/[\s;+]+/)
    .flatMap((m) => (/^\d[\d.]*,\d{1,2}€?$/.test(m) ? [m] : m.split(','))).filter((m) => norm(m) !== '');

  // Mots « à plat » d'une référence ou d'une désignation : « CABLE T2 » → ['cable', 't2'].
  const motsPlats = (texte) => String(texte ?? '').split(/[^\p{L}\p{N}]+/u).map(norm).filter(Boolean);
  // Vrai si des mots qui se suivent forment exactement `cle` (« t1demo » dans « Taximètre T1 DEMO »).
  // Mots entiers seulement : « 3q » ne se trouve pas dans « 13Q ».
  function suiteDeMots(mots, cle) {
    for (let i = 0; i < mots.length; i++) {
      let suite = '';
      for (let j = i; j < mots.length && suite.length < cle.length; j++) {
        suite += mots[j];
        if (suite === cle) return true;
      }
    }
    return false;
  }

  // Découpe la recherche en contraintes ; chacune réduit la liste. Un nom ou un surnom d'élément tapé
  // en entier (« 3Q », « T1 DEMO », « t1demo ») trouve les forfaits qui ont cet élément, plus ceux dont
  // la référence ou la désignation l'écrit en mots entiers (« CABLE T2 » pour « t2 ») ; pas ceux qui ont
  // seulement un autre élément qui le contient (« 3Q » ne ramène pas un élément « 13Q »). Tout le reste
  // cherche un morceau de texte dans la référence, la désignation, les surnoms et les éléments.
  // Un mot qui se lit comme un prix (« 1140 », « 1140,50 ») trouve en plus les forfaits dont le TTC
  // ou le HT vaut exactement ce montant.
  function analyserRecherche(texte) {
    const bruts = decouper(texte);
    const mots = bruts.map(norm);
    const contraintes = [];
    let i = 0;
    while (i < mots.length) {
      let reconnu = false;
      for (let j = mots.length; j > i; j--) {
        const valeur = mots.slice(i, j).join('');
        const elements = index.parNom.get(valeur);
        if (elements) {
          contraintes.push({ type: 'element', ids: new Set(elements.map((e) => e.id)), valeur, prix: j === i + 1 ? lirePrix(bruts[i]) : null });
          i = j;
          reconnu = true;
          break;
        }
      }
      if (!reconnu) {
        contraintes.push({ type: 'texte', valeur: mots[i], prix: lirePrix(bruts[i]) });
        i++;
      }
    }
    return { mots, contraintes };
  }

  function correspond(forfait, contraintes, filtres = etatUi.filtres) {
    const els = index.elementsForfait.get(forfait.id);
    for (const [familleId, valeur] of filtres) {
      const present = els.find((e) => e.familleId === familleId);
      if (valeur === SANS ? present : present?.id !== valeur) return false;
    }
    const champs = index.champs.get(forfait.id);
    for (const c of contraintes) {
      const trouve = c.type === 'element'
        ? els.some((e) => c.ids.has(e.id)) || index.motsRefDes.get(forfait.id).some((mots) => suiteDeMots(mots, c.valeur))
        : champs.some((ch) => ch.includes(c.valeur));
      if (!trouve && !(c.prix !== null && (forfait.ttc === c.prix || forfait.ht === c.prix))) return false;
    }
    return true;
  }

  // Suggestions d'éléments pendant la frappe, d'après les derniers mots tapés
  // (« zor » → Zorba 5, Zorbatech X ; « kalpo u » → Kalpo universelle).
  // Un nom déjà tapé en entier (« 3Q ») filtre déjà : pas de liste qui cacherait l'écran.
  function calculerSuggestions(texte) {
    const mots = decouper(texte).map(norm);
    for (let k = Math.min(3, mots.length); k >= 1; k--) {
      const morceau = mots.slice(-k).join('');
      if (index.parNom.has(morceau)) break;
      // Trouvé par un surnom seulement : on le montre à côté du vrai nom (le technicien apprend le nom).
      const via = new Map();
      const trouve = (e) => {
        if (norm(e.nom).includes(morceau)) return true;
        const s = (index.surnomsDe.get(e.id) || []).find((x) => norm(x).includes(morceau));
        if (s) via.set(e.id, s);
        return !!s;
      };
      const liste = index.elsActifs.filter((e) => etatUi.filtres.get(e.familleId) !== e.id && trouve(e));
      if (liste.length) {
        const debut = (e) => Number(norm(via.get(e.id) ?? e.nom).startsWith(morceau));
        const usage = (e) => appareil.usageElements[e.id] || 0;
        liste.sort((a, b) => debut(b) - debut(a) || usage(b) - usage(a)); // tri stable : l'ordre des familles est conservé
        return { liste: liste.slice(0, 8), nbMots: k, via };
      }
    }
    return { liste: [], nbMots: 0, via: new Map() };
  }

  // Nombre de lettres à changer pour passer d'un mot à l'autre ; abandonne dès que ça dépasse « max ».
  function distanceMots(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let ligne = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const suivante = [i];
      let mini = i;
      for (let j = 1; j <= b.length; j++) {
        suivante[j] = Math.min(ligne[j] + 1, suivante[j - 1] + 1, ligne[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (suivante[j] < mini) mini = suivante[j];
      }
      if (mini > max) return max + 1;
      ligne = suivante;
    }
    return ligne[b.length];
  }

  // Au doigt, une lettre part de travers : « kalpoo » ne trouve rien alors que « Kalpo X » existe.
  // On ne touche qu'aux mots d'au moins 4 lettres qui ne trouvent rien du tout, et on ne propose la
  // correction que si elle donne vraiment des forfaits (sinon autant ne rien dire).
  // À égalité de distance, l'ordre de index.motsConnus tranche : noms d'éléments, puis familles,
  // puis références, puis mots des désignations.
  // Renvoie la recherche corrigée, ou null s'il n'y a rien à proposer.
  function corrigerRecherche(texte) {
    const mots = decouper(texte);
    const connu = (plat) => index.parNom.has(plat)
      || [...index.champs.values()].some((champs) => champs.some((ch) => ch.includes(plat)));
    let corrige = false;
    const proposes = mots.map((mot) => {
      const plat = norm(mot);
      if (plat.length < 4 || connu(plat)) return mot;
      const max = plat.length <= 6 ? 1 : 2;
      let meilleureDistance = max;
      let candidats = [];
      for (const [cle, affichage] of index.motsConnus) {
        const d = distanceMots(plat, cle, max);
        if (d > meilleureDistance) continue;
        if (d < meilleureDistance) { meilleureDistance = d; candidats = []; }
        if (!candidats.some((c) => norm(c) === norm(affichage))) candidats.push(affichage);
      }
      if (!candidats.length) return mot;
      corrige = true;
      return candidats[0];
    });
    if (!corrige) return null;
    const propose = proposes.join(' ');
    const { contraintes } = analyserRecherche(propose);
    return index.forfaits.some((f) => correspond(f, contraintes)) ? propose : null;
  }

  /* =====================================================================
     AFFICHAGE
     ===================================================================== */
  // Pictogramme repris de la planche dessinée en tête de page (aucune image à télécharger).
  function icone(nom, classe) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'i' + (classe ? ' ' + classe : ''));
    svg.setAttribute('aria-hidden', 'true');
    const dessin = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    dessin.setAttribute('href', '#i-' + nom);
    svg.append(dessin);
    return svg;
  }

  // La feuille de style décide de la mise en page d'après la largeur de la page (taille du texte
  // comprise) ; le script lui demande ce qu'elle a décidé au lieu de mesurer l'écran.
  // Grand écran : la fiche du forfait choisi et le total sont à droite de la liste.
  const large = () => getComputedStyle($('panneau')).display !== 'none';
  // Le total est sous la fiche si la page est assez haute (--total, décidé par la feuille de style) ;
  // sinon c'est la barre du bas, qui ouvre une feuille.
  const totalSousFiche = () => large() && getComputedStyle($('panneau')).getPropertyValue('--total').trim() !== 'barre';
  // Familles en boutons de filtre ; les suivantes vont dans « Autres ».
  const filtresVisibles = () => Number(getComputedStyle($('barre')).getPropertyValue('--filtres')) || 3;

  // Redessine une zone sans perdre le clavier : le focus revient au bouton de même rang.
  function redessiner(zone, dessiner) {
    const rang = [...zone.querySelectorAll('button')].indexOf(document.activeElement);
    dessiner();
    if (rang >= 0) zone.querySelectorAll('button')[rang]?.focus({ preventScroll: true });
  }

  function rafraichir() {
    index = construireIndex();
    // Retire les filtres devenus invalides (élément ou famille supprimés).
    for (const [familleId, valeur] of etatUi.filtres) {
      if (!index.famParId.has(familleId) || (valeur !== SANS && !index.elParId.has(valeur))) etatUi.filtres.delete(familleId);
    }
    rendreEntete();
    rendreBandeaux();
    rendreRecherche();
    rendreRappel();
    rendreTotal();
  }

  function rendreRecherche() {
    rendreFiltres();
    rendreResultats();
    majSuggestions();
  }

  function rendreEntete() {
    const derniere = derniereModif(donnees);
    $('etat-donnees').textContent = donneesFutures ? 'Outil à mettre à jour' : derniere ? `Données du ${dateCourte(derniere)}` : "Données d'exemple";
    $('barre-modif').hidden = !appareil.modeModif;
  }

  // discret : laisse sa place aux forfaits pendant une recherche (voir « en-recherche »).
  function bandeau(texte, bouton, erreur, discret) {
    return h('div', { class: 'bandeau' + (erreur ? ' bandeau-erreur' : '') + (discret ? ' bandeau-discret' : '') },
      icone('info'), h('p', {}, texte), bouton);
  }

  function rendreBandeaux() {
    const liste = [];
    if (!stockageOk) liste.push(bandeau("Cet appareil n'enregistre pas les données (navigation privée ?). Exporte avant de fermer la page.", null, true));
    if (donneesFutures) {
      // Un seul message : importer, exporter ou supprimer des exemples n'a pas de sens tant que la page est en retard.
      liste.push(bandeau(MSG_FUTUR, h('button', { type: 'button', class: 'btn btn-bord', id: 'btn-recharger-futur', onclick: () => location.reload() }, 'Recharger'), true));
      $('bandeaux').replaceChildren(...liste);
      return;
    }
    if (donneesIllisibles) liste.push(bandeau('Les données de cet appareil étaient abîmées : elles ont été mises de côté. Importe le dernier fichier.', h('button', { type: 'button', class: 'btn btn-bord', onclick: lancerImport }, 'Importer'), true));
    // Sans ce bandeau, la nouveauté n'apparaît qu'à la deuxième ouverture (le service worker sert d'abord la copie gardée).
    if (nouvelleVersion) liste.push(bandeau("Une nouvelle version de l'outil est prête. Les forfaits de cet appareil ne changent pas.", h('button', { type: 'button', class: 'btn btn-bord', id: 'btn-recharger', onclick: () => location.reload() }, 'Recharger')));
    const exemples = index.forfaits.some((f) => f.exemple);
    if (exemples) {
      liste.push(bandeau(
        // Sur un téléphone, la phrase courte tient sur la ligne du bouton.
        [h('span', { class: 'long' }, 'Les forfaits « EXEMPLE » sont faux : références et prix inventés.'), h('span', { class: 'court' }, 'Exemples : prix inventés.')],
        appareil.modeModif
          ? h('button', { type: 'button', class: 'btn btn-bord', id: 'btn-suppr-exemples', onclick: supprimerExemples }, 'Supprimer les exemples')
          : h('button', { type: 'button', class: 'btn btn-bord', onclick: lancerImport }, h('span', {}, 'Importer', h('span', { class: 'long' }, ' le vrai fichier'))),
        false, true,
      ));
    } else if (!appareil.modeModif && appareil.dernierImport) {
      const jours = Math.floor((Date.now() - appareil.dernierImport) / 86400000);
      if (jours >= JOURS_RAPPEL_IMPORT) liste.push(bandeau(`Dernier import il y a ${jours} jours : vérifie s'il existe un fichier plus récent dans OneDrive.`, h('button', { type: 'button', class: 'btn btn-bord', onclick: lancerImport }, 'Importer')));
    }
    $('bandeaux').replaceChildren(...liste);
  }

  /* ---------- Menus de la barre (filtres, récents) : un seul ouvert à la fois ---------- */
  let menuOuvert = null;
  function fermerMenu(rendreFocus) {
    if (!menuOuvert) return;
    const { el, ancre } = menuOuvert;
    menuOuvert = null;
    el.remove();
    ancre.setAttribute('aria-expanded', 'false');
    if (rendreFocus && ancre.isConnected) ancre.focus();
  }
  // Le menu se pose sous le bouton qui l'ouvre (l'ancre), sans sortir de la barre.
  function ouvrirMenuBarre(ancre, titre, enfants) {
    const deja = menuOuvert?.ancre === ancre;
    fermerMenu();
    if (deja) return;
    const barre = $('barre');
    const el = h('div', { class: 'menu', role: 'group', 'aria-label': titre }, enfants);
    barre.append(el);
    const a = ancre.getBoundingClientRect();
    const b = barre.getBoundingClientRect();
    // En grands caractères, les mesures de l'écran et celles de la feuille de style n'ont pas la
    // même échelle : on la déduit de la barre elle-même (1 quand le texte est à sa taille normale).
    const echelle = b.width / barre.offsetWidth || 1;
    el.style.top = `${(a.bottom - b.top) / echelle + 6}px`;
    el.style.left = `${Math.max(8, Math.min((a.left - b.left) / echelle, barre.offsetWidth - el.offsetWidth - 8))}px`;
    ancre.setAttribute('aria-expanded', 'true');
    menuOuvert = { el, ancre };
    // Le clavier entre dans le menu ; en sortir par Tab le referme.
    el.addEventListener('focusout', (ev) => {
      if (menuOuvert?.el === el && ev.relatedTarget && !el.contains(ev.relatedTarget) && ev.relatedTarget !== ancre) fermerMenu();
    });
    (el.querySelector('[aria-pressed="true"]') || el.querySelector('button'))?.focus({ preventScroll: true });
  }

  /* ---------- Filtres (pastilles de la barre) ---------- */
  const nomSans = (fam) => `Sans ${fam.nom.toLocaleLowerCase('fr')}`;

  // Les choix d'une famille : « Tous », ses éléments, « Sans … », chacun avec son nombre de forfaits.
  function choixFiltre(fam) {
    const actuel = etatUi.filtres.get(fam.id);
    const nb = (valeur) => index.forfaits.filter((f) => {
      const present = index.elementsForfait.get(f.id).find((e) => e.familleId === fam.id);
      return valeur === SANS ? !present : present?.id === valeur;
    }).length;
    const choix = [
      { valeur: undefined, nom: 'Tous' },
      ...elementsDe(fam.id).map((e) => ({ valeur: e.id, nom: e.nom })),
      { valeur: SANS, nom: nomSans(fam) },
    ];
    return choix.map((c) => h('button', {
      type: 'button', class: 'menu-item choix', 'aria-pressed': String(c.valeur === actuel),
      onclick: () => {
        if (c.valeur === undefined) etatUi.filtres.delete(fam.id); else etatUi.filtres.set(fam.id, c.valeur);
        if (c.valeur !== undefined && c.valeur !== SANS) noterUsage('usageElements', c.valeur);
        rendreRecherche();
        // Le clavier revient à la pastille de la famille (ou à « Autres », si elle y est retournée).
        ($('filtres').querySelector(`[data-fam="${CSS.escape(fam.id)}"]`) || $('btn-autres-filtres'))?.focus({ preventScroll: true });
      },
    // Le nombre est un repère pour l'œil : le nom du bouton reste celui de l'élément.
    }, h('span', {}, c.nom), c.valeur === undefined ? null : h('span', { class: 'nb', 'aria-hidden': 'true' }, String(nb(c.valeur)))));
  }

  // Pastille d'une famille. Pleine quand un filtre est posé : elle affiche alors l'élément choisi.
  function boutonFiltre(fam) {
    const valeur = etatUi.filtres.get(fam.id);
    return h('button', {
      type: 'button', class: 'filtre' + (valeur === undefined ? '' : ' actif'), 'data-fam': fam.id, 'aria-expanded': 'false', 'aria-haspopup': 'true',
      onclick: (ev) => ouvrirMenuBarre(ev.currentTarget, fam.nom, choixFiltre(fam)),
    }, valeur === undefined
      ? h('span', { class: 'filtre-nom' }, fam.nom)
      : [h('span', { class: 'sr' }, `${fam.nom} : `), h('span', { class: 'filtre-nom' }, valeur === SANS ? nomSans(fam) : index.elParId.get(valeur).nom)],
    icone('chevron'));
  }

  // Les premières familles de l'appareil sont des boutons ; les suivantes passent dans « Autres »,
  // sinon un magasin qui a quinze familles n'a plus que des filtres à l'écran. Un filtre posé reste
  // toujours visible, et une seule famille de reste s'affiche telle quelle (« Autres » n'y sert à rien).
  function rendreFiltres() {
    fermerMenu();
    const fams = index.fams;
    const visibles = filtresVisibles();
    const cachee = (fam, i) => i >= visibles && !etatUi.filtres.has(fam.id);
    const caches = fams.filter(cachee);
    $('filtres').replaceChildren(
      ...fams.filter((fam, i) => !cachee(fam, i)).map(boutonFiltre),
      ...(caches.length > 1
        ? [h('button', {
          type: 'button', class: 'filtre', id: 'btn-autres-filtres', 'aria-expanded': 'false', 'aria-haspopup': 'true',
          onclick: (ev) => ouvrirMenuBarre(ev.currentTarget, 'Autres filtres', caches.map((fam) => h('div', { role: 'group', 'aria-label': fam.nom }, h('p', { class: 'menu-titre', 'aria-hidden': 'true' }, fam.nom), choixFiltre(fam)))),
        }, h('span', { class: 'filtre-nom' }, 'Autres'), icone('chevron'))]
        : caches.map(boutonFiltre)),
    );
  }

  // Ordre des filtres : réglage de cet appareil (jamais exporté), ouvert à tout le monde — un vendeur
  // doit pouvoir mettre ses familles dans son ordre sans passer par le mode modification.
  function ouvrirOrdreFiltres() {
    const liste = h('div', {});
    const fleche = (sens, id) => liste.querySelector(`[data-fleche="${sens > 0 ? 'bas' : 'haut'}-${id}"]`);
    const deplacer = (i, sens) => {
      const ids = index.fams.map((f) => f.id);
      const id = ids[i];
      [ids[i], ids[i + sens]] = [ids[i + sens], ids[i]];
      appareil.ordreFams = ids;
      sauverAppareil();
      // Tout de suite : la rangée de filtres bouge derrière la fenêtre, on voit ce qu'on range.
      // (L'événement « close » d'un dialogue part en différé : s'y fier laisserait la rangée en retard.)
      rafraichir();
      dessiner();
      // Les boutons viennent d'être refaits : on rend le focus à la flèche qu'on utilisait (l'autre
      // si elle est devenue inactive), sinon on repart du début de la fenêtre à chaque appui.
      const rendue = fleche(sens, id);
      (rendue && !rendue.disabled ? rendue : fleche(-sens, id))?.focus();
    };
    const visibles = filtresVisibles();
    const dessiner = () => {
      // Une seule famille de reste n'irait pas dans « Autres » : la rangée la montre telle quelle.
      const groupees = index.fams.length - visibles > 1;
      liste.replaceChildren(...index.fams.map((fam, i) => h('div', { class: 'ordre-ligne' },
        h('span', { class: 'ordre-place' }, i < visibles || !groupees ? 'Filtre' : 'Autres'),
        h('span', { class: 'ordre-nom' }, fam.nom),
        h('button', { type: 'button', class: 'btn btn-bord btn-carre', 'data-fleche': 'haut-' + fam.id, 'aria-label': `Monter ${fam.nom}`, disabled: i === 0, onclick: () => deplacer(i, -1) }, '↑'),
        h('button', { type: 'button', class: 'btn btn-bord btn-carre', 'data-fleche': 'bas-' + fam.id, 'aria-label': `Descendre ${fam.nom}`, disabled: i === index.fams.length - 1, onclick: () => deplacer(i, 1) }, '↓'))));
    };
    const dlg = ouvrirDialogue({
      titre: 'Ordre des filtres',
      corps: [h('p', { class: 'aide-texte' }, `Sur cet écran, les ${visibles} premières sont les boutons de filtre sous la recherche ; les autres se rangent dans « Autres ». Sur cet appareil seulement.`), liste],
      pied: [h('button', { type: 'button', class: 'btn btn-blanc', onclick: () => dlg.close() }, 'Terminé')],
    });
    dessiner();
  }

  // Les forfaits de chaque filtre pris tout seul, quand aucun forfait ne les contient tous
  // (au comptoir : un boîtier d'un forfait + un lumineux d'un autre, à additionner avec le « + »).
  // Les filtres « sans » ne font pas de groupe : ils ne désignent aucun élément à retrouver.
  function groupesParFiltre(contraintes, classer) {
    const choisis = [...etatUi.filtres].filter(([, valeur]) => valeur !== SANS);
    if (choisis.length < 2) return [];
    const groupes = choisis.map(([familleId, valeur]) => ({
      titre: `${index.famParId.get(familleId).nom} : ${index.elParId.get(valeur).nom}`,
      liste: classer(index.forfaits.filter((f) => correspond(f, contraintes, new Map([[familleId, valeur]])))),
    })).filter((g) => g.liste.length);
    return groupes.length < 2 ? [] : groupes;
  }

  /* ---------- Derniers consultés (bouton « Récents » de la barre) ---------- */
  // Le bouton n'existe que si la recherche est vide et qu'aucun filtre n'est posé : tous les
  // forfaits sont alors dans la liste, un appui rouvre la fiche sans toucher à la recherche.
  function montrerRecents() {
    $('btn-recents').hidden = etatUi.actif || donneesFutures || !appareil.recents.some((id) => index.forfaitParId.has(id));
  }
  // Forfait qu'on vient de regarder (fiche ouverte, référence copiée, ajout au total).
  function consulter(f) {
    noterConsulte(f.id);
    montrerRecents();
  }
  function ouvrirRecents(ancre) {
    const liste = appareil.recents.map((id) => index.forfaitParId.get(id)).filter(Boolean);
    ouvrirMenuBarre(ancre, 'Derniers consultés', [h('p', { class: 'menu-titre' }, 'Derniers consultés'),
      liste.map((f) => h('button', {
        type: 'button', class: 'menu-item recent',
        onclick: () => {
          choisir(f);
          $('resultats').querySelector('.carte.choisie')?.scrollIntoView({ block: 'nearest' });
        },
      }, h('span', {}, f.designation || f.ref), h('span', { class: 'nb' }, formatPrix(f.ttc))))]);
  }

  function rendreResultats() {
    const texte = $('recherche').value;
    // Le repli de la rangée des familles se décide au moment où le champ passe de vide à rempli,
    // puis ne bouge plus. S'il suivait `data-geste`, un appui du doigt après un mouvement de
    // souris replierait la rangée AU CONTACT : le contenu monterait et l'appui serait perdu
    // (mesuré sur Chromium et WebKit). Rien ne doit bouger entre le doigt qui touche et le
    // doigt qui part.
    if (!texte.trim()) racine.removeAttribute('data-recherche');
    else if (!racine.dataset.recherche) racine.dataset.recherche = auDoigt() ? 'doigt' : 'souris';
    const analyse = analyserRecherche(texte);
    const total = index.forfaits.length;
    const resultats = index.forfaits.filter((f) => correspond(f, analyse.contraintes));
    const tape = analyse.mots.join('');
    // Une référence tapée en entier passe en premier, puis les favoris, l'ordre choisi, les plus copiés
    // (références dans l'ordre alphabétique par défaut).
    $('tri').value = appareil.tri; // le tri est un réglage de l'appareil : la liste le suit (rechargement, autre onglet)
    const sens = { 'prix-croissant': 1, 'prix-decroissant': -1 }[appareil.tri] || 0;
    const favori = (f) => Number(appareil.favoris.includes(f.id));
    const usage = (f) => appareil.usageForfaits[f.id] || 0;
    const classer = (liste) => liste.sort((a, b) => Number(norm(b.ref) === tape) - Number(norm(a.ref) === tape) || favori(b) - favori(a)
      || sens * (a.ttc - b.ttc) || sens * (a.ht - b.ht) || usage(b) - usage(a) || tri.compare(a.ref, b.ref));
    classer(resultats);
    const actif = analyse.mots.length > 0 || etatUi.filtres.size > 0;
    etatUi.actif = actif;
    const groupes = resultats.length === 0 && total > 0 ? groupesParFiltre(analyse.contraintes, classer) : [];

    $('compte').replaceChildren(...(total === 0 ? [] : groupes.length ? ['Aucun forfait ne contient tout']
      : resultats.length === 0 ? ['Aucun forfait ne correspond']
      : [h('strong', {}, String(resultats.length)), ` forfait${resultats.length > 1 ? 's' : ''}${actif ? ` sur ${total}` : ''}`]));
    // « Tout effacer » prend la place de « Récents » : la barre garde sa longueur.
    $('btn-tout-effacer').hidden = !actif;
    montrerRecents();
    $('zone-tri').hidden = total < 2;
    $('btn-ajouter').hidden = !appareil.modeModif || donneesFutures;
    $('btn-vider').hidden = texte === '';
    $('bandeaux').classList.toggle('en-recherche', actif);

    const vide = (...enfants) => h('li', { class: 'vide' }, ...enfants);
    let montres = []; // les forfaits affichés, dans l'ordre de l'écran
    let contenu = null;
    if (donneesFutures) {
      contenu = [vide(h('p', {}, 'Les forfaits de cet appareil ne sont pas affichés : cette page doit être rechargée.'))];
    } else if (total === 0) {
      contenu = [vide(
        h('p', {}, 'Aucun forfait enregistré sur cet appareil.'),
        appareil.modeModif
          ? h('button', { type: 'button', class: 'btn btn-rouge', onclick: () => ouvrirFormulaire(null) }, icone('plus'), 'Ajouter un forfait')
          : h('button', { type: 'button', class: 'btn btn-blanc', onclick: lancerImport }, 'Importer le fichier des forfaits'))];
    } else if (groupes.length) {
      montres = groupes.flatMap((g) => g.liste);
    } else if (resultats.length === 0) {
      const corrige = analyse.mots.length ? corrigerRecherche(texte) : null;
      contenu = [vide(
        h('p', {}, 'Aucun forfait ne correspond à cette recherche.'),
        h('div', { class: 'vide-boutons' },
          corrige ? h('button', {
            type: 'button', class: 'btn btn-blanc', id: 'btn-correction',
            onclick: () => { $('recherche').value = corrige; rendreRecherche(); },
          }, `Chercher « ${corrige} » ?`) : null,
          h('button', { type: 'button', class: 'btn btn-bord', onclick: toutEffacer }, 'Effacer la recherche')))];
    } else {
      montres = resultats;
    }
    // Le forfait choisi reste choisi tant qu'il est à l'écran. Sur grand écran, la fiche n'est
    // jamais vide : le premier de la liste y est montré d'office (sans compter comme « consulté »).
    if (!montres.some((f) => f.id === etatUi.choisi)) etatUi.choisi = large() && montres.length ? montres[0].id : null;
    if (!contenu) {
      let n = 0;
      contenu = groupes.length
        ? [h('li', { class: 'note-groupes' },
          'Aucun forfait ne contient tout ce que tu as choisi. Voici les forfaits de chaque filtre : ajoute ceux qu’il te faut au total avec leur « + ».'),
        ...groupes.flatMap((g) => [
          h('li', { class: 'titre-groupe' }, h('h3', {}, g.titre), h('span', { class: 'titre-groupe-compte' }, pluriel(g.liste.length, 'forfait'))),
          ...g.liste.map((f) => carte(f, n++))])]
        : montres.map((f) => carte(f, n++));
    }
    // Les rangées n'arrivent en cascade qu'à l'ouverture de la page : ensuite, la liste change sans délai.
    $('resultats').classList.toggle('entree', etatUi.premier);
    etatUi.premier = false;
    $('resultats').replaceChildren(...contenu);
    rendreFiche();
  }

  const prix = (type, centimes) => h('span', { class: `prix prix-${type}` },
    h('span', { class: 'prix-montant' }, formatPrix(centimes)), h('span', { class: 'prix-type' }, type.toUpperCase()));

  // La référence est une pilule : un appui la copie. `grand` : celle de la fiche.
  // Dans une rangée, c'est elle qui porte la classe carte-ref (une seule par rangée : les tests lisent la liste par là).
  const boutonRef = (f, grand) => h('button', {
    type: 'button', class: 'btn-copier' + (grand ? ' grand' : ''), title: 'Copier la référence',
    'aria-label': grand ? `Référence ${f.ref} : copier` : `Copier la référence ${f.ref}`,
    onclick: (ev) => { noterUsage('usageForfaits', f.id); consulter(f); copier(f.ref, ev.currentTarget); },
  }, h('span', { class: grand ? 'fiche-ref' : 'carte-ref' }, f.ref), icone('copier', 'copier'), icone('coche', 'coche'));

  // Le « + » d'une rangée : ajoute au total, puis affiche la quantité déjà comptée.
  function boutonPlus(f) {
    const q = qteDansTotal(f);
    return h('button', {
      type: 'button', class: 'btn-plus', 'data-qte': q || null, title: 'Ajouter au total', 'aria-label': `Ajouter ${f.ref} au total`,
      onclick: () => { if (ajouterAuTotal(f)) consulter(f); },
    }, q ? String(q) : icone('plus'));
  }

  // Une rangée de la liste, dans l'ordre voulu : le nom, ses éléments (un arrêt de la ligne par
  // élément), le prix, la référence. Le reste (favori, surnoms, modification) est dans la fiche,
  // qu'un appui sur la rangée ouvre. Le nom est dans un <h2> ; tout ce que contient son bouton est
  // en <span> (un <button> n'accepte ni <h2> ni <div>).
  function carte(f, n) {
    const elements = index.elementsForfait.get(f.id);
    const surnoms = index.surnomsDe.get(f.id);
    const li = h('li', { class: 'carte' + (f.exemple ? ' carte-exemple' : '') + (etatUi.choisi === f.id ? ' choisie' : ''), 'data-id': f.id },
      h('div', { class: 'carte-corps' },
        h('h2', { class: 'carte-titre-h' }, h('button', { type: 'button', class: 'carte-ouvrir', 'aria-haspopup': 'dialog', onclick: () => choisir(f) },
          // Titre = le nom du forfait (sa désignation) ; sans désignation, la référence fait le titre.
          h('span', { class: 'carte-nom' + (f.designation ? ' carte-designation' : '') },
            appareil.favoris.includes(f.id) ? [icone('etoile', 'marque-favori'), h('span', { class: 'sr' }, 'Favori : ')] : null,
            f.designation || f.ref))),
        elements.length || surnoms ? h('div', { class: 'carte-arrets' },
          elements.length ? h('ul', { class: 'carte-elements', role: 'list' }, elements.map((e) => h('li', { class: 'arret' },
            h('i', { class: 'pt' }), h('span', { class: 'el-famille' }, index.famParId.get(e.familleId).nom), h('span', { class: 'el-nom' }, e.nom)))) : null,
          surnoms ? h('span', { class: 'carte-surnoms' }, `dit « ${surnoms.join(', ')} »`) : null) : null),
      h('div', { class: 'carte-prix' }, prix('ttc', f.ttc), prix('ht', f.ht)),
      boutonRef(f, false),
      boutonPlus(f));
    li.style.setProperty('--n', n);
    return li;
  }

  /* ---------- Fiche du forfait choisi : sa ligne, arrêt par arrêt, jusqu'au prix ---------- */
  // À droite de la liste sur grand écran ; ailleurs, dans une feuille qui monte du bas (`dansFeuille`).
  function ficheContenu(f, dansFeuille) {
    const elements = index.elementsForfait.get(f.id);
    const surnoms = index.surnomsDe.get(f.id);
    const q = qteDansTotal(f);
    const fermer = () => $('dlg-fiche').close();
    // Modifier et supprimer ouvrent une fenêtre : la feuille lui laisse la place.
    const puis = (action) => () => { if (dansFeuille) fermer(); action(); };
    const arret = (n, classe, ...enfants) => {
      const li = h('li', { class: classe }, h('i', { class: 'pt' }), h('div', {}, ...enfants));
      li.style.setProperty('--n', n);
      return li;
    };
    return h('div', { class: 'fiche-int' },
      h('div', { class: 'fiche-tete' },
        f.exemple ? h('span', { class: 'badge-exemple' }, 'Exemple') : null,
        h('span', { class: 'pousse' }),
        h('button', {
          type: 'button', class: 'btn-icone btn-favori', 'aria-pressed': String(appareil.favoris.includes(f.id)),
          'aria-label': `Favori : ${f.ref}`, title: 'Favori : en tête de liste sur cet appareil', onclick: () => basculerFavori(f),
        }, icone('etoile')),
        h('button', { type: 'button', class: 'btn-icone', 'aria-label': `Surnoms de ${f.ref}`, title: 'Mon surnom', onclick: () => ouvrirSurnoms(f.id) }, icone('surnom')),
        appareil.modeModif ? h('button', { type: 'button', class: 'btn-icone', 'aria-label': `Modifier ${f.ref}`, title: 'Modifier', onclick: puis(() => ouvrirFormulaire(f)) }, icone('crayon')) : null,
        appareil.modeModif ? h('button', { type: 'button', class: 'btn-icone', 'aria-label': `Supprimer ${f.ref}`, title: 'Supprimer', onclick: puis(() => supprimerForfait(f)) }, icone('corbeille')) : null,
        dansFeuille ? h('button', { type: 'button', class: 'btn-icone', 'aria-label': 'Fermer', onclick: fermer }, icone('croix')) : null),
      h('h2', { class: 'fiche-nom', tabindex: dansFeuille ? -1 : null }, f.designation || f.ref),
      surnoms ? h('p', { class: 'fiche-surnom' }, `dit « ${surnoms.join(', ')} »`) : null,
      h('ol', { class: 'trajet' },
        elements.map((e, n) => arret(n, null, h('span', { class: 'fam' }, index.famParId.get(e.familleId).nom), h('span', { class: 'el' }, e.nom))),
        // Le terminus : le prix.
        arret(elements.length, 'terminus',
          h('span', { class: 'ttc-grand' }, formatPrix(f.ttc), h('small', {}, 'TTC')),
          h('span', { class: 'ht-fiche' }, `${formatPrix(f.ht)} HT`))),
      h('div', { class: 'fiche-gestes' },
        boutonRef(f, true),
        h('button', { type: 'button', class: 'btn btn-rouge btn-total', onclick: () => { if (ajouterAuTotal(f)) consulter(f); } },
          icone('plus'), 'Ajouter au total', q ? h('span', { class: 'deja' }, `×${q}`) : null)),
      f.maj ? h('p', { class: 'carte-maj' }, `Modifié le ${dateCourte(f.maj)}`) : null); // 0 : exemple jamais touché
  }

  let ficheMontree = null; // forfait du panneau : l'arrivée n'est animée que lorsqu'il change
  function rendreFiche() {
    const f = etatUi.choisi ? index.forfaitParId.get(etatUi.choisi) : null;
    const panneau = $('fiche');
    const feuille = $('dlg-fiche');
    const grand = large();
    // La fiche est à un seul endroit à la fois : le panneau sur grand écran, sinon la feuille.
    if (feuille.open && (!f || grand)) feuille.close();
    panneau.hidden = !f || !grand;
    if (panneau.hidden) {
      ficheMontree = null;
      panneau.replaceChildren();
    } else {
      const int = ficheContenu(f, false);
      if (ficheMontree !== f.id) int.classList.add('change');
      ficheMontree = f.id;
      redessiner(panneau, () => panneau.replaceChildren(int));
    }
    if (feuille.open) redessiner(feuille, () => $('feuille-fiche').replaceChildren(h('div', { class: 'poignee' }), ficheContenu(f, true)));
  }

  function ouvrirFiche(f) {
    const feuille = $('dlg-fiche');
    const int = ficheContenu(f, true);
    int.classList.add('change');
    $('feuille-fiche').replaceChildren(h('div', { class: 'poignee' }), int);
    if (!feuille.open) feuille.showModal();
    int.querySelector('.fiche-nom').focus(); // le lecteur d'écran annonce le forfait ; aucun bouton n'est mis en avant
  }

  function choisir(f) {
    etatUi.choisi = f.id;
    fermerMenu();
    consulter(f);
    if (!large()) { ouvrirFiche(f); return; }
    for (const li of $('resultats').querySelectorAll('.carte')) li.classList.toggle('choisie', li.dataset.id === f.id);
    rendreFiche();
  }

  /* ---------- Surnoms ---------- */
  const nomDe = (id) => index.elParId.get(id)?.nom ?? `forfait ${index.forfaitParId.get(id)?.ref ?? '?'}`;
  // Pourquoi ce surnom ne peut pas aller à id (null s'il le peut). Un surnom désigne une seule chose.
  // equipe : un surnom perso ne bloque pas l'équipe (il passe « en conflit » et la recherche l'ignore).
  function surnomRefuse(s, id, equipe = false) {
    const cle = norm(s);
    if (cle.length < 2) return `« ${s} » : un surnom fait au moins 2 lettres ou chiffres.`;
    const el = index.elsActifs.find((e) => norm(e.nom) === cle);
    if (el) return el.id === id ? `« ${s} » est déjà son nom.` : `« ${s} » est déjà le nom de ${el.nom}.`;
    const fam = index.fams.find((f) => norm(f.nom) === cle);
    if (fam) return `« ${s} » est déjà le nom de la famille ${fam.nom}.`;
    const pris = index.surnomPris.get(cle);
    if (!pris || pris.id === id || (equipe && !pris.equipe)) return null;
    return pris.equipe ? `« ${s} » est déjà le surnom de ${nomDe(pris.id)}.`
      : `« ${s} » est déjà ton surnom perso de ${nomDe(pris.id)} : retire-le d'abord (Menu → Mes surnoms).`;
  }

  // Surnoms perso d'un élément ou d'un forfait : tout le monde peut en donner, ils restent sur cet appareil.
  function editeurSurnoms(id, redessiner) {
    const equipe = (index.elParId.get(id) ?? index.forfaitParId.get(id))?.surnoms || [];
    const miens = appareil.surnoms[id] || [];
    const message = h('p', { class: 'msg-erreur msg-reserve', role: 'alert' });
    const champ = h('input', { class: 'champ', maxlength: 200, placeholder: 'Nouveau surnom', 'aria-label': `Nouveau surnom pour ${nomDe(id)}` });
    const enregistrer = (liste) => {
      if (liste.length) appareil.surnoms[id] = liste; else delete appareil.surnoms[id];
      sauverAppareil();
      index = construireIndex();
      redessiner();
    };
    const ajouter = () => {
      if (!champ.value.trim()) return;
      const lus = lireSurnoms(champ.value);
      const nouveaux = lus.filter((s) => !miens.some((x) => norm(x) === norm(s)));
      const refus = nouveaux.map((s) => (equipe.some((x) => norm(x) === norm(s)) ? `« ${s} » est déjà un surnom de l'équipe.` : surnomRefuse(s, id))).filter(Boolean);
      if (!lus.length) { message.textContent = 'Un surnom fait au moins 2 lettres ou chiffres.'; return; }
      if (refus.length || !nouveaux.length) { message.textContent = refus[0] || 'Ce surnom est déjà dans ta liste.'; return; }
      if (miens.length + nouveaux.length > SURNOMS_MAX) { message.textContent = `${SURNOMS_MAX} surnoms au maximum.`; return; }
      enregistrer([...miens, ...nouveaux]);
    };
    champ.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); ajouter(); } });
    return h('div', { class: 'surnoms' },
      h('p', { class: 'aide-texte' }, equipe.length ? `Surnoms de l'équipe : ${equipe.join(', ')}.` : "Pas encore de surnom d'équipe."),
      h('ul', { class: 'liste-elements' }, miens.map((s) => {
        // Pris ensuite par l'équipe pour autre chose (ou devenu le nom d'un élément) : l'équipe gagne.
        const pris = index.surnomPris.get(norm(s));
        return h('li', {}, h('span', { class: 'surnom-mien' }, s),
          pris?.id === id ? null : h('span', { class: 'surnom-conflit' }, 'déjà pris : ignoré'),
          h('button', { type: 'button', class: 'btn btn-danger btn-carre', 'aria-label': `Retirer le surnom ${s}`, onclick: () => enregistrer(miens.filter((x) => x !== s)) }, icone('croix')));
      })),
      message,
      h('div', { class: 'ajout-ligne' }, champ, h('button', { type: 'button', class: 'btn btn-blanc', onclick: ajouter }, 'Ajouter')));
  }

  function ouvrirSurnoms(id) {
    const zone = h('div', {});
    const redessiner = () => zone.replaceChildren(editeurSurnoms(id, redessiner));
    const dlg = ouvrirDialogue({
      titre: `Surnoms : ${nomDe(id)}`,
      corps: [h('p', { class: 'aide-texte' }, 'Tes surnoms restent sur cet appareil. Sépare-les par des virgules.'), zone],
      pied: [h('button', { type: 'button', class: 'btn btn-blanc', onclick: () => dlg.close() }, 'Terminé')],
    });
    dlg.addEventListener('close', rafraichir);
    redessiner();
    zone.querySelector('input')?.focus();
  }

  // Menu → Mes surnoms : surnoms perso des appareils (taximètres, boîtiers…), et la liste de tous les miens.
  function ouvrirMesSurnoms() {
    const choix = h('select', { class: 'champ', id: 'surnoms-element', 'aria-label': 'Élément' },
      h('option', { value: '' }, '— Choisis un élément (taximètre, boîtier…) —'),
      index.fams.map((fam) => h('optgroup', { label: fam.nom }, elementsDe(fam.id).map((e) => h('option', { value: e.id }, e.nom)))));
    const zone = h('div', {});
    const recap = h('ul', { class: 'recap-surnoms' });
    const redessiner = () => {
      zone.replaceChildren(choix.value ? editeurSurnoms(choix.value, redessiner) : '');
      const lignes = Object.entries(appareil.surnoms).filter(([id]) => index.elParId.has(id) || index.forfaitParId.has(id));
      recap.replaceChildren(...(lignes.length ? lignes.map(([id, l]) => h('li', {}, h('strong', {}, nomDe(id)), ` : ${l.join(', ')}`))
        : [h('li', {}, "Aucun surnom perso pour l'instant.")]));
    };
    choix.addEventListener('change', redessiner);
    const dlg = ouvrirDialogue({
      titre: 'Mes surnoms',
      corps: [
        h('p', { class: 'aide-texte' }, "Donne tes propres noms aux appareils : la recherche les reconnaît. Ils restent sur cet appareil. Pour un forfait : l'étiquette en haut de sa fiche."),
        choix, zone, h('h3', { class: 'titre-recap' }, 'Tous mes surnoms'), recap,
      ],
      pied: [h('button', { type: 'button', class: 'btn btn-blanc', onclick: () => dlg.close() }, 'Terminé')],
    });
    dlg.addEventListener('close', rafraichir);
    redessiner();
  }

  function basculerFavori(f) {
    const i = appareil.favoris.indexOf(f.id);
    if (i < 0 && appareil.favoris.length >= USAGE_MAX) { toast(`${USAGE_MAX} favoris au maximum : retires-en un d'abord`, true); return; }
    if (i < 0) appareil.favoris.push(f.id); else appareil.favoris.splice(i, 1);
    sauverAppareil();
    rendreResultats(); // la rangée change de place ; la fiche est redessinée, le clavier reste sur son étoile
    toast(i < 0 ? `${f.ref} en favori : en tête de liste` : `${f.ref} retiré des favoris`);
  }

  /* ---------- Total : additionner plusieurs forfaits, pièces ou services (par appareil, jamais exporté) ---------- */
  const sommeTotal = () => appareil.total.reduce((s, l) => ({ ht: s.ht + l.ht * l.qte, ttc: s.ttc + l.ttc * l.qte }), { ht: 0, ttc: 0 });
  const nbArticlesTotal = () => appareil.total.reduce((n, l) => (l.ttc < 0 ? n : n + l.qte), 0); // une remise n'est pas un article
  const qteDansTotal = (f) => appareil.total.find((l) => l.id === f.id)?.qte || 0;

  // Le forfait vaut-il autre chose que le prix mémorisé par sa ligne du total ? (null : supprimé, ou ligne libre)
  const prixChange = (l) => {
    const f = l.id ? index.forfaitParId.get(l.id) : null;
    return f && (f.ttc !== l.ttc || f.ht !== l.ht) ? f : null;
  };

  // Renvoie la ligne touchée, ou null si l'ajout est refusé.
  function ajouterAuTotal(f) {
    let ligne = appareil.total.find((l) => l.id === f.id);
    if (ligne) {
      if (ligne.qte >= QTE_MAX) { toast(`${QTE_MAX} au maximum pour ${f.ref}`, true); return null; }
      ligne.qte += 1; // le prix reste celui de la première fois : les unités déjà comptées ne changent pas (la ligne le dit)
    } else {
      if (appareil.total.length >= TOTAL_MAX) { toast(`${TOTAL_MAX} lignes au maximum : ouvre le total et retire-en`, true); return null; }
      // Son nom, comme sur sa rangée : la désignation, ou la référence s'il n'en a pas.
      ligne = { id: f.id, nom: (f.designation || f.ref).replace(/\s+/g, ' ').trim().slice(0, 80), qte: 1, ht: f.ht, ttc: f.ttc };
      appareil.total.push(ligne);
    }
    sauverAppareil();
    rendreTotal(ligne);
    majQuantites(f.id);
    toast(`${f.ref} ajouté au total${ligne.qte > 1 ? ` (×${ligne.qte})` : ''}${prixChange(ligne) ? `, à l'ancien prix (${formatPrix(ligne.ttc)} TTC)` : ''}`);
    return ligne;
  }

  // Après un changement du total : les « + » des rangées et la fiche se mettent à jour sur place.
  // Pas de nouveau classement : rien ne doit bouger sous le doigt.
  function majQuantites(idAjoute) {
    for (const li of $('resultats').querySelectorAll('.carte[data-id]')) {
      const f = index.forfaitParId.get(li.dataset.id);
      const bouton = li.querySelector('.btn-plus');
      if (!f || !bouton) continue;
      const q = qteDansTotal(f);
      if ((bouton.dataset.qte || '') === (q ? String(q) : '')) continue;
      if (q) bouton.dataset.qte = q; else delete bouton.dataset.qte;
      bouton.replaceChildren(q ? String(q) : icone('plus'));
      bouton.classList.remove('vient');
      if (f.id === idAjoute) {
        void bouton.offsetWidth; // l'animation repart à chaque ajout
        bouton.classList.add('vient');
      }
    }
    rendreFiche();
  }

  // Le contenu du total : ses lignes, les deux sommes, « Ligne libre » et « Vider ».
  // `ajoutee` : la ligne qui vient d'arriver ou de grossir (elle seule est animée) ; `roule` : la somme a changé.
  function totalContenu(hote, dansFeuille, ajoutee, roule) {
    // La ligne l peut avoir disparu si le total a changé dans un autre onglet : on redessine sans rien toucher.
    // Le bouton touché est recréé : le focus y revient (le « + » si le « − » vient de se désactiver).
    const changer = (l, action, cmd, i) => {
      if (appareil.total.includes(l)) { action(); sauverAppareil(); }
      rendreTotal(null, true);
      majQuantites();
      const bouton = (c) => hote.querySelector(`[data-cmd="${c}"][data-i="${i}"]`);
      ((bouton(cmd)?.disabled ? bouton('plus') : bouton(cmd)) || hote.querySelector('.total-boutons .btn'))?.focus();
    };
    const vider = async () => {
      const ok = await demander({
        titre: 'Vider le total ?', message: `${pluriel(appareil.total.length, 'ligne')} ${appareil.total.length > 1 ? 'seront retirées' : 'sera retirée'}.`,
        boutons: [{ texte: 'Annuler', valeur: false }, { texte: 'Vider', valeur: true, classe: 'btn-rouge' }],
      });
      if (!ok) return;
      appareil.total = [];
      sauverAppareil();
      rendreTotal();
      majQuantites();
    };
    const { ht, ttc } = sommeTotal();
    return [
      h('div', { class: 'total-tete' },
        h('h2', { tabindex: dansFeuille ? -1 : null }, 'Total'), h('span', {}, pluriel(nbArticlesTotal(), 'article')),
        dansFeuille ? h('button', { type: 'button', class: 'btn-icone', 'aria-label': 'Fermer', onclick: () => $('dlg-total').close() }, icone('croix')) : null),
      h('ul', { class: 'total-lignes' }, appareil.total.map((l, i) => {
        const nouveau = prixChange(l);
        const li = h('li', { class: 'total-ligne' },
          h('span', { class: 'total-ligne-nom' }, l.nom),
          h('span', { class: 'total-ligne-prix' }, formatPrix(l.ttc * l.qte), h('small', {}, `${formatPrix(l.ht * l.qte)} HT`)),
          // Le prix gardé est voulu (ce qui est compté ne bouge pas), mais il doit se voir.
          nouveau ? h('span', { class: 'total-ligne-ecart' },
            `Ancien prix : le forfait vaut maintenant ${formatPrix(nouveau.ttc)} TTC (${formatPrix(nouveau.ht)} HT). Retire la ligne pour le nouveau prix.`) : null,
          h('span', { class: 'total-ligne-commandes' },
            h('button', { type: 'button', class: 'btn-icone', 'data-cmd': 'moins', 'data-i': i, 'aria-label': `Moins : ${l.nom}, quantité ${l.qte}`, disabled: l.qte <= 1, onclick: () => changer(l, () => { l.qte -= 1; }, 'moins', i) }, icone('moins')),
            // Pas de zone role=status : le total est recréé à chaque appui, et une zone neuve n'est pas annoncée.
            // La quantité est dans le nom du « − » et du « + », où le focus revient après l'appui.
            h('span', { class: 'total-qte' }, String(l.qte)),
            h('button', { type: 'button', class: 'btn-icone', 'data-cmd': 'plus', 'data-i': i, 'aria-label': `Plus : ${l.nom}, quantité ${l.qte}`, disabled: l.qte >= QTE_MAX, onclick: () => changer(l, () => { l.qte += 1; }, 'plus', i) }, icone('plus')),
            l.qte > 1 ? h('span', { class: 'total-ligne-unite' }, `${formatPrix(l.ttc)} l'unité`) : null,
            h('button', { type: 'button', class: 'btn-icone total-retirer', 'data-cmd': 'retirer', 'data-i': i, 'aria-label': `Retirer ${l.nom}`, onclick: () => changer(l, () => { appareil.total.splice(appareil.total.indexOf(l), 1); }, 'retirer', i) }, icone('croix'))));
        if (l !== ajoutee) li.style.animation = 'none';
        return li;
      })),
      h('div', { class: 'total-pied' },
        h('dl', { class: 'total-somme' },
          h('dt', {}, 'HT'), h('dd', { class: 's-ht' }, formatPrix(ht)),
          h('dt', { class: 's-ttc-t' }, 'TTC'), h('dd', { class: 's-ttc' }, h('span', { class: roule ? 'roule' : null }, formatPrix(ttc)))),
        h('div', { class: 'total-boutons' },
          h('button', { type: 'button', class: 'btn btn-bord', onclick: ouvrirLigneLibre }, icone('plus'), 'Ligne libre'),
          h('button', { type: 'button', class: 'btn btn-nu', onclick: vider }, 'Vider')))];
  }

  // Le total est à deux endroits, jamais en même temps : sous la fiche sur un grand écran assez haut ;
  // ailleurs, une barre qui ouvre une feuille (en bas de l'écran, ou rangée sous le panneau sur un
  // grand écran peu haut). Il disparaît quand il est vide.
  function rendreTotal(ajoutee, roule = Boolean(ajoutee)) {
    const vide = appareil.total.length === 0;
    const grand = totalSousFiche();
    // Grand écran peu haut : la barre se range sous le panneau, et la fiche se serre (data-total).
    const colonne = large() && !grand;
    $('panneau').dataset.total = colonne ? 'barre' : 'panneau';
    $('barre-total').classList.toggle('colonne', colonne);
    $('barre-total').hidden = vide || grand;
    calerBas();
    if (!vide) {
      const { ht, ttc } = sommeTotal();
      $('barre-total-nb').textContent = `Total · ${pluriel(nbArticlesTotal(), 'article')}`;
      $('barre-total-ht').textContent = `${formatPrix(ht)} HT`;
      $('barre-total-ttc').textContent = `${formatPrix(ttc)} TTC`;
      $('barre-total').setAttribute('aria-label', `Voir le total : ${pluriel(nbArticlesTotal(), 'article')}, ${formatPrix(ht)} HT, ${formatPrix(ttc)} TTC`);
    }
    // Redessiné, le total garde le défilement de ses lignes, et montre celle qui vient d'arriver
    // (sans scrollIntoView : il ferait aussi défiler la page sous la souris).
    const poser = (hote, enfants) => {
      const avant = hote.querySelector('.total-lignes')?.scrollTop || 0;
      hote.replaceChildren(...enfants);
      const lignes = hote.querySelector('.total-lignes');
      if (!lignes) return;
      lignes.scrollTop = avant;
      const li = ajoutee ? lignes.children[appareil.total.indexOf(ajoutee)] : null;
      if (!li) return;
      const haut = li.offsetTop - (li.offsetParent === lignes ? 0 : lignes.offsetTop);
      const bas = haut + li.offsetHeight;
      if (haut < lignes.scrollTop) lignes.scrollTop = haut;
      else if (bas > lignes.scrollTop + lignes.clientHeight) lignes.scrollTop = Math.min(haut, bas - lignes.clientHeight);
    };
    const panneau = $('total');
    panneau.hidden = vide || !grand;
    poser(panneau, panneau.hidden ? [] : totalContenu(panneau, false, ajoutee, roule));
    const feuille = $('dlg-total');
    if (!feuille.open) return;
    if (vide || grand) { feuille.close(); return; }
    const hote = $('feuille-total');
    poser(hote, [h('div', { class: 'poignee' }), ...totalContenu(hote, true, ajoutee, roule)]);
  }

  // La barre du total grandit avec la taille du texte (ses montants passent sur deux lignes) : le
  // rappel d'export et le bas de la liste se calent sur sa vraie hauteur, pas sur une hauteur supposée.
  // Rangée sous le panneau (.colonne), elle ne couvre plus la liste : c'est le panneau qui lui laisse la place.
  function calerBas() {
    const barre = $('barre-total');
    const haut = barre.offsetHeight; // 0 quand elle est cachée
    const colonne = barre.classList.contains('colonne');
    document.body.style.setProperty('--bas-total', haut && !colonne ? `${haut + 10}px` : '0px');
    document.body.style.setProperty('--bas-colonne', haut && colonne ? `${haut + 12}px` : '0px');
  }

  function ouvrirTotal() {
    if (appareil.total.length === 0 || totalSousFiche()) return;
    const feuille = $('dlg-total');
    if (!feuille.open) feuille.showModal();
    rendreTotal();
    feuille.querySelector('h2')?.focus();
  }

  // Pièce ou service qui n'est pas un forfait : on tape un nom et un prix (l'autre prix se calcule).
  // La fenêtre reste ouverte après un ajout : on en saisit souvent plusieurs de suite.
  function ouvrirLigneLibre() {
    const nom = h('input', { class: 'champ', maxlength: 80, placeholder: 'Nom (pièce, service…)', 'aria-label': 'Nom de la ligne libre' });
    const ht = h('input', { class: 'champ', inputmode: 'decimal', placeholder: 'Prix HT', 'aria-label': 'Prix HT de la ligne libre' });
    const ttc = h('input', { class: 'champ', inputmode: 'decimal', placeholder: 'Prix TTC', 'aria-label': 'Prix TTC de la ligne libre' });
    ht.addEventListener('input', () => { const v = lirePrixLibre(ht.value); ttc.value = v === null ? '' : prixSaisie(ttcDepuisHt(v)); });
    ttc.addEventListener('input', () => { const v = lirePrixLibre(ttc.value); ht.value = v === null ? '' : prixSaisie(htDepuisTtc(v)); });
    const erreur = h('p', { class: 'msg-erreur msg-reserve', role: 'alert' });
    const dlg = ouvrirDialogue({
      titre: 'Ligne libre',
      corps: h('div', { class: 'total-libre' },
        h('p', { class: 'aide-texte' }, "Une pièce ou un service qui n'est pas un forfait : tape un des deux prix, l'autre se calcule. Pour une remise, mets un moins devant (-50)."),
        nom, h('div', { class: 'total-libre-prix' }, ht, ttc), erreur),
      pied: [
        h('button', { type: 'button', class: 'btn btn-bord', onclick: () => dlg.close() }, 'Terminé'),
        h('button', { type: 'submit', class: 'btn btn-rouge' }, icone('plus'), 'Ajouter à la liste'),
      ],
      surEnvoi: () => {
        const prixHt = lirePrixLibre(ht.value);
        const prixTtc = lirePrixLibre(ttc.value);
        erreur.textContent = '';
        if (prixHt === null || prixTtc === null) {
          // Le champ mal écrit (l'autre est resté vide, faute de prix à calculer), sinon le premier vide.
          const fautif = [ht, ttc].find((c) => c.value.trim() && lirePrixLibre(c.value) === null) || (prixHt === null ? ht : ttc);
          erreur.textContent = erreurPrix(fautif.value);
          fautif.focus();
          return;
        }
        if (appareil.total.length >= TOTAL_MAX) { erreur.textContent = `${TOTAL_MAX} lignes au maximum : retires-en une.`; return; }
        // HT et TTC se calculent l'un de l'autre, mais l'un peut être retouché ensuite : pas de ligne à moitié
        // négative (la relecture des données de l'appareil la refuserait).
        if (Math.sign(prixHt) * Math.sign(prixTtc) < 0) { erreur.textContent = 'Le HT et le TTC doivent avoir le même signe.'; ht.focus(); return; }
        const ligne = { id: null, nom: nom.value.trim().slice(0, 80) || (prixTtc < 0 ? 'Remise' : 'Divers'), qte: 1, ht: prixHt, ttc: prixTtc };
        appareil.total.push(ligne);
        sauverAppareil();
        nom.value = ht.value = ttc.value = '';
        rendreTotal(ligne);
        toast(`${ligne.nom} ajouté au total`);
        nom.focus();
      },
    });
  }

  function rendreRappel() {
    const n = appareil.modifsEnAttente;
    $('rappel').hidden = n === 0 || donneesFutures;  // exporter est refusé sur une page en retard : pas de rappel
    document.body.classList.toggle('avec-rappel', !$('rappel').hidden); // la liste garde de la place sous le rappel
    // La consigne est à part : sur un téléphone elle est cachée (CSS), pour que le rappel tienne sur une ligne.
    $('rappel-texte').replaceChildren(`${pluriel(n, 'modification')} pas encore ${n > 1 ? 'exportées' : 'exportée'}`,
      h('span', { class: 'rappel-suite' }, ' : exporte et range le fichier dans OneDrive.'));
  }

  /* ---------- Suggestions ---------- */
  function majSuggestions() {
    const champ = $('recherche');
    const liste = $('suggestions');
    const { liste: suggestions, nbMots, via } = document.activeElement === champ ? calculerSuggestions(champ.value) : { liste: [], nbMots: 0, via: new Map() };
    etatUi.suggestions = suggestions;
    etatUi.nbMotsSuggestion = nbMots;
    etatUi.suggestionActive = -1;
    liste.replaceChildren(...suggestions.map((e, i) => h('li', {
      id: 'sugg-' + i, role: 'option', class: 'suggestion', 'aria-selected': 'false',
      onpointerdown: (ev) => ev.preventDefault(), // garde le clavier ouvert le temps du clic
      onclick: () => choisirSuggestion(i, false),
    }, h('span', { class: 'suggestion-nom' }, e.nom), via.has(e.id) ? h('span', { class: 'suggestion-surnom' }, `« ${via.get(e.id)} »`) : null,
    h('span', { class: 'suggestion-info' }, h('span', { class: 'suggestion-famille' }, index.famParId.get(e.familleId).nom),
      ` · ${pluriel(index.forfaits.filter((f) => f.elements[e.familleId] === e.id).length, 'forfait')}`))));
    liste.hidden = suggestions.length === 0;
    champ.setAttribute('aria-expanded', String(suggestions.length > 0));
    champ.removeAttribute('aria-activedescendant');
  }

  function activerSuggestion(i) {
    etatUi.suggestionActive = i;
    $('suggestions').querySelectorAll('.suggestion').forEach((li, j) => li.setAttribute('aria-selected', String(i === j)));
    $('recherche').setAttribute('aria-activedescendant', 'sugg-' + i);
    $('sugg-' + i)?.scrollIntoView({ block: 'nearest' });
  }

  // Transforme la suggestion en filtre et retire les mots correspondants de la recherche.
  function choisirSuggestion(i, auClavier) {
    const e = etatUi.suggestions[i];
    if (!e) return;
    etatUi.filtres.set(e.familleId, e.id);
    noterUsage('usageElements', e.id);
    const champ = $('recherche');
    const mots = decouper(champ.value);
    const reste = mots.slice(0, mots.length - etatUi.nbMotsSuggestion).join(' ');
    champ.value = reste ? reste + ' ' : '';
    if (!auClavier) champ.blur(); // au doigt : on range le clavier pour voir les résultats
    rendreRecherche();
  }

  function toutEffacer() {
    $('recherche').value = '';
    etatUi.filtres.clear();
    rendreRecherche();
  }

  /* =====================================================================
     FENÊTRES
     ===================================================================== */
  function ouvrirDialogue({ titre, corps, pied, surEnvoi, classe }) {
    const idTitre = nouvelId('dlg');
    const contenu = [h('div', { class: 'dlg-corps' }, corps), pied ? h('div', { class: 'dlg-pied' }, pied) : null];
    const dlg = h('dialog', { class: 'dlg ' + (classe || ''), 'aria-labelledby': idTitre },
      h('div', { class: 'dlg-tete' },
        h('h2', { id: idTitre }, titre),
        h('button', { type: 'button', class: 'btn-icone', 'aria-label': 'Fermer', onclick: () => dlg.close() }, icone('croix'))),
      surEnvoi
        ? h('form', { class: 'dlg-form', novalidate: true, onsubmit: (ev) => { ev.preventDefault(); surEnvoi(); } }, contenu)
        : contenu);
    dlg.addEventListener('close', () => dlg.remove());
    document.body.append(dlg);
    dlg.showModal();
    return dlg;
  }

  // Pose une question ; renvoie la valeur du bouton choisi (null si fermé).
  function demander({ titre, message, liste, boutons }) {
    return new Promise((resoudre) => {
      let valeur = null;
      const dlg = ouvrirDialogue({
        titre,
        corps: [
          message ? h('p', { class: 'dlg-message' }, message) : null,
          liste?.length ? h('ul', { class: 'dlg-liste' }, liste.map((x) => h('li', {}, x))) : null,
        ],
        pied: boutons.map((b) => h('button', {
          type: 'button', class: 'btn ' + (b.classe || 'btn-bord'),
          onclick: () => { valeur = b.valeur; dlg.close(); },
        }, b.texte)),
      });
      dlg.addEventListener('close', () => resoudre(valeur));
    });
  }
  const informer = (titre, message, liste) => demander({ titre, message, liste, boutons: [{ texte: 'Compris', valeur: true, classe: 'btn-blanc' }] });

  // Le message s'affiche dans la fenêtre ouverte, s'il y en a une : derrière elle, on ne le verrait
  // pas et un lecteur d'écran ne l'annoncerait pas (le reste de la page est mis hors d'usage).
  // `action` ({ texte, faire }) : un bouton dans le message (« Annuler » après une suppression) ;
  // le message reste alors 8 s, et tant que le clavier est sur son bouton.
  const elToast = $('toast');
  let minuteurToast = 0;
  function toast(message, erreur = false, action = null) {
    const ouvertes = document.querySelectorAll('dialog[open]');
    const hote = ouvertes[ouvertes.length - 1] || document.body;
    if (elToast.parentNode !== hote) hote.append(elToast);
    elToast.replaceChildren(message, ...(action ? [h('button', {
      type: 'button', class: 'btn btn-blanc', onclick: (ev) => { ev.currentTarget.blur(); cacherToast(); action.faire(); },
    }, action.texte)] : []));
    elToast.classList.toggle('erreur', erreur);
    elToast.classList.toggle('avec-action', Boolean(action));
    elToast.classList.add('visible');
    clearTimeout(minuteurToast);
    minuteurToast = setTimeout(cacherToast, action ? 8000 : 3000);
  }
  function cacherToast() {
    clearTimeout(minuteurToast);
    if (elToast.contains(document.activeElement)) { minuteurToast = setTimeout(cacherToast, 1000); return; }
    elToast.classList.remove('visible');
    // Le bouton d'un message caché ne doit plus se prendre au clavier : il part après le fondu.
    minuteurToast = setTimeout(() => { elToast.querySelector('button')?.remove(); elToast.classList.remove('avec-action'); }, 250);
  }
  // La fenêtre se ferme : le message en cours retourne dans la page.
  document.addEventListener('close', (ev) => {
    if (ev.target instanceof Element && ev.target.contains(elToast)) document.body.append(elToast);
  }, true);

  /* ---------- Copier la référence ---------- */
  const minuteursCopie = new WeakMap();
  async function copier(texte, bouton) {
    let ok = false;
    try {
      await navigator.clipboard.writeText(texte);
      ok = true;
    } catch {
      // Ancienne méthode, pour les navigateurs qui refusent la première. La zone va dans la fenêtre
      // ouverte s'il y en a une : en dehors, rien ne peut être sélectionné.
      const zone = h('textarea', { class: 'sr', readonly: true }, texte);
      (bouton.closest('dialog') || document.body).append(zone);
      zone.select();
      try { ok = document.execCommand('copy'); } catch { ok = false; }
      zone.remove();
    }
    toast(ok ? `Référence ${texte} copiée` : 'Copie impossible : sélectionne la référence à la main', !ok);
    if (ok) {
      // Le bouton confirme aussi, là où le regard se trouve : sa coche remplace l'icône un instant.
      bouton.classList.add('copie');
      // Un second clic repart pour 1,5 s au lieu d'hériter du premier minuteur.
      clearTimeout(minuteursCopie.get(bouton));
      minuteursCopie.set(bouton, setTimeout(() => bouton.classList.remove('copie'), 1500));
    }
  }

  /* =====================================================================
     AJOUTER / MODIFIER / SUPPRIMER UN FORFAIT
     ===================================================================== */
  function ouvrirFormulaire(existant) {
    if (lectureSeule()) return;
    const autre = (f) => f.id !== existant?.id;
    const champRef = h('input', { id: 'f-ref', class: 'champ', value: existant?.ref ?? '', maxlength: 80, autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false' });
    const msgRef = h('p', { class: 'msg-champ', 'aria-live': 'polite' });
    const champDes = h('textarea', { id: 'f-des', class: 'champ', rows: 3, maxlength: 2000 }, existant?.designation ?? '');
    const champSurnoms = h('input', { id: 'f-surnoms', class: 'champ', maxlength: 600, autocomplete: 'off', placeholder: 'le gros pack, pack nuit', value: (existant?.surnoms || []).join(', ') });
    const champHt = h('input', { id: 'f-ht', class: 'champ', inputmode: 'decimal', autocomplete: 'off', placeholder: '1 234,50', value: existant ? prixSaisie(existant.ht) : '' });
    const champTtc = h('input', { id: 'f-ttc', class: 'champ', inputmode: 'decimal', autocomplete: 'off', placeholder: '1 481,40', value: existant ? prixSaisie(existant.ttc) : '' });
    const calcul = (source, cible, conversion) => () => {
      const valeur = lirePrix(source.value);
      if (valeur !== null) cible.value = prixSaisie(conversion(valeur));
    };
    const listes = index.fams.map((fam) => h('select', { id: 'f-fam-' + fam.id, class: 'champ', 'data-famille': fam.id },
      h('option', { value: '' }, '— Aucun —'),
      elementsDe(fam.id).map((e) => h('option', { value: e.id, selected: existant?.elements[fam.id] === e.id }, e.nom))));
    const msgErreur = h('p', { class: 'msg-erreur', role: 'alert' });

    // Contrôle de la référence pendant la frappe.
    const dejaPrise = (doublon) => `Cette référence existe déjà${doublon.designation ? ' : ' + doublon.designation : ''}.`;
    const verifierRef = () => {
      const ref = champRef.value.trim();
      const doublon = ref ? index.forfaits.find((f) => autre(f) && memeRef(f.ref, ref)) : null;
      const proche = ref && !doublon ? index.forfaits.find((f) => autre(f) && norm(f.ref) === norm(ref)) : null;
      msgRef.className = 'msg-champ' + (doublon ? ' erreur' : proche ? ' attention' : '');
      msgRef.textContent = doublon ? dejaPrise(doublon) : proche ? `Ressemble à la référence existante ${proche.ref}.` : '';
      return { doublon, proche };
    };
    champRef.addEventListener('input', () => {
      // La référence change : le refus posé sous elle à l'enregistrement ne vaut plus, le contrôle en direct reprend la main.
      if (msgErreur.parentElement === champRef.parentElement) msgErreur.textContent = '';
      verifierRef();
    });

    const enregistrer = async () => {
      const { doublon, proche } = verifierRef();
      const ref = champRef.value.trim();
      const ht = lirePrix(champHt.value);
      const ttc = lirePrix(champTtc.value);
      const surnoms = lireSurnoms(champSurnoms.value, Infinity);
      // Seuls les surnoms ajoutés sont contrôlés : un ancien doublon (déjà ignoré par la recherche) ne bloque pas un changement de prix.
      const ajoutes = nouveaux(surnoms, existant?.surnoms);
      const surnomPris = (ajoutes.length && tropDeSurnoms(surnoms)) || ajoutes.map((s) => surnomRefuse(s, existant?.id, true)).find(Boolean);
      const [probleme, champFautif] = !ref ? ['La référence est obligatoire.', champRef]
        : doublon ? [`${dejaPrise(doublon)} Choisis-en une autre.`, champRef]
        : ht === null ? ['Prix HT invalide (exemple : 1 234,50).', champHt]
        : ttc === null ? ['Prix TTC invalide (exemple : 1 481,40).', champTtc]
        : surnomPris ? [surnomPris, champSurnoms]
        : ['', null];
      msgErreur.textContent = probleme;
      if (probleme) {
        if (champFautif === champRef) msgRef.textContent = ''; // un seul message sous la référence : le refus dit déjà tout
        champFautif.closest('.champ-groupe')?.append(msgErreur); // le message apparaît sous le champ à corriger, pas en bas du formulaire
        champFautif.focus();
        return;
      }

      const elements = {};
      for (const liste of listes) if (liste.value) elements[liste.dataset.famille] = liste.value;

      // Avertissements : on laisse enregistrer après confirmation.
      const avertissements = [];
      if (proche) avertissements.push(`La référence ressemble à ${proche.ref}.`);
      const cle = cleCombinaison(elements);
      const memes = cle ? index.forfaits.filter((f) => autre(f) && cleCombinaison(f.elements) === cle) : [];
      if (memes.length) avertissements.push(`Même combinaison d'éléments que : ${memes.map((f) => f.ref).join(', ')}.`);
      const attendu = ttcDepuisHt(ht);
      if (Math.abs(ttc - attendu) > TOLERANCE_TVA) avertissements.push(`Le TTC (${formatPrix(ttc)}) ne correspond pas au HT + ${TAUX_TVA} (${formatPrix(attendu)}).`);
      if (avertissements.length) {
        const ok = await demander({
          titre: "Vérifie avant d'enregistrer", liste: avertissements,
          boutons: [{ texte: 'Enregistrer quand même', valeur: true, classe: 'btn-rouge' }, { texte: 'Revenir', valeur: false }],
        });
        if (!ok) return;
      }

      // Un exemple modifié devient un vrai forfait : il ne sera pas effacé avec les exemples.
      const { exemple: _ancienExemple, surnoms: _anciensSurnoms, ...base } = existant || { id: nouvelId('fft') };
      const forfait = { ...base, ref, designation: champDes.value.trim(), ...avecSurnoms(surnoms), ht, ttc, elements, maj: Date.now() };
      remplacer(donnees.forfaits, forfait);
      if (!sauver()) return;
      noterModif();
      dlg.close();
      rafraichir();
      toast(existant ? `Forfait ${ref} modifié` : `Forfait ${ref} ajouté`);
    };

    const groupe = (label, champ, ...apres) => h('div', { class: 'champ-groupe' }, h('label', { for: champ.id }, label), champ, apres);
    const dlg = ouvrirDialogue({
      titre: existant ? `Modifier ${existant.ref}` : 'Ajouter un forfait',
      classe: 'dlg-large',
      surEnvoi: enregistrer,
      corps: [
        existant?.exemple ? h('p', { class: 'note-exemple' }, 'Ce forfait est un EXEMPLE. Une fois enregistré, il devient un vrai forfait : vérifie bien la référence et les prix.') : null,
        groupe('Référence *', champRef, msgRef),
        groupe('Désignation / contenu', champDes),
        groupe("Surnoms de l'équipe (3 max, séparés par des virgules)", champSurnoms),
        h('div', { class: 'ligne-prix' },
          groupe('Prix HT *', champHt, h('button', { type: 'button', class: 'btn-lien', onclick: calcul(champTtc, champHt, htDepuisTtc) }, 'Calculer depuis le TTC')),
          groupe('Prix TTC *', champTtc, h('button', { type: 'button', class: 'btn-lien', onclick: calcul(champHt, champTtc, ttcDepuisHt) }, `Calculer depuis le HT (+ ${TAUX_TVA})`))),
        h('div', { class: 'grille-familles' }, index.fams.map((fam, i) => groupe(fam.nom, listes[i]))),
      ],
      pied: [
        h('button', { type: 'submit', class: 'btn btn-rouge', id: 'f-enregistrer' }, 'Enregistrer'),
