        h('button', { type: 'button', class: 'btn btn-bord', onclick: () => dlg.close() }, 'Annuler'),
      ],
    });
    verifierRef();
    champRef.focus();
  }

  async function supprimerForfait(f) {
    const ok = await demander({
      titre: 'Supprimer ce forfait ?',
      message: [h('strong', {}, f.ref), f.designation ? ' — ' + f.designation : ''],
      liste: ["La suppression passera aussi sur les autres appareils quand ils importeront ton prochain export."],
      boutons: [{ texte: 'Supprimer', valeur: true, classe: 'btn-rouge' }, { texte: 'Annuler', valeur: false }],
    });
    if (!ok) return;
    remplacer(donnees.forfaits, { ...f, supprime: true, maj: Date.now() });
    if (!sauver()) return;
    noterModif();
    rafraichir();
    toast(`Forfait ${f.ref} supprimé`, false, { texte: 'Annuler', faire: () => annulerSuppression(f.id) });
  }

  // « Annuler » du message de suppression : le forfait revient avec une date plus récente que sa
  // suppression (remplacer), donc la fusion le fait revenir aussi sur un appareil qui l'a déjà reçue.
  function annulerSuppression(id) {
    if (lectureSeule()) return;
    const actuel = donnees.forfaits.find((x) => x.id === id);
    if (!actuel?.supprime) return;
    if (index.forfaits.some((x) => memeRef(x.ref, actuel.ref))) { toast(`Impossible : un autre forfait porte déjà la référence ${actuel.ref}`, true); return; }
    const rendu = { ...actuel, maj: Date.now() };
    delete rendu.supprime;
    remplacer(donnees.forfaits, rendu);
    if (!sauver()) return;
    noterModif();
    rafraichir();
    toast(`Forfait ${actuel.ref} rétabli`);
  }

  // Marque supprimés les forfaits EXEMPLE, puis les éléments d'exemple devenus inutiles et jamais retouchés (maj 0). Les appareils
  // d'avant n'avaient pas marqué leurs éléments de départ : maj 0 suffit (un élément créé ou importé a toujours une date).
  // seulementMarques : retrait automatique, sans le choix de l'utilisateur (un élément d'un fichier sans date a aussi maj 0).
  function marquerExemplesSupprimes(seulementMarques = false) {
    const maintenant = Date.now();
    for (const f of donnees.forfaits.filter((x) => x.exemple && !x.supprime)) remplacer(donnees.forfaits, { ...f, supprime: true, maj: maintenant });
    const utilises = new Set(donnees.forfaits.filter((f) => !f.supprime).flatMap((f) => Object.values(f.elements)));
    for (const e of donnees.elements) {
      const exemple = e.maj === 0 && (e.exemple || !seulementMarques);  // retouché (renommé…) : il est à l'utilisateur
      if (exemple && !e.supprime && !utilises.has(e.id)) remplacer(donnees.elements, { ...e, supprime: true, maj: maintenant });
    }
  }

  async function supprimerExemples() {
    const exemples = index.forfaits.filter((f) => f.exemple);
    const ok = await demander({
      titre: 'Supprimer les exemples ?',
      message: `Les ${pluriel(exemples.length, 'forfait')} marqués EXEMPLE seront supprimés, avec les éléments de départ que tu n'as ni utilisés ni modifiés. Tes vrais forfaits ne bougent pas.`,
      boutons: [{ texte: 'Supprimer les exemples', valeur: true, classe: 'btn-rouge' }, { texte: 'Annuler', valeur: false }],
    });
    if (!ok) return;
    marquerExemplesSupprimes();
    if (!sauver()) return;
    noterModif();
    rafraichir();
    toast('Exemples supprimés');
  }

  /* =====================================================================
     LISTES DES ÉLÉMENTS (familles et éléments, modifiables sans toucher au code)
     ===================================================================== */
  function ouvrirListes() {
    if (lectureSeule()) return;
    const message = h('p', { class: 'msg-erreur msg-reserve', role: 'alert' });
    const conteneur = h('div', {});
    // Des surnoms refusés restent dans leur champ, marqué, pour être corrigés sans tout retaper. Au changement suivant
    // qui réussit (ou au refus suivant, ailleurs), le champ reprend ce qui est enregistré et le message s'en va avec lui :
    // il ne parlerait plus de rien.
    let refuse = null;
    const signaler = (texte, champ = null, enregistre = '') => {
      message.textContent = texte;
      if (refuse) {
        refuse.champ.removeAttribute('aria-invalid');
        if (refuse.champ !== champ) refuse.champ.value = refuse.enregistre;
      }
      refuse = texte && champ ? { champ, enregistre } : null;
      if (refuse) champ.setAttribute('aria-invalid', 'true');
    };
    // Après un renommage on ne redessine pas : le clic en cours sur un autre bouton serait perdu.
    const changer = (redessinerAussi = true) => {
      if (!sauver()) return;
      signaler('');
      noterModif();
      if (redessinerAussi) redessiner(); else index = construireIndex();
    };
    const redessiner = () => {
      index = construireIndex();
      conteneur.replaceChildren(...contenuListes(signaler, changer));
    };
    const dlg = ouvrirDialogue({
      titre: 'Listes des éléments',
      classe: 'dlg-large',
      corps: [h('p', { class: 'aide-texte' }, 'Ajoute ici les nouveaux taximètres, boîtiers, imprimantes… Ils apparaissent tout de suite dans la recherche et dans le formulaire.'), message, conteneur],
      pied: [h('button', { type: 'button', class: 'btn btn-blanc', onclick: () => dlg.close() }, 'Terminé')],
    });
    dlg.addEventListener('close', rafraichir);
    redessiner();
  }

  function contenuListes(signaler, changer) {
    const fams = index.fams;
    const nomLibre = (nom, liste, idActuel) => !liste.some((x) => x.id !== idActuel && norm(x.nom) === norm(nom));
    // Une famille nommée « Exemple » ou « HT » donnait deux colonnes de même titre à l'export, et l'import lisait la mauvaise.
    const colonneFixe = (nom) => (COLONNES_TABLEAU.has(norm(nom)) ? `« ${nom} » est le titre d'une colonne du tableau Excel : choisis un autre nom de famille.` : null);

    const blocs = fams.map((fam) => {
      const champNom = h('input', { class: 'champ', value: fam.nom, maxlength: 60, 'aria-label': 'Nom de la famille ' + fam.nom });
      champNom.addEventListener('change', () => {
        const courante = donnees.familles.find((x) => x.id === fam.id);
        const nom = champNom.value.trim();
        if (colonneFixe(nom)) { signaler(colonneFixe(nom)); champNom.value = courante.nom; return; }
        if (!nom || !nomLibre(nom, index.fams, fam.id)) {
          signaler(nom ? `La famille « ${nom} » existe déjà.` : 'Le nom ne peut pas être vide.');
          champNom.value = courante.nom;
          return;
        }
        signaler('');
        remplacer(donnees.familles, { ...courante, nom, maj: Date.now() });
        changer(false);
      });
      const champNouveau = h('input', { class: 'champ', maxlength: 60, placeholder: 'Nouvel élément', 'aria-label': 'Nouvel élément pour ' + fam.nom });
      const ajouter = () => {
        const nom = champNouveau.value.trim();
        if (!nom) return;
        if (!nomLibre(nom, elementsDe(fam.id))) { signaler(`« ${nom} » existe déjà dans ${fam.nom}.`); return; }
        const surnomDeja = index.surnomPris.get(norm(nom));
        if (surnomDeja?.equipe) { signaler(`« ${nom} » est déjà le surnom de ${nomDe(surnomDeja.id)}.`); return; }
        signaler('');
        donnees.elements.push({ id: nouvelId('elt'), familleId: fam.id, nom, maj: Date.now() });
        changer();
      };
      champNouveau.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); ajouter(); } });

      return h('section', { class: 'famille-bloc' },
        h('div', { class: 'famille-tete' },
          champNom,
          h('button', { type: 'button', class: 'btn btn-danger', onclick: () => supprimerFamille(fam, changer) }, 'Supprimer la famille')),
        h('ul', { class: 'liste-elements' }, elementsDe(fam.id).map((e) => {
          const champ = h('input', { class: 'champ', value: e.nom, maxlength: 60, 'aria-label': `Nom de l'élément ${e.nom}` });
          champ.addEventListener('change', () => {
            const courant = donnees.elements.find((x) => x.id === e.id);
            const nom = champ.value.trim();
            const surnomDeja = nom && index.surnomPris.get(norm(nom));
            if (!nom || !nomLibre(nom, elementsDe(fam.id), e.id) || (surnomDeja?.equipe && surnomDeja.id !== e.id)) {
              signaler(!nom ? 'Le nom ne peut pas être vide.' : surnomDeja?.equipe && surnomDeja.id !== e.id
                ? `« ${nom} » est déjà le surnom de ${nomDe(surnomDeja.id)}.` : `« ${nom} » existe déjà dans ${fam.nom}.`);
              champ.value = courant.nom;
              return;
            }
            signaler('');
            // Renommé en l'un de ses surnoms : ce surnom devient son nom, il quitte la liste.
            const { surnoms: _anciens, ...reste } = courant;
            remplacer(donnees.elements, { ...reste, ...avecSurnoms((courant.surnoms || []).filter((s) => norm(s) !== norm(nom))), nom, maj: Date.now() });
            changer(false);
          });
          // Surnoms d'équipe : partent dans le fichier exporté, comme le nom.
          const champSurnoms = h('input', {
            class: 'champ champ-surnoms', value: (e.surnoms || []).join(', '), maxlength: 600, placeholder: 'Surnoms (3 max, séparés par des virgules)',
            'aria-label': `Surnoms de l'élément ${e.nom}`,
          });
          champSurnoms.addEventListener('change', () => {
            const courant = donnees.elements.find((x) => x.id === e.id);
            const surnoms = lireSurnoms(champSurnoms.value, Infinity);
            const ajoutes = nouveaux(surnoms, courant.surnoms);
            const refus = (ajoutes.length && tropDeSurnoms(surnoms)) || ajoutes.map((s) => surnomRefuse(s, e.id, true)).find(Boolean);
            if (refus) {
              signaler(refus, champSurnoms, (courant.surnoms || []).join(', '));
              return;
            }
            signaler('');
            const { surnoms: _anciens, ...reste } = courant;
            remplacer(donnees.elements, { ...reste, ...avecSurnoms(surnoms), maj: Date.now() });
            champSurnoms.value = surnoms.join(', ');
            changer(false);
          });
          return h('li', { class: 'element-ligne' }, champ, champSurnoms,
            h('button', { type: 'button', class: 'btn btn-danger btn-carre', 'aria-label': `Supprimer ${e.nom}`, onclick: () => supprimerElement(e, fam, changer) }, icone('croix')));
        })),
        h('div', { class: 'ajout-ligne' }, champNouveau, h('button', { type: 'button', class: 'btn btn-blanc', onclick: ajouter }, 'Ajouter')));
    });

    const champFamille = h('input', { class: 'champ', id: 'nouvelle-famille', maxlength: 60, placeholder: 'Ex. : TPE, Rétroviseur…', 'aria-label': 'Nouvelle famille' });
    const ajouterFamille = () => {
      const nom = champFamille.value.trim();
      if (colonneFixe(nom)) { signaler(colonneFixe(nom)); return; }
      if (!nom) return;
      if (!nomLibre(nom, index.fams)) { signaler(`La famille « ${nom} » existe déjà.`); return; } // index.fams : `fams` est périmée après un renommage
      signaler('');
      const ordre = Math.max(0, ...donnees.familles.map((f) => f.ordre)) + 1;
      donnees.familles.push({ id: nouvelId('fam'), nom, ordre, maj: Date.now() });
      changer();
    };
    champFamille.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); ajouterFamille(); } });

    return [...blocs, h('section', { class: 'famille-bloc' },
      h('label', { for: 'nouvelle-famille', class: 'el-nom' }, 'Ajouter une famille'),
      h('div', { class: 'ajout-ligne' }, champFamille, h('button', { type: 'button', class: 'btn btn-rouge', onclick: ajouterFamille }, 'Ajouter')))];
  }


  // On refuse de supprimer un élément encore utilisé : on ne perd jamais une info sans le voir.
  async function supprimerElement(e, fam, changer) {
    const utilisateurs = index.forfaits.filter((f) => f.elements[fam.id] === e.id);
    if (utilisateurs.length) {
      await informer('Suppression impossible', `« ${e.nom} » est utilisé par ${pluriel(utilisateurs.length, 'forfait')}. Renomme-le, ou modifie d'abord ces forfaits :`, refsAbregees(utilisateurs));
      return;
    }
    const ok = await demander({
      titre: 'Supprimer cet élément ?', message: `« ${e.nom} » sera retiré de la liste ${fam.nom}.`,
      boutons: [{ texte: 'Supprimer', valeur: true, classe: 'btn-rouge' }, { texte: 'Annuler', valeur: false }],
    });
    if (!ok) return;
    remplacer(donnees.elements, { ...e, supprime: true, maj: Date.now() });
    changer();
  }

  async function supprimerFamille(fam, changer) {
    const ids = new Set(elementsDe(fam.id).map((e) => e.id));
    const utilisateurs = index.forfaits.filter((f) => ids.has(f.elements[fam.id]));
    if (utilisateurs.length) {
      await informer('Suppression impossible', `La famille ${fam.nom} est utilisée par ${pluriel(utilisateurs.length, 'forfait')} :`, refsAbregees(utilisateurs));
      return;
    }
    const ok = await demander({
      titre: 'Supprimer cette famille ?', message: `La famille ${fam.nom} et sa liste (${pluriel(ids.size, 'élément')}) seront supprimées.`,
      boutons: [{ texte: 'Supprimer', valeur: true, classe: 'btn-rouge' }, { texte: 'Annuler', valeur: false }],
    });
    if (!ok) return;
    const maintenant = Date.now();
    remplacer(donnees.familles, { ...fam, supprime: true, maj: maintenant });
    for (const e of donnees.elements) if (ids.has(e.id)) remplacer(donnees.elements, { ...e, supprime: true, maj: maintenant });
    changer();
  }

  const refsAbregees = (forfaits) => [...forfaits.slice(0, 10).map((f) => f.ref), forfaits.length > 10 ? `… et ${forfaits.length - 10} autres` : null].filter(Boolean);

  /* =====================================================================
     EXPORTER / IMPORTER
     ===================================================================== */
  function telecharger(nom, contenu, type) {
    const url = URL.createObjectURL(new Blob([contenu], { type }));
    const lien = h('a', { href: url, download: nom, hidden: true });
    document.body.append(lien);
    lien.click();
    lien.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  // Edge et Chrome sur PC proposent de choisir le dossier, et rouvrent ensuite le même (celui de OneDrive) :
  // plus besoin de déplacer le fichier depuis Téléchargements. Ailleurs (Firefox, Android), téléchargement classique.
  // iPhone et iPad : un téléchargement peut ne rien enregistrer (appli d'écran d'accueil), donc menu Partager,
  // qui propose « Enregistrer dans Fichiers » et OneDrive.
  // Renvoie 'choisi', 'partage', 'telecharge', ou null si la personne a annulé.
  async function exporterJson() {
    const nom = `forfaits-${horodatage()}.json`;
    const contenu = JSON.stringify({ format: FORMAT, version: VERSION_FORMAT, exporteLe: new Date().toISOString(), ...donnees }, null, 1);
    let resultat = 'telecharge';
    const apple = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const fichierPartage = apple && navigator.canShare ? new File([contenu], nom, { type: 'application/json' }) : null;
    if (fichierPartage && navigator.canShare({ files: [fichierPartage] })) {
      try {
        await navigator.share({ files: [fichierPartage] });
        resultat = 'partage';
      } catch (err) {
        if (err.name === 'AbortError') return null;
        // Partage refusé : téléchargement sans preuve qu'il enregistre quelque chose, le rappel reste.
        telecharger(nom, contenu, 'application/json');
        return 'telecharge';
      }
    } else try {
      if (!window.showSaveFilePicker) throw new Error('indisponible');
      const fichier = await window.showSaveFilePicker({
        id: 'forfaits', suggestedName: nom,
        types: [{ description: 'Fichier de forfaits', accept: { 'application/json': ['.json'] } }],
      });
      const flux = await fichier.createWritable();
      await flux.write(contenu);
      await flux.close();
      resultat = 'choisi';
    } catch (err) {
      if (err.name === 'AbortError') return null;
      telecharger(nom, contenu, 'application/json'); // refusé (page ouverte en fichier, règle de l'entreprise…)
    }
    appareil.modifsEnAttente = 0;
    appareil.dernierExport = Date.now();
    sauverAppareil();
    rendreRappel();
    return resultat;
  }

  // Tableau lisible dans Excel (séparateur « ; » et accents corrects).
  function contenuCsv() {
    const fams = index.fams;
    const cellule = (v) => {
      let s = String(v ?? '');
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // empêche Excel d'exécuter une formule
      return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const lignes = [['Référence', 'Désignation', 'Prix HT', 'Prix TTC', 'Surnoms', ...fams.map((f) => f.nom), 'Exemple', 'Modifié le']];
    for (const f of [...index.forfaits].sort((a, b) => tri.compare(a.ref, b.ref))) {
      const els = index.elementsForfait.get(f.id);
      lignes.push([
        f.ref, f.designation, prixSaisie(f.ht), prixSaisie(f.ttc), (f.surnoms || []).join(', '),
        ...fams.map((fam) => els.find((e) => e.familleId === fam.id)?.nom ?? ''),
        f.exemple ? 'oui' : '', f.maj ? dateCourte(f.maj) : '',
      ]);
    }
    return '﻿' + lignes.map((l) => l.map(cellule).join(';')).join('\r\n');
  }

  function ouvrirExport() {
    if (lectureSeule()) return;  // le fichier serait vide : importé ailleurs en « Remplacer », il effacerait tout
    const dlg = ouvrirDialogue({

  function lancerImport() {
    if (lectureSeule()) return;
    const champ = $('fichier-import');
    champ.value = '';
    champ.click();
  }

  // Compte ce que la mise à jour va changer, pour l'annoncer avant de le faire,
  // et nomme les forfaits dont le prix change (le reste d'une modification compte moins au comptoir).
  // prixRemplacer : la même liste pour « Remplacer tout », qui prend aussi les versions plus anciennes du fichier.
  function bilanFusion(entrant) {
    const locaux = new Map(donnees.forfaits.map((f) => [f.id, f]));
    const bilan = { nouveaux: 0, modifies: 0, supprimes: 0, prix: [], prixRemplacer: [] };
    const ligne = (l, f) => `${f.ref} : ${formatPrix(l.ht)} → ${formatPrix(f.ht)} HT, ${formatPrix(l.ttc)} → ${formatPrix(f.ttc)} TTC`;
    for (const f of entrant.forfaits) {
      const l = locaux.get(f.id);
      if (!l) { if (!f.supprime) bilan.nouveaux++; continue; }
      const prixChange = !f.supprime && !l.supprime && (f.ht !== l.ht || f.ttc !== l.ttc);
      if (prixChange) bilan.prixRemplacer.push(ligne(l, f));
      if (!gagne(f, l)) continue;
      if (f.supprime && !l.supprime) bilan.supprimes++;
      else if (!f.supprime && l.supprime) bilan.nouveaux++;
      else if (!f.supprime) {
        bilan.modifies++;
        if (prixChange) bilan.prix.push(ligne(l, f));
      }
    }
    bilan.prix.sort(tri.compare);
    bilan.prixRemplacer.sort(tri.compare);
    // Éléments et familles : un renommage ou une suppression change toutes les cartes qui les montrent, à dire avant.
    bilan.renommes = [];
    bilan.retires = [];
    const famillesLocales = new Map(donnees.familles.map((x) => [x.id, x]));
    const nomFamille = (id) => famillesLocales.get(id)?.nom ?? '?';
    for (const cle of ['familles', 'elements']) {
      const locauxCle = new Map(donnees[cle].map((x) => [x.id, x]));
      for (const x of entrant[cle]) {
        const l = locauxCle.get(x.id);
        if (!l || l.supprime || !gagne(x, l)) continue;
        const avant = cle === 'familles' ? `Famille ${l.nom}` : `${nomFamille(l.familleId)} : ${l.nom}`;
        if (x.supprime) bilan.retires.push(avant);
        else if (x.nom !== l.nom) bilan.renommes.push(`${avant} → ${x.nom}`);
      }
    }
    return bilan;
  }

  // « Titre : a ; b ; c … (+5) » : une liste longue reste lisible dans une fenêtre de confirmation.
  const resume = (titre, liste) => (liste.length ? `${titre} : ${liste.slice(0, 10).join(' ; ')}${liste.length > 10 ? ` … (+${liste.length - 10})` : ''}` : null);

  /* ---------- Tableau Excel (.csv) : remplir ou mettre à jour les forfaits depuis Excel ---------- */

  // Titres de colonnes reconnus (comparés « à plat », voir norm) ; null = colonne ignorée.
  // Tout autre titre est une famille (Taximètre, Boîtier…) : celles qui existent sont reconnues,
  // les autres sont créées à l'import (et annoncées avant, pour repérer une faute de frappe).
  const COLONNES_TABLEAU = new Map([
    ['reference', 'ref'], ['designation', 'designation'], ['prixht', 'ht'], ['ht', 'ht'], ['prixttc', 'ttc'], ['ttc', 'ttc'],
    ['surnoms', 'surnoms'], ['exemple', 'exemple'], ['modifiele', null],
  ]);
  const LIGNES_TABLEAU_MAX = 5000;
  const FAMILLES_TABLEAU_MAX = 10; // nouvelles familles par import : au-delà, c'est sans doute un mauvais fichier

  // Texte d'un fichier : UTF-8 (« CSV UTF-8 » d'Excel), sinon Windows-1252 (ancien « CSV » d'Excel).
  async function lireTexte(fichier) {
    const octets = await fichier.arrayBuffer();
    try {
      return new TextDecoder('utf-8', { fatal: true }).decode(octets);
    } catch {
      return new TextDecoder('windows-1252').decode(octets);
    }
  }

  // Découpe un CSV en lignes de cellules : séparateur « ; », virgule ou tabulation, guillemets,
  // retours à la ligne dans une cellule. Le numéro de ligne dans Excel = position + 1.
  function decouperCsv(texte) {
    const t = texte.replace(/^﻿/, '');
    const premiere = t.split(/\r?\n/, 1)[0];
    const sep = [';', '\t', ','].map((s) => [s, premiere.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
    const lignes = [];
    let ligne = [];
    let cellule = '';
    let entreGuillemets = false;
    let ligneGuillemet = 0; // ligne Excel du guillemet ouvrant
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (entreGuillemets) {
        if (c !== '"') cellule += c;
        else if (t[i + 1] === '"') { cellule += '"'; i++; }
        else entreGuillemets = false;
      } else if (c === '"' && cellule === '') {
        entreGuillemets = true;
        ligneGuillemet = lignes.length + 1;
      } else if (c === sep) {
        ligne.push(cellule);
        cellule = '';
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && t[i + 1] === '\n') i++;
        ligne.push(cellule);
        lignes.push(ligne);
        ligne = [];
        cellule = '';
      } else {
        cellule += c;
      }
    }
    // Sans ce contrôle, toutes les lignes suivantes finissaient dans une seule cellule, sans erreur.
    if (entreGuillemets) throw new Error(`Ligne ${ligneGuillemet} : une cellule commence par un guillemet (") qui n'est jamais refermé.`);
    if (cellule !== '' || ligne.length) { ligne.push(cellule); lignes.push(ligne); }
    return lignes;
  }

  // Transforme le tableau en données prêtes à fusionner, ou renvoie la liste des problèmes (rien n'est modifié).
  // Un forfait garde son identifiant si sa référence existe déjà : on le met à jour au lieu de le dupliquer.
  function analyserTableau(texte) {
    let lignes;
    try {
      lignes = decouperCsv(texte);
    } catch (err) {
      return { erreurs: [err.message] };
    }
    // Excel ajoute des lignes vides à la fin de chaque colonne mise en forme : on les écarte avant de compter.
    while (lignes.length && lignes[lignes.length - 1].every((c) => !String(c).trim())) lignes.pop();
    if (lignes.length > LIGNES_TABLEAU_MAX + 1) return { erreurs: [`Trop de lignes : ${LIGNES_TABLEAU_MAX} forfaits au maximum.`] };
    const colonnes = new Map(); // 'ref', 'ht'… ou 'fam:<id>' → numéro de colonne
    const famParNom = new Map(index.fams.map((f) => [norm(f.nom), f]));
    const nouvelles = new Map(); // titres inconnus : clé « à plat » → [titre, numéro de colonne]
    (lignes[0] || []).forEach((titre, i) => {
      const cle = norm(titre);
      if (!cle) return;
      const champ = COLONNES_TABLEAU.has(cle) ? COLONNES_TABLEAU.get(cle) : famParNom.has(cle) ? 'fam:' + famParNom.get(cle).id : undefined;
      if (champ === undefined) { if (!nouvelles.has(cle)) nouvelles.set(cle, [String(titre).trim(), i]); }
      else if (champ && !colonnes.has(champ)) colonnes.set(champ, i);
    });
    // Les titres obligatoires d'abord : s'il en manque un, les autres titres sont sans doute le même fichier mal lu, pas des familles.
    const manquantes = [['ref', 'Référence'], ['ht', 'Prix HT'], ['ttc', 'Prix TTC']].filter(([champ]) => !colonnes.has(champ)).map(([, nom]) => nom);
    if (manquantes.length) {
      return { erreurs: manquantes.map((nom) => `Colonne « ${nom} » introuvable : la première ligne doit contenir les titres du modèle.`) };
    }
    const problemesFamilles = [
      ...(nouvelles.size > FAMILLES_TABLEAU_MAX ? [`${nouvelles.size} colonnes inconnues : ${FAMILLES_TABLEAU_MAX} nouvelles familles au maximum par tableau. Vérifie les titres de la première ligne.`] : []),
      ...[...nouvelles.values()].filter(([titre]) => titre.length > 60).map(([titre]) => `Colonne « ${titre.slice(0, 30)}… » : nom de famille trop long (60 caractères au maximum).`),
    ];
    if (problemesFamilles.length) return { erreurs: problemesFamilles };

    // Une colonne inconnue est une nouvelle famille : créée à l'import, après confirmation.
    const maintenant = Date.now();
    let ordre = Math.max(0, ...donnees.familles.map((f) => f.ordre));
    const famillesCreees = [...nouvelles.values()].map(([titre, i]) => {
      const fam = { id: nouvelId('fam'), nom: titre, ordre: ++ordre, maj: maintenant };
      colonnes.set('fam:' + fam.id, i);
      return fam;
    });
    const toutesFamilles = [...index.fams, ...famillesCreees];
    const erreurs = [];
    const avertissements = [];
    const nouveauxElements = [];
    const elementsCrees = [];
    const elementsConnus = new Map(index.elsActifs.map((e) => [`${e.familleId}|${norm(e.nom)}`, e]));
    // Nom comparé sans majuscules, accents ni espaces doublés, mais avec ses signes et ses espaces (norm les retire).
    const ecrit = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
    const rattaches = new Set();
    const refsEnDouble = new Set();
    const nbParRef = new Map(); // même clé que memeRef
    for (const f of index.forfaits) { const cle = f.ref.trim().toLocaleUpperCase('fr'); nbParRef.set(cle, (nbParRef.get(cle) || 0) + 1); }
    const lignesParRef = new Map();
    const forfaits = [];
    const brouillons = []; // lignes lues, avant le contrôle des surnoms
    let avecExemples = false;
    for (let n = 1; n < lignes.length; n++) {
      const ligne = lignes[n];
      if (ligne.every((c) => !String(c).trim())) continue;
      // L'export de l'outil protège avec une apostrophe les cellules qui commencent par = + - @.
      // Dans les tableaux remplis à la main, « / » veut dire « pas de données » : même chose qu'une case vide.
      const lire = (cle) => {
        const texte = colonnes.has(cle) ? String(ligne[colonnes.get(cle)] ?? '').trim().replace(/^'(?=[=+\-@])/, '') : '';
        return texte === '/' ? '' : texte;
      };
      const ref = lire('ref');
      if (!ref) { erreurs.push(`Ligne ${n + 1} : la référence est vide.`); continue; }
      const lieu = `Ligne ${n + 1} (${ref.slice(0, 40)})`;
      if (ref.length > 80) { erreurs.push(`${lieu} : référence trop longue (80 caractères au maximum).`); continue; }
      const cleRef = ref.toLocaleUpperCase('fr');
      if (lignesParRef.has(cleRef)) { erreurs.push(`${lieu} : cette référence est déjà à la ligne ${lignesParRef.get(cleRef)}.`); continue; }
      lignesParRef.set(cleRef, n + 1);
      const ht = lirePrix(lire('ht'));
      const ttc = lirePrix(lire('ttc'));
      if (ht === null) erreurs.push(`${lieu} : prix HT ${lire('ht') ? `illisible « ${lire('ht').slice(0, 30)} »` : 'manquant'}.`);
      if (ttc === null) erreurs.push(`${lieu} : prix TTC ${lire('ttc') ? `illisible « ${lire('ttc').slice(0, 30)} »` : 'manquant'}.`);
      if (ht === null || ttc === null) continue;
      if (Math.abs(ttc - ttcDepuisHt(ht)) > TOLERANCE_TVA) avertissements.push(`${ref} : ${formatPrix(ttc)} au lieu de ${formatPrix(ttcDepuisHt(ht))}`);

      const existant = donnees.forfaits.find((f) => !f.supprime && memeRef(f.ref, ref)) || donnees.forfaits.find((f) => memeRef(f.ref, ref));
      // Référence en double dans l'outil (née d'une fusion) : un seul des forfaits est mis à jour, l'autre garde son prix.
      const memeReference = nbParRef.get(ref.trim().toLocaleUpperCase('fr')) || 0;
      if (memeReference > 1) refsEnDouble.add(`${ref} (${memeReference} forfaits)`);
      // Une famille absente du tableau n'est pas touchée ; une cellule vide retire l'élément.
      const elements = { ...(existant?.elements ?? {}) };
      for (const fam of toutesFamilles) {
        const cle = 'fam:' + fam.id;
        if (!colonnes.has(cle)) continue;
        const nom = lire(cle);
        if (!nom) { delete elements[fam.id]; continue; }
        if (!norm(nom)) { erreurs.push(`${lieu} : ${fam.nom} « ${nom.slice(0, 30)} » illisible.`); continue; }
        // Coupé à 60 caractères, le nom créé ne ressemblait plus à la cellule : un élément de plus à chaque import.
        if (nom.length > 60) { erreurs.push(`${lieu} : ${fam.nom} « ${nom.slice(0, 30)}… » : nom trop long (60 caractères au maximum).`); continue; }
        const cleElement = `${fam.id}|${norm(nom)}`;
        // Le surnom d'équipe d'un élément vaut son nom (« la petite » → 3Q) ; pris dans une autre famille, c'est une erreur.
        const parSonNom = elementsConnus.get(cleElement);
        // « Zorba 5+ » ou « Zorba-5 » sont rangés sous « Zorba 5 » (même nom à plat) : à annoncer, ce n'est peut-être pas lui.
        if (parSonNom && ecrit(parSonNom.nom) !== ecrit(nom)) rattaches.add(`${fam.nom} : « ${nom} » rangé avec « ${parSonNom.nom} »`);
        let element = parSonNom
          || index.elsActifs.find((e) => e.familleId === fam.id && (e.surnoms || []).some((s) => norm(s) === norm(nom)));
        const ailleurs = !element && index.surnomPris.get(norm(nom));
        if (ailleurs?.equipe) { erreurs.push(`${lieu} : ${fam.nom} « ${nom.slice(0, 30)} » est le surnom de ${nomDe(ailleurs.id)}.`); continue; }
        if (!element) {
          element = { id: nouvelId('elt'), familleId: fam.id, nom: nom.slice(0, 60), maj: maintenant };
          elementsConnus.set(cleElement, element);
          elementsCrees.push(element);
          nouveauxElements.push(`${fam.nom} : ${element.nom}`);
        }
        elements[fam.id] = element.id;
      }

      // Comme pour les familles : une colonne absente du tableau ne touche pas à ce que l'outil contient déjà.
      const designation = colonnes.has('designation') || !existant ? lire('designation') : existant.designation;
      const exemple = colonnes.has('exemple') || !existant ? norm(lire('exemple')) === 'oui' : !!existant.exemple;
      if (exemple) avecExemples = true;
      // Surnoms : la case remplace ceux de l'équipe (vide = aucun) ; sans la colonne, on garde. Contrôlés après la lecture de tout le tableau.
      const surnomsLus = colonnes.has('surnoms') || !existant ? lireSurnoms(lire('surnoms'), Infinity) : null;
      brouillons.push({ existant, ref, designation, ht, ttc, elements, exemple, surnomsLus });
    }

    // Un surnom désigne une seule chose : pas le nom ni le surnom d'un élément, ni le surnom d'un autre forfait
    // (celui d'un forfait du tableau compte selon sa nouvelle case : un surnom peut passer d'un forfait à l'autre).
    const pris = new Map();
    for (const f of index.fams) pris.set(norm(f.nom), `la famille ${f.nom}`);
    for (const e of [...index.elsActifs, ...elementsCrees]) for (const s of [e.nom, ...(e.surnoms || [])]) pris.set(norm(s), e.nom);
    const recases = new Set(brouillons.filter((b) => b.surnomsLus && b.existant).map((b) => b.existant.id));
    for (const f of index.forfaits) if (!recases.has(f.id)) for (const s of f.surnoms || []) pris.set(norm(s), `forfait ${f.ref}`);
    const surnomsRefuses = [];
    for (const b of brouillons) {
      // Sans la colonne, un forfait actif garde ses surnoms ; un forfait supprimé qui revient repasse le contrôle.
      // Au-delà de 3, les suivants sont annoncés et laissés de côté : le même tableau donne le même résultat sur tous
      // les appareils, quels que soient les surnoms qu'ils avaient déjà.
      let gardes = 0;
      const surnoms = !b.surnomsLus && !b.existant.supprime ? b.existant.surnoms || [] : (b.surnomsLus ?? b.existant.surnoms ?? []).filter((s) => {
        const deja = pris.get(norm(s));
        if (deja) { surnomsRefuses.push(`${b.ref} : « ${s} » (déjà pris par ${deja})`); return false; }
        if (gardes === SURNOMS_MAX) { surnomsRefuses.push(`${b.ref} : « ${s} » (${SURNOMS_MAX} surnoms au maximum)`); return false; }
        gardes += 1;
        pris.set(norm(s), `forfait ${b.ref}`);
        return true;
      });
      const { existant, ref, designation, ht, ttc, elements, exemple } = b;
      const inchange = existant && !existant.supprime && existant.ref === ref && existant.designation === designation
        && existant.ht === ht && existant.ttc === ttc && !existant.exemple === !exemple
        && (existant.surnoms || []).join('|') === surnoms.join('|')
        && JSON.stringify(Object.entries(existant.elements).sort()) === JSON.stringify(Object.entries(elements).sort());
      forfaits.push(inchange ? existant : {
        id: existant?.id ?? nouvelId('fft'), ref, designation, ...avecSurnoms(surnoms), ht, ttc, elements,
        maj: Math.max(maintenant, (existant?.maj ?? 0) + 1), ...(exemple ? { exemple: true } : {}),
      });
    }
    if (!erreurs.length && !forfaits.length) erreurs.push('Le tableau ne contient aucun forfait.');
    if (erreurs.length) return { erreurs };
    try {
      // Même contrôle que pour un fichier de sauvegarde : longueurs, identifiants, prix.
      const entrant = valider({ format: FORMAT, version: VERSION_FORMAT, familles: [...donnees.familles, ...famillesCreees], elements: [...donnees.elements, ...elementsCrees], forfaits });
      return {
        entrant, nbForfaits: forfaits.length, nouvellesFamilles: famillesCreees.map((f) => f.nom), nouveauxElements, avertissements, avecExemples, surnomsRefuses,
        rattaches: [...rattaches], refsEnDouble: [...refsEnDouble],
      };
    } catch (err) {
      return { erreurs: [err.message] };
    }
  }

  // Fichier OneDrive « en ligne seulement », retiré pendant le choix… : le navigateur ne peut pas le lire.
  const FICHIER_ILLISIBLE = "Le fichier n'a pas pu être lu. S'il est dans OneDrive, ouvre-le une fois dans OneDrive pour qu'il soit sur l'appareil, puis réessaie.";

  // L'union passe le même contrôle que le stockage relu au prochain chargement : un identifiant pris dans deux listes
  // (fichier retouché) ou trop d'enregistrements y seraient refusés, et toutes les données mises de côté.
  async function unionValable(union) {
    try {
      valider({ format: FORMAT, version: VERSION_FORMAT, ...union });
      return true;
    } catch (err) {
      await informer('Import impossible', `${err.message} Rien n'a changé sur cet appareil.`);
      return false;
    }
  }

  async function importerTableau(fichier) {
    let texte;
    try {
      texte = await lireTexte(fichier);
    } catch {
      await informer('Import impossible', FICHIER_ILLISIBLE);
      return;
    }
    const analyse = analyserTableau(texte);
    if (analyse.erreurs) {
      const max = 12;
      await informer('Import impossible', "Le tableau n'a pas été importé : rien n'a changé. Corrige-le, enregistre-le de nouveau, puis réessaie.",
        [...analyse.erreurs.slice(0, max), ...(analyse.erreurs.length > max ? [`… et ${analyse.erreurs.length - max} autre(s) problème(s).`] : [])]);
      return;
    }
    const { entrant, nbForfaits, nouvellesFamilles, nouveauxElements, avertissements, avecExemples, surnomsRefuses, rattaches, refsEnDouble } = analyse;
    const bilan = bilanFusion(entrant);
    const inchanges = nbForfaits - bilan.nouveaux - bilan.modifies;
    // Premier remplissage : le tableau ne contient pas d'exemples, et il en reste dans l'outil.
    const exemplesRestants = !avecExemples && donnees.forfaits.some((f) => f.exemple && !f.supprime);
    const choix = await demander({
      titre: 'Importer ce tableau ?',
      message: `${fichier.name} — ${pluriel(nbForfaits, 'forfait')}.`,
      liste: [
        `${bilan.nouveaux} nouveau${bilan.nouveaux > 1 ? 'x' : ''}, ${pluriel(bilan.modifies, 'modifié')}, ${inchanges} inchangé${inchanges > 1 ? 's' : ''}. Les autres forfaits de cet appareil ne bougent pas.`,
        resume('Prix qui changent', bilan.prix),
        resume("Familles (colonnes) qui n'existent pas encore et seront créées (vérifie l'orthographe)", nouvellesFamilles),
        resume("Éléments qui n'existent pas encore et seront créés (vérifie l'orthographe)", nouveauxElements),
        resume("Noms lus comme un élément qui existe déjà (ils ne diffèrent que par un signe ou un espace : vérifie)", rattaches),
        resume("Références présentes plusieurs fois dans l'outil : un seul de ces forfaits sera mis à jour, supprime l'autre", refsEnDouble),
        resume(`TTC à vérifier (différent de HT + ${TAUX_TVA})`, avertissements),
        resume("Surnoms ignorés (un surnom ne désigne qu'une seule chose, 3 au maximum)", surnomsRefuses),
      ].filter(Boolean),
      boutons: [
        { texte: 'Importer', valeur: 'fusion', classe: exemplesRestants ? 'btn-bord' : 'btn-rouge' },
        exemplesRestants ? { texte: 'Importer et supprimer les exemples', valeur: 'sans-exemples', classe: 'btn-rouge' } : null,
        { texte: 'Annuler', valeur: null },
      ].filter(Boolean),
    });
    if (!choix) return;
    const union = fusionner(donnees, entrant);
    if (!(await unionValable(union))) return;
    donnees = union;
    if (choix === 'sans-exemples') marquerExemplesSupprimes();
    if (!sauver()) return;
    if (bilan.nouveaux || bilan.modifies || nouvellesFamilles.length || nouveauxElements.length || choix === 'sans-exemples') noterModif();
    rafraichir();
    toast('Tableau importé');
  }

  async function importerFichier(fichier) {
    if (!fichier) return;
    if (lectureSeule()) return;  // le choix du fichier était déjà ouvert quand un autre onglet a annoncé la version plus récente
    if (fichier.size > 5 * 1024 * 1024) { await informer('Import impossible', 'Fichier trop gros pour être un fichier de forfaits.'); return; }
    if (/\.xlsx?$/i.test(fichier.name)) {
      await informer('Import impossible', "C'est le fichier Excel lui-même. Dans Excel : Fichier → Enregistrer sous → « CSV UTF-8 », puis importe ce fichier .csv.");
      return;
    }
    if (/\.csv$/i.test(fichier.name)) { await importerTableau(fichier); return; }
    let entrant, exporteLe, texte;
    try {
      texte = await fichier.text();
    } catch {
      await informer('Import impossible', FICHIER_ILLISIBLE);
      return;
    }
    try {
      const obj = JSON.parse(texte);
      entrant = valider(obj);
      exporteLe = Date.parse(obj.exporteLe);
    } catch (err) {
      await informer('Import impossible', err instanceof SyntaxError
        ? "Ce fichier n'est pas un fichier de forfaits. Choisis le fichier .json exporté par l'outil, ou le tableau .csv du modèle Excel."
        : err.message);
      return;
    }
    const bilan = bilanFusion(entrant);
    const nbEntrants = entrant.forfaits.filter((f) => !f.supprime).length;
    const plusAncien = derniereModif(entrant) < derniereModif(donnees);
    // Un fichier piégé ou abîmé peut effacer les vrais forfaits (les exemples partent normalement) : à dire en clair.
    const vrais = donnees.forfaits.filter((f) => !f.supprime && !f.exemple);
    const entrantParId = new Map(entrant.forfaits.map((f) => [f.id, f]));
    const effaces = vrais.filter((l) => entrantParId.get(l.id)?.supprime && gagne(entrantParId.get(l.id), l)).length;
    const absents = vrais.filter((l) => !entrantParId.has(l.id) || entrantParId.get(l.id).supprime).length;
    const choix = await demander({
      titre: 'Importer ce fichier ?',
      message: `${fichier.name} — ${Number.isFinite(exporteLe) ? 'exporté le ' + fmtDateHeure.format(new Date(exporteLe)) + ', ' : ''}${pluriel(nbEntrants, 'forfait')}.`,
      liste: [
        `Mettre à jour (conseillé) : ${bilan.nouveaux} nouveau${bilan.nouveaux > 1 ? 'x' : ''}, ${pluriel(bilan.modifies, 'modifié')}, ${pluriel(bilan.supprimes, 'supprimé')}. Garde la version la plus récente de chaque forfait.`,
        effaces >= 3 && effaces * 5 >= vrais.length
          ? `Attention : « Mettre à jour » supprimerait ${effaces} des ${vrais.length} forfaits de cet appareil. Si ce fichier ne vient pas d'un responsable, annule.` : null,
        resume('Prix qui changent', bilan.prix),
        resume('Éléments et familles renommés', bilan.renommes),
        resume('Éléments et familles supprimés', bilan.retires),
        'Remplacer tout : cet appareil devient une copie exacte du fichier.'
          + (absents ? ` ${pluriel(absents, 'forfait')} de cet appareil ${absents > 1 ? 'disparaîtraient' : 'disparaîtrait'} (absent${absents > 1 ? 's' : ''} du fichier).` : ''),
        // Fichier plus ancien : « Remplacer tout » remettrait d'anciens prix, à dire avant.
        bilan.prixRemplacer.join() === bilan.prix.join() ? null : resume('Prix qui changent avec « Remplacer tout »', bilan.prixRemplacer),
        plusAncien ? 'Attention : ce fichier est plus ancien que tes données. « Mettre à jour » gardera tes versions plus récentes.' : null,
      ].filter(Boolean),
      boutons: [
        { texte: 'Mettre à jour', valeur: 'fusion', classe: 'btn-rouge' },
        { texte: 'Remplacer tout', valeur: 'remplacer' },
        { texte: 'Annuler', valeur: null },
      ],
    });
    if (!choix) return;
    if (choix === 'remplacer' && appareil.modifsEnAttente > 0) {
      const ok = await demander({
        titre: 'Remplacer tout ?',
        message: `Tu as ${pluriel(appareil.modifsEnAttente, 'modification')} pas encore exportée(s) sur cet appareil : elles seront perdues.`,
        boutons: [{ texte: 'Remplacer quand même', valeur: true, classe: 'btn-rouge' }, { texte: 'Annuler', valeur: false }],
      });
      if (!ok) return;
    }
    if (choix === 'fusion') {
      const union = fusionner(donnees, entrant);
      if (!(await unionValable(union))) return;
      donnees = union;
      // Le fichier a retiré ses exemples : ceux de cet appareil partent aussi, même s'ils n'ont pas les mêmes identifiants
      // (exemples d'une autre version de l'outil).
      if (entrant.forfaits.some((f) => f.exemple && f.supprime) && !entrant.forfaits.some((f) => f.exemple && !f.supprime)) marquerExemplesSupprimes(true);
    } else {
      donnees = entrant;
      appareil.modifsEnAttente = 0;
    }
    if (!sauver()) return;
    donneesIllisibles = false;
    appareil.dernierImport = Date.now();
    demanderStockageDurable();
    sauverAppareil();
    rafraichir();
    toast(choix === 'fusion' ? 'Mise à jour terminée' : 'Données remplacées');
    // Deux responsables ont pu créer la même référence, ou le même élément, chacun de leur côté.
    const vues = new Map();
    const compter = (cle, libelle) => vues.set(cle, { libelle, n: (vues.get(cle)?.n || 0) + 1 });
    for (const f of index.forfaits) compter('ref|' + f.ref.trim().toLocaleUpperCase('fr'), `Référence ${f.ref}`);
    for (const e of index.elsActifs) compter(`elt|${e.familleId}|${norm(e.nom)}`, `${index.famParId.get(e.familleId).nom} : ${e.nom}`);
    const doublons = [...vues.values()].filter((v) => v.n > 1).map((v) => `${v.libelle} (${v.n} fois)`);
    // Même surnom donné à deux choses sur deux appareils : la recherche n'en garde qu'une.
    for (const x of [...index.elsActifs, ...index.forfaits]) {
      for (const s of x.surnoms || []) {
        const pris = index.surnomPris.get(norm(s));
        if (pris?.id !== x.id) doublons.push(`Surnom « ${s} » de ${nomDe(x.id)} : déjà ${pris ? 'pris par ' + nomDe(pris.id) : "le nom d'un élément ou d'une famille"}`);
      }
    }
    // Élément (ou famille) supprimé sur un appareil, encore utilisé sur l'autre : le forfait l'avait perdu sans rien dire.
    const elementsTous = new Map(donnees.elements.map((e) => [e.id, e]));
    const famillesToutes = new Map(donnees.familles.map((x) => [x.id, x]));
    const orphelins = [];
    for (const f of index.forfaits) {
      for (const [famId, eltId] of Object.entries(f.elements)) {
        if (index.famParId.has(famId) && index.elParId.get(eltId)?.familleId === famId) continue;
        orphelins.push(`Forfait ${f.ref} : ${famillesToutes.get(famId)?.nom ?? 'famille inconnue'} « ${elementsTous.get(eltId)?.nom ?? 'élément inconnu'} » supprimé`);
      }
    }
    const aCorriger = [...doublons, ...orphelins];
    // 50 lignes au plus : un fichier piégé ne doit pas figer la page avec des milliers de lignes.
    const affiches = aCorriger.length > 50 ? [...aCorriger.slice(0, 50), `… et ${aCorriger.length - 50} autres`] : aCorriger;
    const message = [
      doublons.length ? 'Après la mise à jour, ces références ou éléments existent plusieurs fois.' : null,
      orphelins.length ? "Ces forfaits utilisent un élément supprimé sur un autre appareil : il n'apparaît plus sur leur fiche. Choisis-en un autre, ou recrée-le." : null,
    ].filter(Boolean).join(' ');
    if (aCorriger.length) await informer(doublons.length ? 'Doublons à corriger' : 'Forfaits à corriger', `${message} Un responsable doit corriger :`, affiches);
  }

  /* =====================================================================
     MENU, MODE MODIFICATION, AIDE
     ===================================================================== */
  function ouvrirMenu() {
    const fermerPuis = (action) => () => { dlg.close(); action(); };
    const exemples = index.forfaits.some((f) => f.exemple);
    const dlg = ouvrirDialogue({
      titre: 'Menu',
      corps: h('div', { class: 'menu-liste' },
        // Ce qu'on utilise tous les jours d'abord ; ce qui sert aux responsables ensuite.
        h('button', { type: 'button', class: 'btn btn-bord', onclick: fermerPuis(lancerImport) }, 'Importer (sauvegarde ou tableau Excel)'),
        h('button', { type: 'button', class: 'btn btn-bord', id: 'btn-mes-surnoms', onclick: fermerPuis(ouvrirMesSurnoms) }, 'Mes surnoms (perso, sur cet appareil)'),
        h('div', { class: 'menu-mode' },
          h('div', {}, h('strong', {}, 'Apparence'), h('p', {}, "« Auto » suit le réglage de l'appareil.")),
          choixReglage('theme', THEMES, 'Apparence')),
        h('div', { class: 'menu-mode' },
          h('div', {}, h('strong', {}, 'Taille du texte'), h('p', {}, 'Tout grossit, sur cet appareil seulement.')),
          choixReglage('texte', TAILLES, 'Taille du texte')),
        index.fams.length > 1 ? h('button', { type: 'button', class: 'btn btn-bord', id: 'btn-ordre-filtres', onclick: fermerPuis(ouvrirOrdreFiltres) }, 'Ordre des filtres (sur cet appareil)') : null,
        h('button', { type: 'button', class: 'btn btn-bord', onclick: fermerPuis(ouvrirAide) }, "Mode d'emploi"),
        h('p', { class: 'menu-info' }, h('strong', {}, 'Responsables')),
        h('div', { class: 'menu-mode' },
          h('div', {}, h('strong', {}, 'Mode modification'), h('p', {}, appareil.modeModif ? 'Activé sur cet appareil.' : 'Pour ajouter, modifier, supprimer.')),
          h('button', {
            type: 'button', id: 'btn-mode-modif', class: 'btn ' + (appareil.modeModif ? 'btn-bord' : 'btn-rouge'),
            title: appareil.modeModif ? 'Mode modification : activé' : 'Mode modification : désactivé', onclick: fermerPuis(basculerModeModif),
          }, appareil.modeModif ? 'Désactiver' : 'Activer')),
        appareil.modeModif ? h('button', { type: 'button', class: 'btn btn-bord', onclick: fermerPuis(() => ouvrirFormulaire(null)) }, '+ Ajouter un forfait') : null,
        appareil.modeModif ? h('button', { type: 'button', class: 'btn btn-bord', id: 'btn-listes', onclick: fermerPuis(ouvrirListes) }, 'Listes des éléments (taximètres, boîtiers…)') : null,
        h('button', { type: 'button', class: 'btn btn-bord', id: 'btn-menu-exporter', onclick: fermerPuis(ouvrirExport) }, 'Exporter (sauvegarde ou Excel)'),
        appareil.modeModif && exemples ? h('button', { type: 'button', class: 'btn btn-danger', onclick: fermerPuis(supprimerExemples) }, 'Supprimer les exemples') : null,
        h('p', { class: 'menu-info' },
          `${$('etat-donnees').textContent} · ${pluriel(index.forfaits.length, 'forfait')} · dernier export : ${appareil.dernierExport ? dateCourte(appareil.dernierExport) : 'jamais'}`
          + ` · dernier import : ${appareil.dernierImport ? dateCourte(appareil.dernierImport) : 'jamais'} · version ${VERSION_OUTIL}`)),
    });
  }

  // Deux ou trois boutons (thème, taille du texte) ; le choix s'applique tout de suite et la fenêtre
  // reste ouverte pour voir le résultat (l'événement « close » d'un dialogue part en différé).
  // Réglages de l'appareil : jamais exportés.
  function choixReglage(cle, choix, libelleGroupe) {
    const boutons = choix.map(({ valeur, libelle }) => h('button', {
      type: 'button', 'data-choix': valeur,
      onclick: () => { appareil[cle] = valeur; sauverAppareil(); appliquerApparence(); marquer(); },
    }, libelle));
    const marquer = () => boutons.forEach((b) => {
      const actif = b.dataset.choix === appareil[cle];
      b.className = 'btn ' + (actif ? 'btn-blanc' : 'btn-bord'); // plein = choisi, comme les filtres
      b.setAttribute('aria-pressed', String(actif));
    });
    marquer();
    return h('div', { class: 'groupe-theme', role: 'group', 'aria-label': libelleGroupe }, ...boutons);
  }

  async function basculerModeModif() {
    if (!appareil.modeModif) {
      const ok = await demander({
        titre: 'Activer le mode modification ?',
        message: 'Réservé aux 1 ou 2 responsables des forfaits.',
        liste: [
          'Avant de modifier : importe le dernier fichier du dossier OneDrive.',
          'Après avoir modifié : Exporter, puis range le fichier dans OneDrive.',
        ],
        boutons: [{ texte: 'Activer', valeur: true, classe: 'btn-rouge' }, { texte: 'Annuler', valeur: false }],
      });
      if (!ok) return;
    }
    appareil.modeModif = !appareil.modeModif;
    sauverAppareil();
    rafraichir();
    toast(appareil.modeModif ? 'Mode modification activé' : 'Mode modification désactivé');
  }

  function ouvrirAide() {
    ouvrirDialogue({
      titre: "Mode d'emploi",
      corps: h('ol', { class: 'etapes' },
        h('li', {}, h('strong', {}, 'Ouvrir : '), "sur PC, mets cette page en favori. Sur Android, ouvre-la dans Chrome, puis menu ⋮ → « Ajouter à l'écran d'accueil ». Sur iPhone, ouvre-la dans Safari, puis Partager → « Sur l'écran d'accueil » ; importe le fichier depuis l'icône ainsi créée (elle garde ses propres données, à part de Safari). Elle marche ensuite sans internet."),
        h('li', {}, h('strong', {}, 'Chercher : '), 'tape une référence, « 3Q », « T1 DEMO »… Chaque mot réduit la liste. Touche une suggestion pour en faire un filtre, ou utilise les filtres sous la recherche. Touche un forfait pour ouvrir sa fiche.'),
        h('li', {}, h('strong', {}, 'Surnoms : '), "tape le nom que les techniciens donnent à un appareil ou à un forfait. Les tiens : Menu → Mes surnoms, ou l'étiquette en haut de la fiche d'un forfait (ils restent sur ce poste). Ceux de toute l'équipe : colonne Surnoms du tableau Excel, ou en mode modification."),
        h('li', {}, h('strong', {}, 'Filtres : '), `les ${filtresVisibles()} premières familles sont des boutons sur cet écran, les autres sont dans « Autres ». Pour les ranger dans ton ordre : Menu → Ordre des filtres. C'est propre à cet appareil, personne d'autre n'est touché.`),
        h('li', {}, h('strong', {}, 'Favoris : '), "touche l'étoile en haut de la fiche d'un forfait pour le garder en tête de liste. Les éléments choisis et les références copiées souvent remontent aussi. C'est propre à cet appareil."),
        h('li', {}, h('strong', {}, 'Être à jour : '), 'bouton Importer → choisis le fichier le plus récent du dossier OneDrive des forfaits → Mettre à jour.'),
        h('li', {}, h('strong', {}, 'Remplir avec Excel : '), 'remplis le modèle de tableau, enregistre-le en « CSV UTF-8 », puis Importer → choisis ce fichier .csv. Une colonne ou un élément nouveau est créé tout seul (annoncé avant de valider) ; un forfait dont la référence existe déjà est mis à jour.'),
        h('li', {}, h('strong', {}, 'Responsables : '), 'Menu → Mode modification. Importe avant de modifier ; après, Menu → Exporter → range le fichier dans OneDrive.'),
        h('li', {}, h('strong', {}, 'Sauvegarde : '), "le fichier dans OneDrive est la vraie sauvegarde. Le navigateur peut être vidé : ne compte pas sur lui.")),
    });
  }

  /* =====================================================================
     DÉMARRAGE
     ===================================================================== */
  const champ = $('recherche');
  champ.addEventListener('input', () => { rendreResultats(); majSuggestions(); });
  champ.addEventListener('focus', majSuggestions);
  // Petit délai : au doigt, le champ perd le focus juste avant le clic sur une suggestion.
  champ.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== champ) majSuggestions(); }, 250));
  champ.addEventListener('keydown', (ev) => {
    const n = etatUi.suggestions.length;
    if (ev.key === 'ArrowDown' && n) { ev.preventDefault(); activerSuggestion((etatUi.suggestionActive + 1) % n); }
    else if (ev.key === 'ArrowUp' && n) { ev.preventDefault(); activerSuggestion((etatUi.suggestionActive - 1 + n) % n); }
    else if (ev.key === 'Enter') {
      ev.preventDefault();
      if (etatUi.suggestionActive >= 0) choisirSuggestion(etatUi.suggestionActive, true);
      else champ.blur(); // les résultats sont déjà là : on range le clavier
    } else if (ev.key === 'Escape' && n) {
      ev.preventDefault();
      etatUi.suggestions = [];
      $('suggestions').hidden = true;
      champ.setAttribute('aria-expanded', 'false');
      champ.removeAttribute('aria-activedescendant');
    }
  });
  $('btn-vider').addEventListener('click', () => {
    champ.value = '';
    // À la souris on reste dans le champ pour retaper ; au doigt, redonner le focus ferait
    // remonter le clavier sur les forfaits qu'on vient de rendre visibles.
    if (!auDoigt()) champ.focus();
    rendreResultats();
    majSuggestions();
  });
  $('btn-tout-effacer').addEventListener('click', toutEffacer);
  $('tri').addEventListener('change', () => {
    appareil.tri = $('tri').value;
    sauverAppareil();
    rendreResultats();
  });
  $('btn-ajouter').addEventListener('click', () => ouvrirFormulaire(null));
  $('btn-importer').addEventListener('click', lancerImport);
  $('btn-menu').addEventListener('click', ouvrirMenu);
  $('btn-rappel-exporter').addEventListener('click', ouvrirExport);
  $('barre-total').addEventListener('click', ouvrirTotal);
  $('btn-recents').addEventListener('click', (ev) => ouvrirRecents(ev.currentTarget));

  // Menus de la barre (filtres, récents) : un appui ailleurs ou Échap les referme.
  addEventListener('pointerdown', (ev) => {
    if (menuOuvert && !menuOuvert.el.contains(ev.target) && !menuOuvert.ancre.contains(ev.target)) fermerMenu();
  });
  addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && menuOuvert) { ev.preventDefault(); fermerMenu(true); }
  });

  // Feuilles du bas (fiche et total, hors grand écran) : un appui à côté les referme.
  for (const feuille of [$('dlg-fiche'), $('dlg-total')]) {
    feuille.addEventListener('click', (ev) => {
      const r = feuille.getBoundingClientRect();
      if (ev.target === feuille && (ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom)) feuille.close();
    });
  }
  // La liste a pu être redessinée sous la fiche (favori) : le clavier revient au forfait qu'on regardait.
  // À cet instant le focus est encore sur un bouton de la fiche fermée (il ne retombe sur la page qu'au rendu suivant).
  $('dlg-fiche').addEventListener('close', () => {
    const actif = document.activeElement;
    if ((actif === document.body || $('dlg-fiche').contains(actif)) && etatUi.choisi) {
      $('resultats').querySelector(`.carte[data-id="${CSS.escape(etatUi.choisi)}"] .carte-ouvrir`)?.focus({ preventScroll: true });
    }
  });

  // La mise en page change (fenêtre élargie, téléphone tourné, taille du texte) : la fiche et le
  // total changent de place, et le nombre de filtres en boutons aussi.
  const miseEnPage = () => `${large()}|${filtresVisibles()}|${totalSousFiche()}`;
  let miseEnPageVue = miseEnPage();
  const suivreMiseEnPage = () => {
    if (miseEnPage() === miseEnPageVue) return;
    miseEnPageVue = miseEnPage();
    rendreFiltres();
    rendreResultats();
    rendreTotal();
  };
  new ResizeObserver(suivreMiseEnPage).observe(document.querySelector('.page'));
  // La hauteur de la fenêtre seule ne change pas la taille de .page quand la liste est longue.
  window.addEventListener('resize', suivreMiseEnPage);
  new ResizeObserver(calerBas).observe($('barre-total'));
  $('fichier-import').addEventListener('change', (ev) => importerFichier(ev.target.files[0]));

  // Si la page est ouverte dans deux onglets, ils restent d'accord.
  window.addEventListener('storage', (ev) => {
    if (ev.key === CLE_DONNEES) { donnees = charger(); if (donneesFutures) fermerFenetres(); }
    else if (ev.key === CLE_APPAREIL) { appareil = chargerAppareil(); appliquerApparence(); }
    else return;
    rafraichir();
  });

  // Appli reprise depuis l'arrière-plan, ou onglet laissé ouvert des jours : le rappel d'import se recalcule.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) rendreBandeaux(); });
  setInterval(rendreBandeaux, 3600000); // toutes les heures

  rafraichir();
  if (!auDoigt()) champ.focus(); // PC : on peut taper tout de suite (un PC à dalle tactile dit « coarse » : il en était privé)

  // Mode hors ligne (seulement quand la page vient d'une adresse web). Le service worker prévient
  // quand il a téléchargé une page plus récente : on propose « Recharger » au lieu d'attendre
  // la deuxième ouverture.
  function signalerNouvelleVersion() {
    if (nouvelleVersion) return;
    nouvelleVersion = true;
    rendreBandeaux();
  }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('message', (ev) => {
      if (ev.data?.type === 'nouvelle-version') signalerNouvelleVersion();
    });
  }

  // Fonctions exposées pour les tests automatiques.
  window.Forfaits = Object.freeze({ lirePrix, signalerNouvelleVersion });
})();
</script>
</body>
</html>
