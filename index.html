  // On refuse de supprimer un élément encore utilisé : on ne perd jamais une info sans le voir.
  async function supprimerElement(e, fam, changer) {
    const utilisateurs = index.forfaits.filter((f) => f.elements[fam.id] === e.id);
    if (utilisateurs.length) {
      await informer('Suppression impossible', `« ${e.nom} » est utilisé par ${pluriel(utilisateurs.length, 'forfait')}. Renomme-le, ou modifie d'abord ces forfaits :`, refsAbregees(utilisateurs));
      return;
    }
    const ok = await demander({
      titre: 'Supprimer cet élément ?', message: `« ${e.nom} » sera retiré de la liste ${fam.nom}.`,
      boutons: [{ texte: 'Supprimer', valeur: true, classe: 'btn-rouge' }, { texte: 'Annuler', valeur: false }],
    });
    if (!ok) return;
    remplacer(donnees.elements, { ...e, supprime: true, maj: Date.now() });
    changer();
  }

  async function supprimerFamille(fam, changer) {
    const ids = new Set(elementsDe(fam.id).map((e) => e.id));
    const utilisateurs = index.forfaits.filter((f) => ids.has(f.elements[fam.id]));
    if (utilisateurs.length) {
      await informer('Suppression impossible', `La famille ${fam.nom} est utilisée par ${pluriel(utilisateurs.length, 'forfait')} :`, refsAbregees(utilisateurs));
      return;
    }
    const ok = await demander({
      titre: 'Supprimer cette famille ?', message: `La famille ${fam.nom} et sa liste (${pluriel(ids.size, 'élément')}) seront supprimées.`,
      boutons: [{ texte: 'Supprimer', valeur: true, classe: 'btn-rouge' }, { texte: 'Annuler', valeur: false }],
    });
    if (!ok) return;
    const maintenant = Date.now();
    remplacer(donnees.familles, { ...fam, supprime: true, maj: maintenant });
    for (const e of donnees.elements) if (ids.has(e.id)) remplacer(donnees.elements, { ...e, supprime: true, maj: maintenant });
    changer();
  }

  const refsAbregees = (forfaits) => [...forfaits.slice(0, 10).map((f) => f.ref), forfaits.length > 10 ? `… et ${forfaits.length - 10} autres` : null].filter(Boolean);

  /* =====================================================================
     EXPORTER / IMPORTER
     ===================================================================== */
  function telecharger(nom, contenu, type) {
    const url = URL.createObjectURL(new Blob([contenu], { type }));
    const lien = h('a', { href: url, download: nom, hidden: true });
    document.body.append(lien);
    lien.click();
    lien.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  // Edge et Chrome sur PC proposent de choisir le dossier, et rouvrent ensuite le même (celui de OneDrive) :
  // plus besoin de déplacer le fichier depuis Téléchargements. Ailleurs (Firefox, Android), téléchargement classique.
  // iPhone et iPad : un téléchargement peut ne rien enregistrer (appli d'écran d'accueil), donc menu Partager,
  // qui propose « Enregistrer dans Fichiers » et OneDrive.
  // Renvoie 'choisi', 'partage', 'telecharge', ou null si la personne a annulé.
  async function exporterJson() {
    const nom = `forfaits-${horodatage()}.json`;
    const contenu = JSON.stringify({ format: FORMAT, version: VERSION_FORMAT, exporteLe: new Date().toISOString(), ...donnees }, null, 1);
    let resultat = 'telecharge';
    const apple = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const fichierPartage = apple && navigator.canShare ? new File([contenu], nom, { type: 'application/json' }) : null;
    if (fichierPartage && navigator.canShare({ files: [fichierPartage] })) {
      try {
        await navigator.share({ files: [fichierPartage] });
        resultat = 'partage';
      } catch (err) {
        if (err.name === 'AbortError') return null;
        // Partage refusé : téléchargement sans preuve qu'il enregistre quelque chose, le rappel reste.
        telecharger(nom, contenu, 'application/json');
        return 'telecharge';
      }
    } else try {
      if (!window.showSaveFilePicker) throw new Error('indisponible');
      const fichier = await window.showSaveFilePicker({
        id: 'forfaits', suggestedName: nom,
        types: [{ description: 'Fichier de forfaits', accept: { 'application/json': ['.json'] } }],
      });
      const flux = await fichier.createWritable();
      await flux.write(contenu);
      await flux.close();
      resultat = 'choisi';
    } catch (err) {
      if (err.name === 'AbortError') return null;
      telecharger(nom, contenu, 'application/json'); // refusé (page ouverte en fichier, règle de l'entreprise…)
    }
    appareil.modifsEnAttente = 0;
    appareil.dernierExport = Date.now();
    sauverAppareil();
    rendreRappel();
    return resultat;
  }

  // Tableau lisible dans Excel (séparateur « ; » et accents corrects).
  function contenuCsv() {
    const fams = index.fams;
    const cellule = (v) => {
      let s = String(v ?? '');
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // empêche Excel d'exécuter une formule
      return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const lignes = [['Référence', 'Désignation', 'Prix HT', 'Prix TTC', 'Surnoms', ...fams.map((f) => f.nom), 'Exemple', 'Modifié le']];
    for (const f of [...index.forfaits].sort((a, b) => tri.compare(a.ref, b.ref))) {
      const els = index.elementsForfait.get(f.id);
      lignes.push([
        f.ref, f.designation, prixSaisie(f.ht), prixSaisie(f.ttc), (f.surnoms || []).join(', '),
        ...fams.map((fam) => els.find((e) => e.familleId === fam.id)?.nom ?? ''),
        f.exemple ? 'oui' : '', f.maj ? dateCourte(f.maj) : '',
      ]);
    }
    return '﻿' + lignes.map((l) => l.map(cellule).join(';')).join('\r\n');
  }

  function ouvrirExport() {
    if (lectureSeule()) return;  // le fichier serait vide : importé ailleurs en « Remplacer », il effacerait tout
    const dlg = ouvrirDialogue({
      titre: 'Exporter',
      corps: [
        h('p', { class: 'dlg-message' }, 'Le fichier de sauvegarde sert à partager les forfaits : range-le dans le dossier OneDrive des forfaits. Les autres font ensuite « Importer ».'),
        h('div', { class: 'menu-liste' },
          h('button', {
            type: 'button', class: 'btn btn-rouge', id: 'btn-export-json',
            onclick: async () => {
              const enCours = exporterJson(); // d'abord : le choix du dossier doit suivre le clic
              dlg.close();
              const resultat = await enCours;
              if (resultat === 'telecharge') {
                await informer('Fichier dans Téléchargements', 'Déplace-le maintenant dans le dossier OneDrive des forfaits (fichier .json), sinon les autres ne verront pas tes changements.');
              } else if (resultat) toast('Fichier de sauvegarde enregistré');
            },
          }, 'Fichier de sauvegarde (.json)'),
          h('button', {
            type: 'button', class: 'btn btn-bord', id: 'btn-export-csv',
            onclick: () => { telecharger(`forfaits-${horodatage()}.csv`, contenuCsv(), 'text/csv;charset=utf-8'); dlg.close(); toast('Tableau Excel enregistré dans Téléchargements'); },
          }, 'Tableau pour Excel (.csv)')),
      ],
    });
  }

  function lancerImport() {
    if (lectureSeule()) return;
    const champ = $('fichier-import');
    champ.value = '';
    champ.click();
  }

  // Compte ce que la mise à jour va changer, pour l'annoncer avant de le faire,
  // et nomme les forfaits dont le prix change (le reste d'une modification compte moins au comptoir).
  // prixRemplacer : la même liste pour « Remplacer tout », qui prend aussi les versions plus anciennes du fichier.
  function bilanFusion(entrant) {
    const locaux = new Map(donnees.forfaits.map((f) => [f.id, f]));
    const bilan = { nouveaux: 0, modifies: 0, supprimes: 0, prix: [], prixRemplacer: [] };
    const ligne = (l, f) => `${f.ref} : ${formatPrix(l.ht)} → ${formatPrix(f.ht)} HT, ${formatPrix(l.ttc)} → ${formatPrix(f.ttc)} TTC`;
    for (const f of entrant.forfaits) {
      const l = locaux.get(f.id);
      if (!l) { if (!f.supprime) bilan.nouveaux++; continue; }
      const prixChange = !f.supprime && !l.supprime && (f.ht !== l.ht || f.ttc !== l.ttc);
      if (prixChange) bilan.prixRemplacer.push(ligne(l, f));
      if (f.maj <= l.maj) continue;
      if (f.supprime && !l.supprime) bilan.supprimes++;
      else if (!f.supprime && l.supprime) bilan.nouveaux++;
      else if (!f.supprime) {
        bilan.modifies++;
        if (prixChange) bilan.prix.push(ligne(l, f));
      }
    }
    bilan.prix.sort(tri.compare);
    bilan.prixRemplacer.sort(tri.compare);
    return bilan;
  }

  // « Titre : a ; b ; c … (+5) » : une liste longue reste lisible dans une fenêtre de confirmation.
  const resume = (titre, liste) => (liste.length ? `${titre} : ${liste.slice(0, 10).join(' ; ')}${liste.length > 10 ? ` … (+${liste.length - 10})` : ''}` : null);

  /* ---------- Tableau Excel (.csv) : remplir ou mettre à jour les forfaits depuis Excel ---------- */

  // Titres de colonnes reconnus (comparés « à plat », voir norm) ; null = colonne ignorée.
  // Tout autre titre est une famille (Taximètre, Boîtier…) : celles qui existent sont reconnues,
  // les autres sont créées à l'import (et annoncées avant, pour repérer une faute de frappe).
  const COLONNES_TABLEAU = new Map([
    ['reference', 'ref'], ['designation', 'designation'], ['prixht', 'ht'], ['ht', 'ht'], ['prixttc', 'ttc'], ['ttc', 'ttc'],
    ['surnoms', 'surnoms'], ['exemple', 'exemple'], ['modifiele', null],
  ]);
  const LIGNES_TABLEAU_MAX = 5000;
  const FAMILLES_TABLEAU_MAX = 10; // nouvelles familles par import : au-delà, c'est sans doute un mauvais fichier

  // Texte d'un fichier : UTF-8 (« CSV UTF-8 » d'Excel), sinon Windows-1252 (ancien « CSV » d'Excel).
  async function lireTexte(fichier) {
    const octets = await fichier.arrayBuffer();
    try {
      return new TextDecoder('utf-8', { fatal: true }).decode(octets);
    } catch {
      return new TextDecoder('windows-1252').decode(octets);
    }
  }

  // Découpe un CSV en lignes de cellules : séparateur « ; », virgule ou tabulation, guillemets,
  // retours à la ligne dans une cellule. Le numéro de ligne dans Excel = position + 1.
  function decouperCsv(texte) {
    const t = texte.replace(/^﻿/, '');
    const premiere = t.split(/\r?\n/, 1)[0];
    const sep = [';', '\t', ','].map((s) => [s, premiere.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
    const lignes = [];
    let ligne = [];
    let cellule = '';
    let entreGuillemets = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (entreGuillemets) {
        if (c !== '"') cellule += c;
        else if (t[i + 1] === '"') { cellule += '"'; i++; }
        else entreGuillemets = false;
      } else if (c === '"' && cellule === '') {
        entreGuillemets = true;
      } else if (c === sep) {
        ligne.push(cellule);
        cellule = '';
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && t[i + 1] === '\n') i++;
        ligne.push(cellule);
        lignes.push(ligne);
        ligne = [];
        cellule = '';
      } else {
        cellule += c;
      }
    }
    if (cellule !== '' || ligne.length) { ligne.push(cellule); lignes.push(ligne); }
    return lignes;
  }

  // Transforme le tableau en données prêtes à fusionner, ou renvoie la liste des problèmes (rien n'est modifié).
  // Un forfait garde son identifiant si sa référence existe déjà : on le met à jour au lieu de le dupliquer.
  function analyserTableau(texte) {
    const lignes = decouperCsv(texte);
    // Excel ajoute des lignes vides à la fin de chaque colonne mise en forme : on les écarte avant de compter.
    while (lignes.length && lignes[lignes.length - 1].every((c) => !String(c).trim())) lignes.pop();
    if (lignes.length > LIGNES_TABLEAU_MAX + 1) return { erreurs: [`Trop de lignes : ${LIGNES_TABLEAU_MAX} forfaits au maximum.`] };
    const colonnes = new Map(); // 'ref', 'ht'… ou 'fam:<id>' → numéro de colonne
    const famParNom = new Map(index.fams.map((f) => [norm(f.nom), f]));
    const nouvelles = new Map(); // titres inconnus : clé « à plat » → [titre, numéro de colonne]
    (lignes[0] || []).forEach((titre, i) => {
      const cle = norm(titre);
      if (!cle) return;
      const champ = COLONNES_TABLEAU.has(cle) ? COLONNES_TABLEAU.get(cle) : famParNom.has(cle) ? 'fam:' + famParNom.get(cle).id : undefined;
      if (champ === undefined) { if (!nouvelles.has(cle)) nouvelles.set(cle, [String(titre).trim(), i]); }
      else if (champ && !colonnes.has(champ)) colonnes.set(champ, i);
    });
    // Les titres obligatoires d'abord : s'il en manque un, les autres titres sont sans doute le même fichier mal lu, pas des familles.
    const manquantes = [['ref', 'Référence'], ['ht', 'Prix HT'], ['ttc', 'Prix TTC']].filter(([champ]) => !colonnes.has(champ)).map(([, nom]) => nom);
    if (manquantes.length) {
      return { erreurs: manquantes.map((nom) => `Colonne « ${nom} » introuvable : la première ligne doit contenir les titres du modèle.`) };
    }
    const problemesFamilles = [
      ...(nouvelles.size > FAMILLES_TABLEAU_MAX ? [`${nouvelles.size} colonnes inconnues : ${FAMILLES_TABLEAU_MAX} nouvelles familles au maximum par tableau. Vérifie les titres de la première ligne.`] : []),
      ...[...nouvelles.values()].filter(([titre]) => titre.length > 60).map(([titre]) => `Colonne « ${titre.slice(0, 30)}… » : nom de famille trop long (60 caractères au maximum).`),
    ];
    if (problemesFamilles.length) return { erreurs: problemesFamilles };

    // Une colonne inconnue est une nouvelle famille : créée à l'import, après confirmation.
    const maintenant = Date.now();
    let ordre = Math.max(0, ...donnees.familles.map((f) => f.ordre));
    const famillesCreees = [...nouvelles.values()].map(([titre, i]) => {
      const fam = { id: nouvelId('fam'), nom: titre, ordre: ++ordre, maj: maintenant };
      colonnes.set('fam:' + fam.id, i);
      return fam;
    });
    const toutesFamilles = [...index.fams, ...famillesCreees];
    const erreurs = [];
    const avertissements = [];
    const nouveauxElements = [];
    const elementsCrees = [];
    const elementsConnus = new Map(index.elsActifs.map((e) => [`${e.familleId}|${norm(e.nom)}`, e]));
    const lignesParRef = new Map();
    const forfaits = [];
    const brouillons = []; // lignes lues, avant le contrôle des surnoms
    let avecExemples = false;
    for (let n = 1; n < lignes.length; n++) {
      const ligne = lignes[n];
      if (ligne.every((c) => !String(c).trim())) continue;
      // L'export de l'outil protège avec une apostrophe les cellules qui commencent par = + - @.
      // Dans les tableaux remplis à la main, « / » veut dire « pas de données » : même chose qu'une case vide.
      const lire = (cle) => {
        const texte = colonnes.has(cle) ? String(ligne[colonnes.get(cle)] ?? '').trim().replace(/^'(?=[=+\-@])/, '') : '';
        return texte === '/' ? '' : texte;
      };
      const ref = lire('ref');
      if (!ref) { erreurs.push(`Ligne ${n + 1} : la référence est vide.`); continue; }
      const lieu = `Ligne ${n + 1} (${ref.slice(0, 40)})`;
      if (ref.length > 80) { erreurs.push(`${lieu} : référence trop longue (80 caractères au maximum).`); continue; }
      const cleRef = ref.toLocaleUpperCase('fr');
      if (lignesParRef.has(cleRef)) { erreurs.push(`${lieu} : cette référence est déjà à la ligne ${lignesParRef.get(cleRef)}.`); continue; }
      lignesParRef.set(cleRef, n + 1);
      const ht = lirePrix(lire('ht'));
      const ttc = lirePrix(lire('ttc'));
      if (ht === null) erreurs.push(`${lieu} : prix HT ${lire('ht') ? `illisible « ${lire('ht').slice(0, 30)} »` : 'manquant'}.`);
      if (ttc === null) erreurs.push(`${lieu} : prix TTC ${lire('ttc') ? `illisible « ${lire('ttc').slice(0, 30)} »` : 'manquant'}.`);
      if (ht === null || ttc === null) continue;
      if (Math.abs(ttc - ttcDepuisHt(ht)) > TOLERANCE_TVA) avertissements.push(`${ref} : ${formatPrix(ttc)} au lieu de ${formatPrix(ttcDepuisHt(ht))}`);

      const existant = donnees.forfaits.find((f) => !f.supprime && memeRef(f.ref, ref)) || donnees.forfaits.find((f) => memeRef(f.ref, ref));
      // Une famille absente du tableau n'est pas touchée ; une cellule vide retire l'élément.
      const elements = { ...(existant?.elements ?? {}) };
      for (const fam of toutesFamilles) {
        const cle = 'fam:' + fam.id;
        if (!colonnes.has(cle)) continue;
        const nom = lire(cle);
        if (!nom) { delete elements[fam.id]; continue; }
        if (!norm(nom)) { erreurs.push(`${lieu} : ${fam.nom} « ${nom.slice(0, 30)} » illisible.`); continue; }
        const cleElement = `${fam.id}|${norm(nom)}`;
        // Le surnom d'équipe d'un élément vaut son nom (« la petite » → 3Q) ; pris dans une autre famille, c'est une erreur.
        let element = elementsConnus.get(cleElement)
          || index.elsActifs.find((e) => e.familleId === fam.id && (e.surnoms || []).some((s) => norm(s) === norm(nom)));
        const ailleurs = !element && index.surnomPris.get(norm(nom));
        if (ailleurs?.equipe) { erreurs.push(`${lieu} : ${fam.nom} « ${nom.slice(0, 30)} » est le surnom de ${nomDe(ailleurs.id)}.`); continue; }
        if (!element) {
          element = { id: nouvelId('elt'), familleId: fam.id, nom: nom.slice(0, 60), maj: maintenant };
          elementsConnus.set(cleElement, element);
          elementsCrees.push(element);
          nouveauxElements.push(`${fam.nom} : ${element.nom}`);
        }
        elements[fam.id] = element.id;
      }

      // Comme pour les familles : une colonne absente du tableau ne touche pas à ce que l'outil contient déjà.
      const designation = colonnes.has('designation') || !existant ? lire('designation') : existant.designation;
      const exemple = colonnes.has('exemple') || !existant ? norm(lire('exemple')) === 'oui' : !!existant.exemple;
      if (exemple) avecExemples = true;
      // Surnoms : la case remplace ceux de l'équipe (vide = aucun) ; sans la colonne, on garde. Contrôlés après la lecture de tout le tableau.
      const surnomsLus = colonnes.has('surnoms') || !existant ? lireSurnoms(lire('surnoms'), Infinity) : null;
      brouillons.push({ existant, ref, designation, ht, ttc, elements, exemple, surnomsLus });
    }

    // Un surnom désigne une seule chose : pas le nom ni le surnom d'un élément, ni le surnom d'un autre forfait
    // (celui d'un forfait du tableau compte selon sa nouvelle case : un surnom peut passer d'un forfait à l'autre).
    const pris = new Map();
    for (const f of index.fams) pris.set(norm(f.nom), `la famille ${f.nom}`);
    for (const e of [...index.elsActifs, ...elementsCrees]) for (const s of [e.nom, ...(e.surnoms || [])]) pris.set(norm(s), e.nom);
    const recases = new Set(brouillons.filter((b) => b.surnomsLus && b.existant).map((b) => b.existant.id));
    for (const f of index.forfaits) if (!recases.has(f.id)) for (const s of f.surnoms || []) pris.set(norm(s), `forfait ${f.ref}`);
    const surnomsRefuses = [];
    for (const b of brouillons) {
      // Sans la colonne, un forfait actif garde ses surnoms ; un forfait supprimé qui revient repasse le contrôle.
      // Au-delà de 3, les suivants sont annoncés et laissés de côté : le même tableau donne le même résultat sur tous
      // les appareils, quels que soient les surnoms qu'ils avaient déjà.
      let gardes = 0;
      const surnoms = !b.surnomsLus && !b.existant.supprime ? b.existant.surnoms || [] : (b.surnomsLus ?? b.existant.surnoms ?? []).filter((s) => {
        const deja = pris.get(norm(s));
        if (deja) { surnomsRefuses.push(`${b.ref} : « ${s} » (déjà pris par ${deja})`); return false; }
        if (gardes === SURNOMS_MAX) { surnomsRefuses.push(`${b.ref} : « ${s} » (${SURNOMS_MAX} surnoms au maximum)`); return false; }
        gardes += 1;
        pris.set(norm(s), `forfait ${b.ref}`);
        return true;
      });
      const { existant, ref, designation, ht, ttc, elements, exemple } = b;
      const inchange = existant && !existant.supprime && existant.ref === ref && existant.designation === designation
        && existant.ht === ht && existant.ttc === ttc && !existant.exemple === !exemple
        && (existant.surnoms || []).join('|') === surnoms.join('|')
        && JSON.stringify(Object.entries(existant.elements).sort()) === JSON.stringify(Object.entries(elements).sort());
      forfaits.push(inchange ? existant : {
        id: existant?.id ?? nouvelId('fft'), ref, designation, ...avecSurnoms(surnoms), ht, ttc, elements,
        maj: Math.max(maintenant, (existant?.maj ?? 0) + 1), ...(exemple ? { exemple: true } : {}),
      });
    }
    if (!erreurs.length && !forfaits.length) erreurs.push('Le tableau ne contient aucun forfait.');
    if (erreurs.length) return { erreurs };
    try {
      // Même contrôle que pour un fichier de sauvegarde : longueurs, identifiants, prix.
      const entrant = valider({ format: FORMAT, version: VERSION_FORMAT, familles: [...donnees.familles, ...famillesCreees], elements: [...donnees.elements, ...elementsCrees], forfaits });
      return { entrant, nbForfaits: forfaits.length, nouvellesFamilles: famillesCreees.map((f) => f.nom), nouveauxElements, avertissements, avecExemples, surnomsRefuses };
    } catch (err) {
      return { erreurs: [err.message] };
    }
  }

  // Fichier OneDrive « en ligne seulement », retiré pendant le choix… : le navigateur ne peut pas le lire.
  const FICHIER_ILLISIBLE = "Le fichier n'a pas pu être lu. S'il est dans OneDrive, ouvre-le une fois dans OneDrive pour qu'il soit sur l'appareil, puis réessaie.";

  async function importerTableau(fichier) {
    let texte;
    try {
      texte = await lireTexte(fichier);
    } catch {
      await informer('Import impossible', FICHIER_ILLISIBLE);
      return;
    }
    const analyse = analyserTableau(texte);
    if (analyse.erreurs) {
      const max = 12;
      await informer('Import impossible', "Le tableau n'a pas été importé : rien n'a changé. Corrige-le, enregistre-le de nouveau, puis réessaie.",
        [...analyse.erreurs.slice(0, max), ...(analyse.erreurs.length > max ? [`… et ${analyse.erreurs.length - max} autre(s) problème(s).`] : [])]);
      return;
    }
    const { entrant, nbForfaits, nouvellesFamilles, nouveauxElements, avertissements, avecExemples, surnomsRefuses } = analyse;
    const bilan = bilanFusion(entrant);
    const inchanges = nbForfaits - bilan.nouveaux - bilan.modifies;
    // Premier remplissage : le tableau ne contient pas d'exemples, et il en reste dans l'outil.
    const exemplesRestants = !avecExemples && donnees.forfaits.some((f) => f.exemple && !f.supprime);
    const choix = await demander({
      titre: 'Importer ce tableau ?',
      message: `${fichier.name} — ${pluriel(nbForfaits, 'forfait')}.`,
      liste: [
        `${bilan.nouveaux} nouveau${bilan.nouveaux > 1 ? 'x' : ''}, ${pluriel(bilan.modifies, 'modifié')}, ${inchanges} inchangé${inchanges > 1 ? 's' : ''}. Les autres forfaits de cet appareil ne bougent pas.`,
        resume('Prix qui changent', bilan.prix),
        resume("Familles (colonnes) qui n'existent pas encore et seront créées (vérifie l'orthographe)", nouvellesFamilles),
        resume("Éléments qui n'existent pas encore et seront créés (vérifie l'orthographe)", nouveauxElements),
        resume(`TTC à vérifier (différent de HT + ${TAUX_TVA})`, avertissements),
        resume("Surnoms ignorés (un surnom ne désigne qu'une seule chose, 3 au maximum)", surnomsRefuses),
      ].filter(Boolean),
      boutons: [
        { texte: 'Importer', valeur: 'fusion', classe: exemplesRestants ? 'btn-bord' : 'btn-rouge' },
        exemplesRestants ? { texte: 'Importer et supprimer les exemples', valeur: 'sans-exemples', classe: 'btn-rouge' } : null,
        { texte: 'Annuler', valeur: null },
      ].filter(Boolean),
    });
    if (!choix) return;
    donnees = fusionner(donnees, entrant);
    if (choix === 'sans-exemples') marquerExemplesSupprimes();
    if (!sauver()) return;
    if (bilan.nouveaux || bilan.modifies || nouvellesFamilles.length || nouveauxElements.length || choix === 'sans-exemples') noterModif();
    rafraichir();
    toast('Tableau importé');
  }

  async function importerFichier(fichier) {
    if (!fichier) return;
    if (lectureSeule()) return;  // le choix du fichier était déjà ouvert quand un autre onglet a annoncé la version plus récente
    if (fichier.size > 5 * 1024 * 1024) { await informer('Import impossible', 'Fichier trop gros pour être un fichier de forfaits.'); return; }
    if (/\.xlsx?$/i.test(fichier.name)) {
      await informer('Import impossible', "C'est le fichier Excel lui-même. Dans Excel : Fichier → Enregistrer sous → « CSV UTF-8 », puis importe ce fichier .csv.");
      return;
    }
    if (/\.csv$/i.test(fichier.name)) { await importerTableau(fichier); return; }
    let entrant, exporteLe, texte;
    try {
      texte = await fichier.text();
    } catch {
      await informer('Import impossible', FICHIER_ILLISIBLE);
      return;
    }
    try {
      const obj = JSON.parse(texte);
      entrant = valider(obj);
      exporteLe = Date.parse(obj.exporteLe);
    } catch (err) {
      await informer('Import impossible', err instanceof SyntaxError
        ? "Ce fichier n'est pas un fichier de forfaits. Choisis le fichier .json exporté par l'outil, ou le tableau .csv du modèle Excel."
        : err.message);
      return;
    }
    const bilan = bilanFusion(entrant);
    const nbEntrants = entrant.forfaits.filter((f) => !f.supprime).length;
    const plusAncien = derniereModif(entrant) < derniereModif(donnees);
    // Un fichier piégé ou abîmé peut effacer les vrais forfaits (les exemples partent normalement) : à dire en clair.
    const vrais = donnees.forfaits.filter((f) => !f.supprime && !f.exemple);
    const entrantParId = new Map(entrant.forfaits.map((f) => [f.id, f]));
    const effaces = vrais.filter((l) => entrantParId.get(l.id)?.supprime && entrantParId.get(l.id).maj > l.maj).length;
    const absents = vrais.filter((l) => !entrantParId.has(l.id) || entrantParId.get(l.id).supprime).length;
    const choix = await demander({
      titre: 'Importer ce fichier ?',
      message: `${fichier.name} — ${Number.isFinite(exporteLe) ? 'exporté le ' + fmtDateHeure.format(new Date(exporteLe)) + ', ' : ''}${pluriel(nbEntrants, 'forfait')}.`,
      liste: [
        `Mettre à jour (conseillé) : ${bilan.nouveaux} nouveau${bilan.nouveaux > 1 ? 'x' : ''}, ${pluriel(bilan.modifies, 'modifié')}, ${pluriel(bilan.supprimes, 'supprimé')}. Garde la version la plus récente de chaque forfait.`,
        effaces >= 3 && effaces * 5 >= vrais.length
          ? `Attention : « Mettre à jour » supprimerait ${effaces} des ${vrais.length} forfaits de cet appareil. Si ce fichier ne vient pas d'un responsable, annule.` : null,
        resume('Prix qui changent', bilan.prix),
        'Remplacer tout : cet appareil devient une copie exacte du fichier.'
          + (absents ? ` ${pluriel(absents, 'forfait')} de cet appareil ${absents > 1 ? 'disparaîtraient' : 'disparaîtrait'} (absent${absents > 1 ? 's' : ''} du fichier).` : ''),
        // Fichier plus ancien : « Remplacer tout » remettrait d'anciens prix, à dire avant.
        bilan.prixRemplacer.join() === bilan.prix.join() ? null : resume('Prix qui changent avec « Remplacer tout »', bilan.prixRemplacer),
        plusAncien ? 'Attention : ce fichier est plus ancien que tes données. « Mettre à jour » gardera tes versions plus récentes.' : null,
      ].filter(Boolean),
      boutons: [
        { texte: 'Mettre à jour', valeur: 'fusion', classe: 'btn-rouge' },
        { texte: 'Remplacer tout', valeur: 'remplacer' },
        { texte: 'Annuler', valeur: null },
      ],
    });
    if (!choix) return;
    if (choix === 'remplacer' && appareil.modifsEnAttente > 0) {
      const ok = await demander({
        titre: 'Remplacer tout ?',
        message: `Tu as ${pluriel(appareil.modifsEnAttente, 'modification')} pas encore exportée(s) sur cet appareil : elles seront perdues.`,
        boutons: [{ texte: 'Remplacer quand même', valeur: true, classe: 'btn-rouge' }, { texte: 'Annuler', valeur: false }],
      });
      if (!ok) return;
    }
    if (choix === 'fusion') {
      donnees = fusionner(donnees, entrant);
      // Le fichier a retiré ses exemples : ceux de cet appareil partent aussi, même s'ils n'ont pas les mêmes identifiants
      // (exemples d'une autre version de l'outil).
      if (entrant.forfaits.some((f) => f.exemple && f.supprime) && !entrant.forfaits.some((f) => f.exemple && !f.supprime)) marquerExemplesSupprimes(true);
    } else {
      donnees = entrant;
      appareil.modifsEnAttente = 0;
    }
    if (!sauver()) return;
    donneesIllisibles = false;
    appareil.dernierImport = Date.now();
    demanderStockageDurable();
    sauverAppareil();
    rafraichir();
    toast(choix === 'fusion' ? 'Mise à jour terminée' : 'Données remplacées');
    // Deux responsables ont pu créer la même référence, ou le même élément, chacun de leur côté.
    const vues = new Map();
    const compter = (cle, libelle) => vues.set(cle, { libelle, n: (vues.get(cle)?.n || 0) + 1 });
    for (const f of index.forfaits) compter('ref|' + f.ref.trim().toLocaleUpperCase('fr'), `Référence ${f.ref}`);
    for (const e of index.elsActifs) compter(`elt|${e.familleId}|${norm(e.nom)}`, `${index.famParId.get(e.familleId).nom} : ${e.nom}`);
    const doublons = [...vues.values()].filter((v) => v.n > 1).map((v) => `${v.libelle} (${v.n} fois)`);
    // Même surnom donné à deux choses sur deux appareils : la recherche n'en garde qu'une.
    for (const x of [...index.elsActifs, ...index.forfaits]) {
      for (const s of x.surnoms || []) {
        const pris = index.surnomPris.get(norm(s));
        if (pris?.id !== x.id) doublons.push(`Surnom « ${s} » de ${nomDe(x.id)} : déjà ${pris ? 'pris par ' + nomDe(pris.id) : "le nom d'un élément ou d'une famille"}`);
      }
    }
    // 50 lignes au plus : un fichier piégé ne doit pas figer la page avec des milliers de lignes.
    const affiches = doublons.length > 50 ? [...doublons.slice(0, 50), `… et ${doublons.length - 50} autres`] : doublons;
    if (doublons.length) await informer('Doublons à corriger', 'Après la mise à jour, ces références ou éléments existent plusieurs fois. Un responsable doit corriger :', affiches);
  }

  /* =====================================================================
     QR DU LIEN D'APPAIRAGE
     Encodeur complet (mode octets, correction M, versions 1 à 10) : la page n'a aucune dépendance,
     et un QR faux ne se verrait qu'au magasin. tests/test_qr.py compare chaque matrice à celle de
     segno (bibliothèque de référence), les 8 masques et le masque retenu.
     ===================================================================== */

  // Par version (1 à 10), correction M : octets de correction par bloc, puis (nombre de blocs,
  // octets de données par bloc) du premier groupe, puis du second.
  const QR_M = [
    [10, 1, 16, 0, 0], [16, 1, 28, 0, 0], [26, 1, 44, 0, 0], [18, 2, 32, 0, 0], [24, 2, 43, 0, 0],
    [16, 4, 27, 0, 0], [18, 4, 31, 0, 0], [22, 2, 38, 2, 39], [22, 3, 36, 2, 37], [26, 4, 43, 1, 44],
  ];
  // Centres des motifs d'alignement, par version.
  const QR_ALIGNEMENTS = [
    [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50],
  ];
  const QR_MASQUES = [
    (l, c) => (l + c) % 2 === 0,
    (l) => l % 2 === 0,
    (l, c) => c % 3 === 0,
    (l, c) => (l + c) % 3 === 0,
    (l, c) => (Math.floor(l / 2) + Math.floor(c / 3)) % 2 === 0,
    (l, c) => ((l * c) % 2) + ((l * c) % 3) === 0,
    (l, c) => (((l * c) % 2) + ((l * c) % 3)) % 2 === 0,
    (l, c) => (((l + c) % 2) + ((l * c) % 3)) % 2 === 0,
  ];

  // Corps fini GF(256), polynôme 0x11D : exponentielles et logarithmes, calculés une fois.
  const QR_EXP = new Uint8Array(512);
  const QR_LOG = new Uint8Array(256);
  for (let i = 0, x = 1; i < 255; i++) {
    QR_EXP[i] = x;
    QR_LOG[x] = i;
    x = (x << 1) ^ (x & 0x80 ? 0x11d : 0);
  }
  for (let i = 255; i < 512; i++) QR_EXP[i] = QR_EXP[i - 255];
  const qrMul = (a, b) => (a && b ? QR_EXP[QR_LOG[a] + QR_LOG[b]] : 0);

  // Polynôme générateur de n octets de correction : (x + α⁰)(x + α¹)…(x + α^(n-1)).
  function qrGenerateur(n) {
    let g = [1];
    for (let i = 0; i < n; i++) {
      const suivant = new Array(g.length + 1).fill(0);
      for (let j = 0; j < g.length; j++) {
        suivant[j] ^= g[j];
        suivant[j + 1] ^= qrMul(g[j], QR_EXP[i]);
      }
      g = suivant;
    }
    return g;
  }

  // Reste de la division polynomiale : les octets de correction du bloc.
  function qrCorrection(donnees, n) {
    const g = qrGenerateur(n);
    const reste = new Uint8Array(n);
    for (const octet of donnees) {
      const facteur = octet ^ reste[0];
      reste.copyWithin(0, 1);
      reste[n - 1] = 0;
      if (facteur) for (let j = 0; j < n; j++) reste[j] ^= qrMul(g[j + 1], facteur);
    }
    return reste;
  }

  // Texte → version choisie et octets prêts à poser (données et correction entrelacées par bloc).
  function qrOctets(texte) {
    const donnees = utf8.encode(texte);
    let version = 0;
    for (let v = 1; v <= QR_M.length; v++) {
      const [, n1, d1, n2, d2] = QR_M[v - 1];
      if (Math.floor(((n1 * d1 + n2 * d2) * 8 - 4 - (v >= 10 ? 16 : 8)) / 8) >= donnees.length) { version = v; break; }
    }
    if (!version) return null; // texte trop long : pas de QR (le lien se colle de toute façon)

    const [ecParBloc, n1, d1, n2, d2] = QR_M[version - 1];
    const total = n1 * d1 + n2 * d2;
    const bits = [];
    const pousser = (valeur, n) => { for (let i = n - 1; i >= 0; i--) bits.push((valeur >> i) & 1); };
    pousser(0b0100, 4); // mode octets
    pousser(donnees.length, version >= 10 ? 16 : 8);
    for (const o of donnees) pousser(o, 8);
    for (let i = 0; i < 4 && bits.length < total * 8; i++) bits.push(0); // terminateur
    while (bits.length % 8) bits.push(0);
    const mots = [];
    for (let i = 0; i < bits.length; i += 8) mots.push(bits.slice(i, i + 8).reduce((a, b) => (a << 1) | b, 0));
    for (let i = 0; mots.length < total; i++) mots.push(i % 2 ? 0x11 : 0xec); // remplissage normalisé

    const blocs = [];
    let pos = 0;
    for (const [nb, taille] of [[n1, d1], [n2, d2]]) {
      for (let b = 0; b < nb; b++) {
        const part = mots.slice(pos, pos + taille);
        pos += taille;
        blocs.push({ donnees: part, correction: qrCorrection(part, ecParBloc) });
      }
    }
    const sortie = [];
    for (let i = 0; i < Math.max(d1, d2); i++) for (const b of blocs) if (i < b.donnees.length) sortie.push(b.donnees[i]);
    for (let i = 0; i < ecParBloc; i++) for (const b of blocs) sortie.push(b.correction[i]);
    return { version, mots: sortie };
  }

  // Codes correcteurs des informations de format (15 bits) et de version (18 bits).
  function qrBch(donnees, decalage, generateur, hauteur, ou) {
    let v = donnees << decalage;
    for (let i = hauteur; i >= 0; i--) if (v & (1 << (i + decalage))) v ^= generateur << i;
    return ((donnees << decalage) | v) ^ ou;
  }
  const qrFormat = (masque) => qrBch(masque, 10, 0x537, 4, 0x5412); // correction M = 00
  const qrVersion = (version) => qrBch(version, 12, 0x1f25, 5, 0);

  // Emplacements des 15 bits de format, du plus fort au plus faible, dans leurs deux copies.
  const qrPlacesFormat = (t) => [
    [[8, 0], [t - 1, 8]], [[8, 1], [t - 2, 8]], [[8, 2], [t - 3, 8]], [[8, 3], [t - 4, 8]],
    [[8, 4], [t - 5, 8]], [[8, 5], [t - 6, 8]], [[8, 7], [t - 7, 8]], [[8, 8], [8, t - 8]],
    [[7, 8], [8, t - 7]], [[5, 8], [8, t - 6]], [[4, 8], [8, t - 5]], [[3, 8], [8, t - 4]],
    [[2, 8], [8, t - 3]], [[1, 8], [8, t - 2]], [[0, 8], [8, t - 1]],
  ];

  // Les 4 pénalités du standard : plus le total est bas, plus le QR se lit vite.
  function qrPenalite(m) {
    const taille = m.length;
    let total = 0;
    // 1. Suites de 5 modules ou plus de la même couleur, en ligne et en colonne.
    for (let i = 0; i < taille; i++) {
      for (const parLigne of [true, false]) {
        let suite = 1;
        for (let j = 1; j < taille; j++) {
          const egal = parLigne ? m[i][j] === m[i][j - 1] : m[j][i] === m[j - 1][i];
          suite = egal ? suite + 1 : 1;
          if (suite === 5) total += 3;
          else if (suite > 5) total += 1;
        }
      }
    }
    // 2. Chaque carré de 2×2 d'une seule couleur.
    for (let l = 0; l < taille - 1; l++) {
      for (let c = 0; c < taille - 1; c++) {
        if (m[l][c] === m[l][c + 1] && m[l][c] === m[l + 1][c] && m[l][c] === m[l + 1][c + 1]) total += 3;
      }
    }
    // 3. Le motif 1:1:3:1:1 bordé de 4 modules clairs, qui imite une cible d'angle.
    for (let i = 0; i < taille; i++) {
      let ligne = '';
      let colonne = '';
      for (let j = 0; j < taille; j++) { ligne += m[i][j]; colonne += m[j][i]; }
      for (const texte of [ligne, colonne]) {
        for (const motif of ['10111010000', '00001011101']) {
          for (let p = texte.indexOf(motif); p !== -1; p = texte.indexOf(motif, p + 1)) total += 40;
        }
      }
    }
    // 4. Écart à 50 % de modules sombres.
    let sombres = 0;
    for (const ligne of m) for (const v of ligne) sombres += v;
    total += Math.floor(Math.abs((sombres * 100) / (taille * taille) - 50) / 5) * 10;
    return total;
  }

  // Matrice finale (0 clair, 1 sombre). masqueImpose sert aux tests ; sinon le masque est choisi.
  function qrMatrice(texte, masqueImpose) {
    const code = qrOctets(texte);
    if (!code) return null;
    const { version, mots } = code;
    const taille = 17 + 4 * version;
    const m = Array.from({ length: taille }, () => new Uint8Array(taille));
    const fixe = Array.from({ length: taille }, () => new Uint8Array(taille));
    const poser = (l, c, v) => {
      if (l < 0 || c < 0 || l >= taille || c >= taille) return;
      m[l][c] = v;
      fixe[l][c] = 1;
    };

    // Cibles d'angle et leurs séparateurs.
    for (const [L, C] of [[0, 0], [0, taille - 7], [taille - 7, 0]]) {
      for (let l = -1; l <= 7; l++) {
        for (let c = -1; c <= 7; c++) {
          const bord = l === -1 || l === 7 || c === -1 || c === 7;
          poser(L + l, C + c, bord || Math.max(Math.abs(l - 3), Math.abs(c - 3)) === 2 ? 0 : 1);
        }
      }
    }
    // Lignes de synchronisation.
    for (let i = 8; i < taille - 8; i++) {
      poser(6, i, i % 2 === 0 ? 1 : 0);
      poser(i, 6, i % 2 === 0 ? 1 : 0);
    }
    // Motifs d'alignement, sauf ceux qui tomberaient sur une cible d'angle.
    const centres = QR_ALIGNEMENTS[version - 1];
    for (const l of centres) {
      for (const c of centres) {
        if ((l === 6 && (c === 6 || c === taille - 7)) || (l === taille - 7 && c === 6)) continue;
        for (let dl = -2; dl <= 2; dl++) {
          for (let dc = -2; dc <= 2; dc++) poser(l + dl, c + dc, Math.max(Math.abs(dl), Math.abs(dc)) === 1 ? 0 : 1);
        }
      }
    }
    // Places réservées : format, module sombre, et version à partir de la 7.
    for (const [a, b] of qrPlacesFormat(taille)) { poser(...a, 0); poser(...b, 0); }
    poser(taille - 8, 8, 1);
    if (version >= 7) {
      const bitsVersion = qrVersion(version);
      for (let i = 0; i < 18; i++) {
        const bit = (bitsVersion >> i) & 1;
        poser(taille - 11 + (i % 3), Math.floor(i / 3), bit);
        poser(Math.floor(i / 3), taille - 11 + (i % 3), bit);
      }
    }

    // Les données en zigzag, deux colonnes à la fois, depuis le coin bas droit.
    let bit = 0;
    const total = mots.length * 8;
    let versLeHaut = true;
    for (let c = taille - 1; c > 0; c -= 2) {
      if (c === 6) c = 5; // la colonne de synchronisation ne porte rien
      for (let i = 0; i < taille; i++) {
        const l = versLeHaut ? taille - 1 - i : i;
        for (const cc of [c, c - 1]) {
          if (fixe[l][cc]) continue;
          m[l][cc] = bit < total ? (mots[bit >> 3] >> (7 - (bit & 7))) & 1 : 0;
          bit += 1;
        }
      }
      versLeHaut = !versLeHaut;
    }

    // Masque : on garde celui qui pénalise le moins (ou celui qu'on impose, pour les tests).
    const essai = (masque) => {
      const sortie = m.map((ligne, l) => ligne.map((v, c) => (fixe[l][c] ? v : v ^ (QR_MASQUES[masque](l, c) ? 1 : 0))));
      const bits = qrFormat(masque);
      qrPlacesFormat(taille).forEach(([a, b], i) => {
        const v = (bits >> (14 - i)) & 1;
        sortie[a[0]][a[1]] = v;
        sortie[b[0]][b[1]] = v;
      });
      return sortie;
    };
    if (masqueImpose !== undefined) return essai(masqueImpose).map((l) => Array.from(l));
    let meilleur = null;
    let note = Infinity;
    for (let masque = 0; masque < 8; masque++) {
      const candidat = essai(masque);
      const p = qrPenalite(candidat);
      if (p < note) { note = p; meilleur = candidat; }
    }
    return meilleur.map((l) => Array.from(l));
  }
  window.qrMatrice = qrMatrice; // lu par tests/test_qr.py, qui le compare module par module à une référence

  // Le QR dessiné. Noir sur blanc en dur : un QR inversé ne se lit pas sur tous les téléphones.
  function qrCanvas(texte, cote = 6) {
    const m = qrMatrice(texte);
    if (!m) return null;
    const marge = 4;
    const pixels = (m.length + marge * 2) * cote;
    const canvas = h('canvas', {
      class: 'qr', width: pixels, height: pixels, role: 'img',
      'aria-label': 'QR code du lien de mise à jour, à scanner avec l’appareil à connecter',
    });
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, pixels, pixels);
    ctx.fillStyle = '#000000';
    m.forEach((ligne, l) => ligne.forEach((v, c) => {
      if (v) ctx.fillRect((c + marge) * cote, (l + marge) * cote, cote, cote);
    }));
    return canvas;
  }
  window.qrCanvas = qrCanvas; // lu par tests/test_qr.py : couleurs et marge du dessin

  /* =====================================================================
     MISE À JOUR AUTOMATIQUE (facultatif)
     Les forfaits sont chiffrés ICI, sur l'appareil, avant de partir : le cloud n'en voit jamais
     un seul. La clé de l'équipe voyage dans la partie « # » du lien d'appairage, que le navigateur
     n'envoie à aucun serveur. Chaque appareil a son propre jeton, retirable seul.
     ===================================================================== */
  const CLE_CLOUD = 'forfaits.cloud.v1';
  // Sous-domaine du compte Cloudflare. La CSP de la page (connect-src) porte le même : un faux lien
  // d'appairage ne peut donc pas détourner cet appareil vers un autre cloud. Le NOM du Worker, lui,
  // n'est pas ici (il arrive par le lien) : le dépôt est public.
  const COMPTE_CLOUD = 'a-remplir';
  // Tant que le sous-domaine du compte n'est pas renseigné, aucune adresse https n'est acceptée
  // (voir adresseCloudOk) : les fenêtres le disent au lieu de laisser essayer pour rien.
  const cloudPasConfigure = COMPTE_CLOUD === 'a-remplir' && location.protocol === 'https:';
  const INTERVALLE_SYNCHRO = 5 * 60 * 1000; // vérification toutes les 5 min quand la page est affichée
  const DELAI_ENVOI = 2000;                 // envoi 2 s après la dernière modification
  const DELAI_APPEL = 20000;
  const JOURS_ALERTE_SYNCHRO = 3;
  const ECART_HORLOGE_MAX = 5 * 60 * 1000;  // au-delà, l'heure de l'appareil est fausse : on n'envoie pas
  const LOT_MAX = 20;                       // appareils équipés avec un même lien
  const MINUTES_LIEN = 10;
  const MINUTES_LOT = 1440;
  const ROLES_CLOUD = ['responsable', 'consultation'];

  const fmtHeure = new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const utf8 = new TextEncoder();
  const DONNEES_CHIFFREES = utf8.encode(FORMAT); // lie le chiffré à cet outil : un autre blob est refusé
  const depuisB64url = (t) => Uint8Array.from(atob(t.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  const enB64url = (o) => enBase64(o).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const depuisBase64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
  function enBase64(octets) {
    let texte = '';
    for (let i = 0; i < octets.length; i += 0x8000) texte += String.fromCharCode(...octets.subarray(i, i + 0x8000));
    return btoa(texte);
  }

  // Adresse acceptée : le cloud du compte de l'équipe, en https. L'exception locale sert aux essais
  // (un inconnu ne peut rien faire tourner sur la machine de l'utilisateur) et la CSP la refuse en ligne.
  function adresseCloudOk(a) {
    if (typeof a !== 'string') return false;
    let url;
    try { url = new URL(a); } catch { return false; }
    if (url.username || url.password || url.search || url.hash || url.pathname !== '/') return false;
    if (url.protocol === 'http:') return ['127.0.0.1', 'localhost'].includes(url.hostname);
    // Tant que le sous-domaine du compte n'est pas renseigné, n'importe qui pourrait réclamer
    // « a-remplir.workers.dev » et envoyer un lien que la page accepterait : rien n'est accepté.
    if (COMPTE_CLOUD === 'a-remplir') return false;
    return url.protocol === 'https:' && url.hostname.endsWith('.' + COMPTE_CLOUD + '.workers.dev');
  }
  const adresseDeHote = (hote) => (/^(127\.0\.0\.1|localhost)(:\d+)?$/.test(hote) ? 'http://' : 'https://') + hote;
  const hoteDeAdresse = (a) => a.replace(/^https?:\/\//, '');

  // Réglages du cloud sur CET appareil : adresse, son jeton à lui, la clé de l'équipe.
  function chargerCloud() {
    try {
      const c = JSON.parse(localStorage.getItem(CLE_CLOUD) || 'null');
      if (!c || !adresseCloudOk(c.adresse) || typeof c.jeton !== 'string' || c.jeton.length < 20) return null;
      if (!/^[A-Za-z0-9_-]{43}$/.test(c.cle) || !ROLES_CLOUD.includes(c.role)) return null;
      return {
        adresse: c.adresse, jeton: c.jeton, cle: c.cle, role: c.role,
        id: typeof c.id === 'string' ? c.id.slice(0, 40) : '',
        version: Number.isInteger(c.version) ? c.version : null, // dernière version reçue du cloud
        derniereSynchro: Number.isFinite(c.derniereSynchro) ? c.derniereSynchro : 0,
        aEnvoyer: c.aEnvoyer === true,                            // modifications pas encore envoyées
      };
    } catch {
      return null;
    }
  }
  function sauverCloud() {
    try {
      if (cloud) localStorage.setItem(CLE_CLOUD, JSON.stringify(cloud));
      else localStorage.removeItem(CLE_CLOUD);
    } catch {
      stockageOk = false;
    }
  }

  let cloud = chargerCloud();
  let etatSynchro = '';     // '', 'encours', 'ok', 'horsligne', 'refus', 'erreur', 'retire', 'horloge'
  let erreurSynchro = '';
  let synchroEnCours = null;
  let synchroARefaire = false;
  let minuteurEnvoi = 0;
  let ecartHorloge = 0;     // horloge de cet appareil moins celle du cloud

  // AES-256-GCM : 12 octets tirés au hasard (IV) + données chiffrées et scellées (toute retouche est vue).
  async function cleAes(cle, usage) {
    return crypto.subtle.importKey('raw', depuisB64url(cle), 'AES-GCM', false, [usage]);
  }
  async function chiffrer(objet, cle) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const chiffre = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv, additionalData: DONNEES_CHIFFREES }, await cleAes(cle, 'encrypt'), utf8.encode(JSON.stringify(objet)),
    );
    const tout = new Uint8Array(12 + chiffre.byteLength);
    tout.set(iv);
    tout.set(new Uint8Array(chiffre), 12);
    return enBase64(tout);
  }
  async function dechiffrer(blob, cle) {
    const octets = depuisBase64(blob);
    const clair = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: octets.subarray(0, 12), additionalData: DONNEES_CHIFFREES }, await cleAes(cle, 'decrypt'), octets.subarray(12),
    );
    return JSON.parse(new TextDecoder().decode(clair));
  }

  function appelCloud(adresse, chemin, { methode = 'GET', corps, version, jeton, codeSecours } = {}) {
    const entetes = {};
    if (jeton) entetes.Authorization = 'Bearer ' + jeton;
    if (corps) entetes['Content-Type'] = 'application/json';
    if (codeSecours) entetes['X-Code-Secours'] = codeSecours;
    if (version !== undefined && version !== null) entetes['If-None-Match'] = `"${version}"`; // « rien de neuf ? »
    // Minuteur à la main : AbortSignal.timeout n'existe pas sur les iPhone d'avant iOS 16.
    const arret = new AbortController();
    const minuteur = setTimeout(() => arret.abort(), DELAI_APPEL);
    let fini = false;
    return fetch(adresse + chemin, {
      method: methode, headers: entetes, body: corps ? JSON.stringify(corps) : undefined,
      cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer', signal: arret.signal,
    }).then(
      (r) => { fini = true; clearTimeout(minuteur); noterHorloge(r); return r; },
      (e) => { clearTimeout(minuteur); throw fini ? e : Object.assign(e, { reseau: true }); },
    );
  }

  // Le cloud dit son heure à chaque réponse (même sur un « rien de neuf »). La fusion se fie aux
  // dates des modifications, donc à l'horloge de l'appareil : un PC réglé deux jours en avance
  // gagnerait toutes les fusions, en silence. On le voit ici et on refuse d'envoyer.
  function noterHorloge(r) {
    const h = Number(r.headers.get('X-Heure'));
    if (Number.isFinite(h) && h > 0) ecartHorloge = Date.now() - h;
  }
  const horlogeFausse = () => Math.abs(ecartHorloge) > ECART_HORLOGE_MAX;

  // Vrai si « a » contient quelque chose de plus récent que « b » (ou d'absent de b).
  // Les données d'exemple jamais touchées (maj 0) ne comptent pas : tous les appareils les ont.
  function apporte(a, b) {
    return ['familles', 'elements', 'forfaits'].some((cle) => {
      const dansB = new Map(b[cle].map((x) => [x.id, x]));
      return a[cle].some((x) => (dansB.has(x.id) ? x.maj > dansB.get(x.id).maj : x.maj > 0));
    });
  }

  // Une seule synchronisation à la fois ; une demande pendant qu'elle tourne la fait refaire ensuite.
  function synchroniser() {
    if (!cloud) return Promise.resolve();
    if (synchroEnCours) { synchroARefaire = true; return synchroEnCours; }
    synchroEnCours = (async () => {
      do { synchroARefaire = false; await uneSynchro(); } while (synchroARefaire && cloud);
    })().finally(() => { synchroEnCours = null; });
    return synchroEnCours;
  }

  async function uneSynchro() {
    const c = cloud;
    // Une page en retard (voir donneesFutures) ne lit ni n'envoie rien : ses listes sont vides, et un responsable
    // qui les enverrait viderait tous les appareils de consultation. Tout repart au rechargement de la page.
    if (pageEnRetard()) return;
    etatSynchro = 'encours';
    rendreEntete();
    try {
      for (let essai = 0; essai < 3; essai++) {
        // 1. Récupérer la version du cloud, seulement si elle a changé.
        const r = await appelCloud(c.adresse, '/api/donnees', { jeton: c.jeton, version: c.version });
        if (r.status === 401) { await refusDeLecture(r); return; }
        if (r.status === 200) {
          const etat = await r.json();
          const distant = etat.blob ? valider(await dechiffrer(etat.blob, c.cle)) : { familles: [], elements: [], forfaits: [] };
          if (cloud !== c) return; // déconnecté pendant l'échange
          majRole(c, etat.role);
          if (c.role === 'consultation') {
            // Appareil de consultation : les données de l'équipe remplacent les siennes. Il ne peut
            // rien modifier, donc il n'a rien à garder — et un PC à l'heure fausse ne peut plus
            // conserver un vieux prix pour toujours.
            if (etat.blob) remplacerParEquipe(distant);
          } else if (apporte(distant, donnees)) {
            const bilan = bilanFusion(distant);
            donnees = fusionner(donnees, distant);
            donneesIllisibles = false;
            if (!sauver()) { etatSynchro = ''; return; }
            rafraichir();
            const changes = bilan.nouveaux + bilan.modifies + bilan.supprimes;
            toast(changes ? `Forfaits mis à jour : ${pluriel(changes, 'changement')}` : 'Listes mises à jour');
          }
          // Écriture refusée, ou page passée en retard pendant l'échange : on s'arrête sans noter la version du
          // cloud, sinon elle passerait pour déjà lue après le rechargement et ces forfaits n'arriveraient jamais.
          if (pageEnRetard()) { etatSynchro = ''; return; }
          if (c.role === 'responsable' && apporte(donnees, distant)) c.aEnvoyer = true;
          c.version = etat.version;
        } else if (r.status !== 304) {
          throw new Error(`Le cloud a répondu ${r.status}.`);
        }

        // 2. Envoyer nos modifications (responsables seulement).
        if (c.role !== 'responsable' || !c.aEnvoyer) break;
        if (pageEnRetard()) { etatSynchro = ''; return; } // un autre onglet vient de passer à la version suivante
        if (horlogeFausse()) throw Object.assign(new Error(texteHorloge()), { horloge: true });
        // Remis à faux AVANT l'envoi : une modification faite pendant l'envoi le remet à vrai, et repartira.
        c.aEnvoyer = false;
        let p, reponse;
        try {
          const blob = await chiffrer({ format: FORMAT, version: VERSION_FORMAT, ...donnees }, c.cle);
          p = await appelCloud(c.adresse, '/api/donnees', { methode: 'PUT', jeton: c.jeton, corps: { version_precedente: c.version ?? 0, blob } });
          if (p.ok) reponse = await p.json();
        } finally {
          if (!reponse) c.aEnvoyer = true; // pas arrivé : on réessaiera
        }
        // Un autre responsable a envoyé entre-temps : on relit tout, on fusionne, on renvoie.
        if (p.status === 409) { c.version = null; continue; }
        if (p.status === 401) { await refusDeLecture(p); return; }
        if (!p.ok) throw new Error(p.status === 413 ? 'Trop de forfaits pour le cloud.' : `Le cloud a répondu ${p.status}.`);
        c.version = reponse.version;
        if (c.aEnvoyer) continue; // modifié pendant l'envoi : on renvoie tout de suite
        appareil.modifsEnAttente = 0; // le cloud garde maintenant ces modifications
        sauverAppareil();
        rendreRappel();
        break;
      }
      c.derniereSynchro = Date.now();
      etatSynchro = 'ok';
      erreurSynchro = '';
    } catch (err) {
      const reseau = err?.reseau === true || err instanceof TypeError || err?.name === 'AbortError';
      etatSynchro = err?.horloge ? 'horloge' : reseau ? 'horsligne' : 'erreur';
      erreurSynchro = err?.horloge ? err.message
        : reseau ? "Mise à jour injoignable : pas de réseau, ou le wifi du magasin la bloque."
        : err?.name === 'OperationError' ? "Les données du cloud sont illisibles avec la clé de cet appareil : demande un nouveau lien au responsable."
        : err?.message || String(err);
    } finally {
      if (cloud === c) sauverCloud();
      rendreEntete();
      rendreBandeaux();
    }
  }

  function texteHorloge() {
    const minutes = Math.round(Math.abs(ecartHorloge) / 60000);
    return `L'heure de cet appareil est fausse d'environ ${pluriel(minutes, 'minute')} : corrige-la (réglages de l'appareil), sinon tes modifications écraseraient celles des autres. Rien n'a été envoyé.`;
  }

  function majRole(c, role) {
    if (!ROLES_CLOUD.includes(role) || role === c.role) return;
    c.role = role;
    if (role === 'consultation' && appareil.modeModif) { appareil.modeModif = false; sauverAppareil(); }
  }

  function remplacerParEquipe(distant) {
    if (!apporte(distant, donnees) && !apporte(donnees, distant)) return;
    const bilan = bilanFusion(distant);
    donnees = distant;
    donneesIllisibles = false;
    if (!sauver()) return;
    appareil.modifsEnAttente = 0;
    sauverAppareil();
    rafraichir();
    const changes = bilan.nouveaux + bilan.modifies + bilan.supprimes;
    toast(changes ? `Forfaits mis à jour : ${pluriel(changes, 'changement')}` : 'Forfaits mis à jour');
  }

  // Un 401 veut dire deux choses très différentes : « retiré » (volontaire, l'appareil s'efface) ou
  // « inconnu » (le jeton a été perdu, ex. PC qui nettoie les sites : il faut un nouveau lien).
  async function refusDeLecture(r) {
    const raison = await r.json().then((x) => x.raison).catch(() => '');
    if (raison === 'retire') { retirerCetAppareil(); return; }
    etatSynchro = 'refus';
    erreurSynchro = "Cet appareil n'est plus connecté à la mise à jour : demande un nouveau lien au responsable.";
  }

  // Appareil retiré par un responsable (téléphone perdu, départ) : il efface sa copie. Seulement sur
  // ce motif explicite du cloud, jamais sur une panne : une coupure de réseau n'efface rien.
  function retirerCetAppareil() {
    // Les forfaits d'abord : une page en retard n'a pas le droit de les effacer (voir sauver), et l'appareil doit
    // alors rester connecté — la page à jour recevra le même refus du cloud et effacera. Déconnecté d'abord, il gardait tout.
    donnees = { familles: [], elements: [], forfaits: [] };
    if (!sauver()) { etatSynchro = ''; return; }
    cloud = null;
    sauverCloud();
    appareil.modeModif = false;
    appareil.modifsEnAttente = 0;
    appareil.favoris = [];
    appareil.recents = [];
    appareil.total = [];
    appareil.surnoms = {};
    sauverAppareil();
    etatSynchro = 'retire';
    erreurSynchro = 'Cet appareil a été retiré de la mise à jour : ses forfaits ont été effacés.';
    rafraichir();
  }

  // Appelée après chaque modification : envoi automatique, regroupé si on enchaîne les changements.
  function planifierEnvoi() {
    if (cloud?.role !== 'responsable') return;
    cloud.aEnvoyer = true;
    sauverCloud();
    rendreEntete();
    clearTimeout(minuteurEnvoi);
    minuteurEnvoi = setTimeout(synchroniser, DELAI_ENVOI);
  }

  function texteSynchro() {
    if (!cloud) return '';
    if (etatSynchro === 'encours') return ' · mise à jour…';
    if (etatSynchro === 'refus' || etatSynchro === 'retire') return ' · déconnecté';
    if (etatSynchro === 'horloge') return ' · heure fausse';
    // Les ennuis d'abord : « envoi en attente » tout seul laisserait croire que le cloud répond.
    if (etatSynchro === 'horsligne' || etatSynchro === 'erreur') return cloud.aEnvoyer ? ' · hors ligne, envoi en attente' : ' · hors ligne';
    if (cloud.aEnvoyer) return ' · envoi en attente';
    if (!cloud.derniereSynchro) return '';
    const d = new Date(cloud.derniereSynchro);
    return ` · à jour ${d.toDateString() === new Date().toDateString() ? fmtHeure.format(d) : dateCourte(d)}`;
  }

  /* ---------- Appairage ---------- */

  function lireLien(texte) {
    let hash;
    try { hash = new URL(String(texte).trim(), location.href).hash; } catch { return null; }
    const p = new URLSearchParams(hash.replace(/^#/, ''));
    const hote = p.get('maj');
    const inv = p.get('inv');
    const cle = p.get('cle');
    if (!hote || !inv || !cle) return null;
    const adresse = adresseDeHote(hote);
    if (!adresseCloudOk(adresse) || inv.length < 16 || !/^[A-Za-z0-9_-]{43}$/.test(cle)) return null;
    return { adresse, inv, cle };
  }

  function fabriquerLien(adresse, inv, cle) {
    const base = location.protocol.startsWith('http') ? location.origin + location.pathname : 'https://nationaliste.github.io/forfaits/';
    return `${base}#maj=${hoteDeAdresse(adresse)}&inv=${inv}&cle=${cle}`;
  }

  async function appairer(lien, nom) {
    const r = await appelCloud(lien.adresse, '/api/appairage', { methode: 'POST', corps: { code: lien.inv, nom } }).catch(() => null);
    if (!r) throw new Error("Cloud injoignable : vérifie le réseau. Si le wifi du magasin le bloque, essaie en 4G.");
    if (r.status === 401) throw new Error('Ce lien a déjà servi ou a expiré : demande-en un nouveau au responsable.');
    if (!r.ok) throw new Error(`Le cloud a répondu ${r.status}.`);
    const rep = await r.json();
    // Ce que « chargerCloud » refuserait au prochain chargement est refusé TOUT DE SUITE : sinon
    // l'appareil s'enregistre dans un état que la page rejette en silence au rechargement
    // (« non connecté », forfaits figés), et tout le parc est à reconnecter un par un.
    if (!ROLES_CLOUD.includes(rep?.role) || typeof rep?.jeton !== 'string' || rep.jeton.length < 20) {
      throw new Error('Réponse inattendue du cloud : demande un nouveau lien au responsable.');
    }
    cloud = { adresse: lien.adresse, jeton: rep.jeton, cle: lien.cle, role: rep.role, id: rep.id, version: null, derniereSynchro: 0, aEnvoyer: false };
    sauverCloud();
    if (cloud.role === 'consultation' && appareil.modeModif) { appareil.modeModif = false; sauverAppareil(); }
    await synchroniser();
  }

  // Lien ouvert dans le navigateur (PC, Android). On efface le « # » AVANT de lire le lien : la
  // clé de l'équipe y est en clair, et un lien refusé (coupé par la messagerie, sous-domaine pas
  // encore renseigné) la laissait affichée, dans l'historique du navigateur et sur les captures,
  // sans un mot. Et on le dit, au lieu de ne rien faire du tout.
  async function appairerDepuisAdresse() {
    const brut = location.href;
    const avaitLien = location.hash.includes('maj=');
    if (avaitLien) history.replaceState(null, '', location.origin + location.pathname);
    const lien = lireLien(brut);
    if (!lien) {
      if (avaitLien) {
        await informer('Lien inutilisable', cloudPasConfigure
          ? "Cette version de l'outil n'a pas encore l'adresse du cloud de l'équipe : ce lien ne peut pas servir. En attendant, Exporter et Importer font le partage."
          : "Ce lien de mise à jour n'est pas valable, ou il a été coupé en route : demandes-en un nouveau au responsable.");
      }
      return;
    }
    if (cloud) { toast('Cet appareil est déjà connecté à la mise à jour'); return; }
    if (lectureSeule()) return;  // le lien n'a pas servi : il se rouvre une fois la page rechargée
    try {
      await appairer(lien, '');
      toast(cloud?.role === 'responsable' ? 'Connecté : tes modifications partiront toutes seules' : 'Connecté : les mises à jour arrivent toutes seules');
    } catch (err) {
      await informer('Connexion impossible', err.message);
    }
  }

  /* ---------- Fenêtres ---------- */

  function ouvrirMaj() {
    if (lectureSeule()) return;  // connecter, revenir à une version… : tout ici lit ou écrit les forfaits
    if (cloud) { ouvrirEtatMaj(); return; }
    const dlg = ouvrirDialogue({
      titre: 'Mise à jour automatique',
      corps: [
        h('p', { class: 'dlg-message' }, "Les forfaits arrivent tout seuls sur cet appareil, dès qu'un responsable les change. Ils sont chiffrés avant de partir : le cloud ne peut pas les lire."),
        h('p', { class: 'dlg-message' }, 'Pour connecter cet appareil, demande un lien à un responsable, puis colle-le ici.'),
        cloudPasConfigure ? h('p', { class: 'msg-erreur', role: 'alert' }, "Cette version de l'outil n'a pas encore l'adresse du cloud de l'équipe : la mise à jour automatique ne peut rien contacter. En attendant, Exporter et Importer font le partage.") : null,
      ],
      pied: [
        h('button', { type: 'button', class: 'btn btn-rouge', id: 'btn-coller-lien', onclick: () => { dlg.close(); ouvrirConnexion(); } }, 'Coller un lien'),
        h('button', { type: 'button', class: 'btn btn-bord', id: 'btn-premier-appareil', onclick: () => { dlg.close(); ouvrirPremierAppareil(); } }, 'Premier appareil'),
      ],
    });
  }

  const champCloud = (id, attributs) => h('input', { id, class: 'champ', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', ...attributs });
  const groupeCloud = (label, c, aide) => h('div', { class: 'champ-groupe' }, h('label', { for: c.id }, label), c, aide ? h('p', { class: 'msg-champ aide-champ' }, aide) : null);

  function ouvrirConnexion() {
    const champLien = champCloud('maj-lien', { type: 'text', inputmode: 'url', placeholder: 'https://…#maj=…' });
    const champNom = champCloud('maj-nom', { type: 'text', maxlength: '40', autocapitalize: 'sentences', placeholder: 'PC du comptoir, téléphone du magasin…' });
    const msgErreur = h('p', { class: 'msg-erreur', role: 'alert' });
    const bouton = h('button', { type: 'submit', class: 'btn btn-rouge', id: 'maj-connecter' }, 'Connecter');
    const dlg = ouvrirDialogue({
      titre: 'Connecter cet appareil',
      surEnvoi: async () => {
        msgErreur.textContent = '';
        const lien = lireLien(champLien.value);
        if (!lien) { msgErreur.textContent = "Ce n'est pas un lien de mise à jour valable : copie-le en entier."; return; }
        bouton.disabled = true;
        bouton.textContent = 'Connexion…';
        try {
          await appairer(lien, champNom.value);
          dlg.close();
          if (etatSynchro !== 'ok') toast(`Connecté, mais la première mise à jour a échoué : ${erreurSynchro}`, true);
          else toast(cloud?.role === 'responsable' ? 'Connecté : tes modifications partiront toutes seules' : 'Connecté : les mises à jour arrivent toutes seules');
        } catch (err) {
          msgErreur.textContent = err.message;
          bouton.disabled = false;
          bouton.textContent = 'Connecter';
        }
      },
      corps: [
        h('p', { class: 'dlg-message' }, 'Colle le lien donné par un responsable. Un lien ne sert que quelques minutes.'),
        groupeCloud('Lien de mise à jour', champLien),
        groupeCloud('Nom de cet appareil (facultatif)', champNom, "Pour le reconnaître dans la liste des appareils. Ce nom-là n'est pas chiffré : mets un nom de poste, pas un prénom."),
        msgErreur,
      ],
      pied: [bouton, h('button', { type: 'button', class: 'btn btn-bord', onclick: () => dlg.close() }, 'Annuler')],
    });
    champLien.focus();
  }

  // Tout premier appareil de l'équipe : il n'y a pas encore de lien, donc l'adresse du cloud et le
  // code de secours se saisissent à la main. C'est aussi la porte de secours si tous les appareils
  // responsables sont perdus.
  function ouvrirPremierAppareil() {
    const champAdresse = champCloud('maj-adresse', { type: 'text', inputmode: 'url', placeholder: 'xxxxx.' + COMPTE_CLOUD + '.workers.dev' });
    const champCode = champCloud('maj-code', { type: 'password' });
    const champNom = champCloud('maj-nom1', { type: 'text', maxlength: '40', autocapitalize: 'sentences', placeholder: 'PC du responsable' });
    const msgErreur = h('p', { class: 'msg-erreur', role: 'alert' });
    const bouton = h('button', { type: 'submit', class: 'btn btn-rouge', id: 'maj-initialiser' }, 'Connecter');
    const dlg = ouvrirDialogue({
      titre: 'Premier appareil',
      surEnvoi: async () => {
        msgErreur.textContent = '';
        bouton.disabled = true;
        bouton.textContent = 'Connexion…';
        try {
          await premierAppareil(champAdresse.value, champCode.value, champNom.value);
          dlg.close();
        } catch (err) {
          msgErreur.textContent = err.message;
          bouton.disabled = false;
          bouton.textContent = 'Connecter';
        }
      },
      corps: [
        h('p', { class: 'dlg-message' }, "Réservé au responsable qui met en place la mise à jour, ou qui la reprend si tous les appareils responsables sont perdus. Les autres appareils se connectent avec un lien."),
        groupeCloud('Adresse du cloud', champAdresse),
        groupeCloud('Code de secours', champCode),
        groupeCloud('Nom de cet appareil (facultatif)', champNom),
        msgErreur,
      ],
      pied: [bouton, h('button', { type: 'button', class: 'btn btn-bord', onclick: () => dlg.close() }, 'Annuler')],
    });
    champAdresse.focus();
  }

  async function premierAppareil(saisieAdresse, code, nom) {
    const adresse = adresseDeHote(String(saisieAdresse).trim().replace(/^https?:\/\//, '').replace(/\/+$/, ''));
    if (!adresseCloudOk(adresse)) throw new Error(`Adresse invalide : elle se termine par .${COMPTE_CLOUD}.workers.dev`);
    if (code.length < 12) throw new Error('Code de secours trop court (12 caractères minimum).');
    const r = await appelCloud(adresse, '/api/initialiser', { methode: 'POST', corps: { code_secours: code, nom } }).catch(() => null);
    if (!r) throw new Error("Cloud injoignable : vérifie l'adresse et le réseau.");
    if (r.status === 401) throw new Error('Code de secours incorrect.');
    if (r.status === 503) throw new Error("Le cloud refuse : son code de secours fait moins de 12 caractères. Repose-le avec « wrangler secret put CODE_SECOURS ».");
    if (!r.ok) throw new Error(`Le cloud a répondu ${r.status}.`);
    const rep = await r.json();
    if (typeof rep?.jeton !== 'string' || rep.jeton.length < 20) {
      throw new Error('Réponse inattendue du cloud : réessaie dans un instant.');
    }
    // Le cloud garde-t-il déjà des forfaits ? Ils sont chiffrés avec une clé que cet appareil n'a
    // pas : on ne peut que repartir des forfaits d'ici, ce qui se demande avant de le faire.
    const lu = await appelCloud(adresse, '/api/donnees', { jeton: rep.jeton });
    const etat = lu.ok ? await lu.json() : { blob: null, version: 0 };
    if (etat.blob) {
      const ok = await demander({
        titre: 'Le cloud contient déjà des forfaits',
        message: "Ils sont chiffrés avec une clé que cet appareil n'a pas : impossible de les lire. Les forfaits de CET appareil peuvent les remplacer — les autres appareils devront alors être reconnectés avec un nouveau lien.",
        boutons: [{ texte: 'Remplacer', valeur: true, classe: 'btn-danger' }, { texte: 'Annuler', valeur: false }],
      });
      if (!ok) throw new Error('Connexion annulée. Pour lire ces forfaits, connecte cet appareil avec un lien venu d’un appareil déjà connecté.');
    }
    // Nouvelle clé d'équipe, tirée au hasard ici. Elle ne partira jamais vers le cloud.
    const cle = enB64url(crypto.getRandomValues(new Uint8Array(32)));
    cloud = { adresse, jeton: rep.jeton, cle, role: 'responsable', id: rep.id, version: etat.version, derniereSynchro: 0, aEnvoyer: true };
    sauverCloud();
    await synchroniser();
    if (etatSynchro !== 'ok') toast(`Connecté, mais le premier envoi a échoué : ${erreurSynchro}`, true);
    else toast('Mise à jour en place : les forfaits de cet appareil sont dans le cloud');
  }

  function ouvrirEtatMaj() {
    const etat = h('p', { class: 'dlg-message', id: 'maj-etat' });
    const majEtat = () => {
      etat.textContent = etatSynchro === 'encours' ? 'Mise à jour en cours…'
        : erreurSynchro ? erreurSynchro
        : cloud?.derniereSynchro ? `À jour : dernière vérification le ${fmtDateHeure.format(new Date(cloud.derniereSynchro))}.`
        : '';
    };
    majEtat();
    const patron = cloud.role === 'responsable';
    const fermerPuis = (action) => () => { dlg.close(); action(); };
    const dlg = ouvrirDialogue({
      titre: 'Mise à jour automatique',
      corps: [
        h('ul', { class: 'dlg-liste' },
          h('li', {}, 'Cloud : ', h('strong', {}, hoteDeAdresse(cloud.adresse))),
          h('li', {}, patron ? 'Responsable : tes modifications partent toutes seules.' : 'Consultation : les mises à jour arrivent toutes seules, cet appareil ne modifie rien.')),

  function ouvrirAjoutAppareil() {
    let role = 'consultation';
    let lot = false;
    const champNom = champCloud('maj-nom-appareil', { type: 'text', maxlength: '40', autocapitalize: 'sentences', placeholder: 'PC du comptoir' });

    const bouton = h('button', { type: 'submit', class: 'btn btn-rouge', id: 'maj-creer-lien' }, 'Créer le lien');

    const choix = (valeurs, lire, ecrire, libelle) => {
      const boutons = valeurs.map(({ valeur, texte }) => h('button', { type: 'button', 'data-choix': String(valeur), onclick: () => { ecrire(valeur); marquer(); } }, texte));
      const marquer = () => boutons.forEach((b) => {
        const actif = b.dataset.choix === String(lire());
        b.className = 'btn ' + (actif ? 'btn-rouge' : 'btn-bord');
        b.setAttribute('aria-pressed', String(actif));
      });
      marquer();
      return h('div', { class: 'groupe-theme', role: 'group', 'aria-label': libelle }, ...boutons);
    };

    const dlg = ouvrirDialogue({
      titre: 'Ajouter un appareil',
      surEnvoi: async () => {
        msgErreur.textContent = '';
        bouton.disabled = true;
        bouton.textContent = 'Création…';
        try {
          const r = await appelCloud(cloud.adresse, '/api/invitation', {
            methode: 'POST', jeton: cloud.jeton,
            corps: { role, nom: champNom.value, usages: lot ? LOT_MAX : 1, minutes: lot ? MINUTES_LOT : MINUTES_LIEN },
          });
          if (!r.ok) throw new Error(`Le cloud a répondu ${r.status}.`);
          const inv = await r.json();
          montrerLien(zoneLien, fabriquerLien(cloud.adresse, inv.code, cloud.cle), lot);
          bouton.hidden = true;
        } catch (err) {
          msgErreur.textContent = err?.reseau ? 'Cloud injoignable : vérifie le réseau.' : err.message;
          bouton.disabled = false;
          bouton.textContent = 'Créer le lien';
        }

      corps: [
        h('p', { class: 'dlg-message' }, "Le lien contient la clé de lecture de l'équipe : donne-le de la main à la main, ou par un message que tu effaces ensuite."),
        groupeCloud("Rôle de l'appareil", choix(
          [{ valeur: 'consultation', texte: 'Consultation' }, { valeur: 'responsable', texte: 'Responsable' }],
          () => role, (v) => { role = v; }, "Rôle de l'appareil",
        ), 'Consultation : cherche les forfaits et reçoit les mises à jour. Responsable : peut aussi les modifier.'),
        groupeCloud('Combien d’appareils', choix(
          [{ valeur: false, texte: '1 appareil' }, { valeur: true, texte: `Jusqu’à ${LOT_MAX}` }],
          () => lot, (v) => { lot = v; }, 'Combien d’appareils',
        ), `Un seul appareil : le lien vaut ${MINUTES_LIEN} minutes. Plusieurs : 24 h, pour équiper l’équipe en une séance. Chaque appareil reçoit malgré tout son propre accès, retirable seul.`),
        groupeCloud('Nom (facultatif)', champNom),
        zoneLien,
        msgErreur,
      ],
      pied: [bouton, h('button', { type: 'button', class: 'btn btn-bord', onclick: () => dlg.close() }, 'Fermer')],
    });
    champNom.focus();

  // Affiche le lien d'appairage : à lire, à copier, à partager (et le QR, s'il est disponible).
  function montrerLien(zone, lien, lot) {
    const champ = champCloud('maj-lien-cree', { type: 'text', readonly: true, value: lien });
    const boutons = [h('button', {
      type: 'button', class: 'btn btn-rouge', id: 'maj-copier-lien',
      onclick: async () => {
        try { await navigator.clipboard.writeText(lien); toast('Lien copié'); }
        catch { champ.select(); toast('Copie refusée par le navigateur : le lien est sélectionné, fais Ctrl+C', true); }
      },
    }, 'Copier le lien')];
    if (navigator.share) {
      boutons.push(h('button', {
        type: 'button', class: 'btn btn-bord', id: 'maj-partager-lien',
        onclick: () => navigator.share({ title: 'Mise à jour des forfaits', url: lien }).catch(() => {}),
      }, 'Partager'));
    }
    const dessinQr = qrCanvas(lien);
    // replaceChildren écrirait la chaîne « null » là où h() ignore un null : on filtre.
    zone.replaceChildren(...[
      h('label', { for: champ.id }, lot ? `Lien pour ${LOT_MAX} appareils (24 h)` : `Lien pour 1 appareil (${MINUTES_LIEN} minutes)`),
      champ,
      h('div', { class: 'groupe-theme' }, ...boutons),
      dessinQr,
      h('p', { class: 'msg-champ aide-champ' }, dessinQr
        ? "PC et Android : scanne le QR. Sur iPhone, le QR ouvre Safari au lieu de l'appli installée : copie le lien et colle-le dans l'appli (Menu → Mise à jour automatique → Coller un lien)."
        : "Sur iPhone : colle le lien dans l'appli installée (Menu → Mise à jour automatique → Coller un lien), pas dans Safari."),
    ].filter(Boolean));
    zone.hidden = false;
  }

  function ouvrirAppareils() {
    const liste = h('div', { class: 'menu-liste', id: 'maj-liste-appareils' }, h('p', { class: 'dlg-message' }, 'Chargement…'));
    const charge = async () => {
      try {
        const r = await appelCloud(cloud.adresse, '/api/appareils', { jeton: cloud.jeton });
        if (!r.ok) throw new Error(`Le cloud a répondu ${r.status}.`);
        const { appareils } = await r.json();
        liste.replaceChildren(...appareils.map((a) => h('div', { class: 'menu-mode' },
          h('div', {},
            h('strong', {}, a.nom + (a.moi ? ' (cet appareil)' : '')),
            h('p', {}, `${a.role === 'responsable' ? 'Responsable' : 'Consultation'} · vu ${a.vu ? dateCourte(a.vu) : 'jamais'}`)),
          h('button', {
            type: 'button', class: 'btn btn-danger', 'data-retirer': a.id,
            onclick: async () => {
              const ok = await demander({
                titre: `Retirer « ${a.nom} » ?`,
                message: a.moi
                  ? "C'est CET appareil : il perdra la mise à jour et effacera ses forfaits."
                  : "Cet appareil ne recevra plus rien, et effacera ses forfaits à sa prochaine ouverture avec du réseau.",
                boutons: [{ texte: 'Retirer', valeur: true, classe: 'btn-danger' }, { texte: 'Annuler', valeur: false }],
              });
              if (!ok) return;
              const d = await appelCloud(cloud.adresse, '/api/appareils/' + encodeURIComponent(a.id), { methode: 'DELETE', jeton: cloud.jeton });
              if (d.status === 409) { await informer('Impossible', "C'est le dernier appareil responsable : connecte-en un autre avant de retirer celui-ci, sinon personne ne pourra plus modifier les forfaits."); return; }
              if (!d.ok) { await informer('Impossible', `Le cloud a répondu ${d.status}.`); return; }
              toast(`« ${a.nom} » retiré`);
              if (a.moi) { retirerCetAppareil(); dlg.close(); return; }
              charge();
            },
          }, 'Retirer'))));
        if (!appareils.length) liste.replaceChildren(h('p', { class: 'dlg-message' }, 'Aucun appareil.'));
      } catch (err) {
        liste.replaceChildren(h('p', { class: 'msg-erreur', role: 'alert' }, err?.reseau ? 'Cloud injoignable : vérifie le réseau.' : err.message));
      }
    };
    const dlg = ouvrirDialogue({
      titre: 'Appareils connectés',
      corps: [h('p', { class: 'dlg-message' }, 'Retirer un appareil coupe son accès tout de suite. Sa copie des forfaits s’efface à sa prochaine ouverture avec du réseau.'), liste],
      pied: [h('button', { type: 'button', class: 'btn btn-bord', onclick: () => dlg.close() }, 'Fermer')],
    });
    charge();
